// ── SECTION 5: MIDI WRITER + INIT ─────────────────────────────────────────────

// ── Inline MIDI writer ─────────────────────────────────────────────────────────
const PPQN = 480

function noteToMidi(name, octave) { return (octave + 1) * 12 + (NOTE_TO_PC[name] ?? 0) }

function varLen(n) {
  if (n < 0) n = 0
  const bytes = [n & 0x7F]; n >>= 7
  while (n > 0) { bytes.unshift((n & 0x7F) | 0x80); n >>= 7 }
  return bytes
}

function midiWord(n)  { return [(n >> 8) & 0xFF, n & 0xFF] }
function midiDword(n) { return [(n>>24)&0xFF,(n>>16)&0xFF,(n>>8)&0xFF,n&0xFF] }

function timelineToTrackBytes(events) {
  events.sort((a, b) => {
    if (a.t !== b.t) return a.t - b.t
    const pri = e => e.type==='endTrack'?3:e.type==='noteOff'?1:e.type==='noteOn'?2:0
    return pri(a) - pri(b)
  })
  const bytes = []; let prevT = 0
  for (const ev of events) {
    bytes.push(...varLen(ev.t - prevT)); prevT = ev.t
    if (ev.type === 'tempo') {
      bytes.push(0xFF,0x51,0x03,(ev.us>>16)&0xFF,(ev.us>>8)&0xFF,ev.us&0xFF)
    } else if (ev.type === 'timesig') {
      bytes.push(0xFF,0x58,0x04,4,2,24,8) // 4/4
    } else if (ev.type === 'name') {
      const nb = Array.from(new TextEncoder().encode(ev.text))
      bytes.push(0xFF,0x03,...varLen(nb.length),...nb)
    } else if (ev.type === 'noteOn') {
      bytes.push(0x90|(ev.ch-1), ev.note&0x7F, ev.vel&0x7F)
    } else if (ev.type === 'noteOff') {
      bytes.push(0x80|(ev.ch-1), ev.note&0x7F, 0)
    } else if (ev.type === 'endTrack') {
      bytes.push(0xFF,0x2F,0x00)
    }
  }
  return bytes
}

function buildMidiFile(tracks) {
  const header = [0x4D,0x54,0x68,0x64,0,0,0,6, 0,tracks.length>1?1:0, ...midiWord(tracks.length), 0x01,0xE0]
  const all = [...header]
  for (const tl of tracks) {
    const data = timelineToTrackBytes(tl)
    all.push(0x4D,0x54,0x72,0x6B,...midiDword(data.length),...data)
  }
  return new Uint8Array(all)
}

// ── Chord track builder ────────────────────────────────────────────────────────
function buildChordTimeline(progression, bpm, pattern, barsPerChord, octave, trackName, ch) {
  const us = Math.round(60_000_000 / bpm)
  const slotsPerChord = 4 * barsPerChord
  const tl = [{ t:0,type:'tempo',us }, { t:0,type:'timesig' }]
  if (trackName) tl.push({ t:0,type:'name',text:trackName })
  let t = 0
  progression.forEach(chordNotes => {
    const pitches = chordNotes.map(n => noteToMidi(n, octave))
    if (pattern === 'block') {
      for (let s = 0; s < slotsPerChord; s++) {
        const on = t + s*PPQN
        pitches.forEach(p => { tl.push({t:on,type:'noteOn',ch,note:p,vel:80}); tl.push({t:on+PPQN,type:'noteOff',ch,note:p}) })
      }
    } else if (pattern === 'arpeggio') {
      for (let s = 0; s < slotsPerChord; s++) {
        const p = pitches[s % pitches.length], on = t + s*PPQN
        tl.push({t:on,type:'noteOn',ch,note:p,vel:75}); tl.push({t:on+PPQN,type:'noteOff',ch,note:p})
      }
    } else if (pattern === 'alberti') {
      const pat = pitches.length >= 3
        ? [pitches[0],pitches[pitches.length-1],pitches[1],pitches[pitches.length-1]]
        : [pitches[0],pitches[pitches.length-1]]
      const eighth = PPQN/2, total = 8*barsPerChord
      for (let s = 0; s < total; s++) {
        const p = pat[s%pat.length], on = t + s*eighth
        tl.push({t:on,type:'noteOn',ch,note:p,vel:70}); tl.push({t:on+eighth,type:'noteOff',ch,note:p})
      }
    } else { // pad
      for (let bar = 0; bar < barsPerChord; bar++) {
        const on = t + bar*4*PPQN
        pitches.forEach(p => { tl.push({t:on,type:'noteOn',ch,note:p,vel:45}); tl.push({t:on+4*PPQN,type:'noteOff',ch,note:p}) })
      }
    }
    t += (pattern==='alberti' ? 8*barsPerChord*(PPQN/2) : pattern==='pad' ? barsPerChord*4*PPQN : slotsPerChord*PPQN)
  })
  tl.push({t,type:'endTrack'}); return tl
}

// ── Melody track builder ───────────────────────────────────────────────────────
function buildMelodyRange(scaleNotes, startOctave) {
  const out = []; let octave = startOctave, prevSemi = NOTE_TO_PC[scaleNotes[0]] ?? 0
  for (let rep = 0; rep < 2; rep++) {
    scaleNotes.forEach((n, i) => {
      const semi = NOTE_TO_PC[n] ?? 0
      if (rep > 0 || i > 0) { if (semi <= prevSemi) octave++ }
      prevSemi = semi; out.push((octave+1)*12 + semi)
    })
  }
  return out
}

function closestIdx(midi, range) {
  let best=0, bestD=Infinity
  range.forEach((v,i) => { const d=Math.abs(v-midi); if(d<bestD){bestD=d;best=i} }); return best
}

function genStepwiseMelody(progression, scaleNotes, melOct, slots) {
  const range=buildMelodyRange(scaleNotes,melOct-1), lo=Math.max(0,Math.floor(range.length*0.25)), hi=Math.min(range.length-1,Math.ceil(range.length*0.75))
  let pos=Math.floor((lo+hi)/2), dir=1; const out=[]
  progression.forEach(chord => {
    const snap=Math.max(lo,Math.min(hi,closestIdx((melOct+1)*12+(NOTE_TO_PC[chord[0]]??0),range)))
    if(pos<snap)pos=Math.min(pos+1,snap); else if(pos>snap)pos=Math.max(pos-1,snap)
    for(let s=0;s<slots;s++){
      out.push({midi:range[pos],dur:'4'})
      const r=Math.random(); pos+=r<0.65?dir:r<0.82?-dir:r<0.92?dir*2:0
      if(pos<lo){dir=1;pos=lo} if(pos>hi){dir=-1;pos=hi} if(Math.random()<0.14)dir=-dir
    }
  }); return out
}

function genLeapingMelody(progression, scaleNotes, melOct, slots) {
  const range=buildMelodyRange(scaleNotes,melOct-1), lo=Math.max(0,Math.floor(range.length*0.2)), hi=Math.min(range.length-1,Math.ceil(range.length*0.8))
  const out=[]
  progression.forEach(chord => {
    let pos=Math.max(lo,Math.min(hi,closestIdx((melOct+1)*12+(NOTE_TO_PC[chord[0]]??0),range)))
    for(let s=0;s<slots;s++){
      out.push({midi:range[pos],dur:'4'})
      const leap=2+Math.floor(Math.random()*3), r=Math.random()
      pos+=r<0.5?leap:r<0.85?-leap:1; pos=Math.max(lo,Math.min(hi,pos))
    }
  }); return out
}

function genCallResponseMelody(progression, scaleNotes, melOct, slots) {
  const range=buildMelodyRange(scaleNotes,melOct-1), lo=Math.max(0,Math.floor(range.length*0.25)), hi=Math.min(range.length-1,Math.ceil(range.length*0.75))
  const half=Math.floor(progression.length/2); let pos=Math.floor((lo+hi)/2); const out=[]
  progression.forEach((_chord,ci) => {
    const dir=ci<half?1:-1
    for(let s=0;s<slots;s++){
      out.push({midi:range[pos],dur:'4'})
      const r=Math.random(); pos+=r<0.55?dir:r<0.75?dir*2:r<0.9?-dir:0; pos=Math.max(lo,Math.min(hi,pos))
    }
  }); return out
}

function applyPassingNotes(notes) {
  const out=[]
  for(let i=0;i<notes.length;i++){
    const cur=notes[i], next=notes[i+1]
    if(next&&cur.dur==='4'&&Math.random()<0.35){
      const diff=next.midi-cur.midi
      if(Math.abs(diff)===2){ out.push({...cur,dur:'8'}); out.push({midi:cur.midi+(diff>0?1:-1),dur:'8'}); continue }
    }; out.push(cur)
  }; return out
}

function buildMelodyTimeline(progression, scaleNotes, melOct, barsPerChord, style, passingNotes, trackName, ch) {
  const us = Math.round(60_000_000 / ST.midiBpm)
  const slots = 4 * barsPerChord
  const tl = [{t:0,type:'tempo',us},{t:0,type:'timesig'}]
  if (trackName) tl.push({t:0,type:'name',text:trackName})
  let raw
  if (style==='leaping') raw=genLeapingMelody(progression,scaleNotes,melOct,slots)
  else if (style==='callresponse') raw=genCallResponseMelody(progression,scaleNotes,melOct,slots)
  else raw=genStepwiseMelody(progression,scaleNotes,melOct,slots)
  if (passingNotes) raw=applyPassingNotes(raw)
  const DMAP = {'1':4*PPQN,'2':2*PPQN,'4':PPQN,'8':PPQN/2,'16':PPQN/4}
  let t=0
  raw.forEach(({midi,dur}) => {
    const d=DMAP[dur]||PPQN
    tl.push({t,type:'noteOn',ch,note:midi,vel:65}); tl.push({t:t+d,type:'noteOff',ch,note:midi}); t+=d
  })
  tl.push({t,type:'endTrack'}); return tl
}

// ── Bass track builder ─────────────────────────────────────────────────────────
function buildBassTimeline(progression, bpm, barsPerChord, opts, trackName, ch) {
  const us = Math.round(60_000_000 / bpm)
  const tl = [{t:0,type:'tempo',us},{t:0,type:'timesig'}]
  if (trackName) tl.push({t:0,type:'name',text:trackName})
  let t=0
  const bassOct = opts.style==='808' ? 2 : opts.bassOctave
  function on(note,oct,dur,vel) { const m=noteToMidi(note,oct); tl.push({t,type:'noteOn',ch,note:m,vel}); tl.push({t:t+dur,type:'noteOff',ch,note:m}); t+=dur }
  function rest(dur) { t+=dur }

  progression.forEach((chordNotes, ci) => {
    const root=chordNotes[0], third=chordNotes[1]??chordNotes[0], fifth=chordNotes[2]??chordNotes[0]
    const nextRoot=progression[(ci+1)%progression.length][0]
    const nextMidi=noteToMidi(nextRoot,bassOct), passMidi=nextMidi-2
    const passChr=CHROMATIC_SHARP[((passMidi%12)+12)%12], passOct=Math.floor(passMidi/12)-1

    for (let bar=0; bar<barsPerChord; bar++) {
      const gBar=ci*barsPerChord+bar
      if (opts.style==='rootnotes') {
        if (opts.rhythm==='whole')   { on(root,bassOct,4*PPQN,90) }
        else if (opts.rhythm==='half') { on(root,bassOct,2*PPQN,90); on(root,bassOct,2*PPQN,75) }
        else { on(root,bassOct,PPQN,90); on(root,bassOct,PPQN,75); on(root,bassOct,PPQN,75); on(root,bassOct,PPQN,75) }
      } else if (opts.style==='walking') {
        on(root,bassOct,PPQN,80); on(gBar%2===0?third:fifth,bassOct,PPQN,80); on(passChr,passOct,PPQN,80); on(fifth,bassOct,PPQN,80)
      } else if (opts.style==='subbass') {
        on(root,bassOct,4*PPQN,85)
      } else { // 808
        if (opts.pattern808==='straight') { on(root,2,PPQN,95); on(root,2,PPQN,95); on(root,2,PPQN,95); on(root,2,PPQN,95) }
        else if (opts.pattern808==='boombap') { on(root,2,PPQN,100); rest(PPQN); on(root,2,PPQN,85); rest(PPQN) }
        else if (opts.pattern808==='halftime') { on(root,2,2*PPQN,100); on(root,2,2*PPQN,95) }
        else { on(root,2,PPQN,100); on(root,2,PPQN/2,60); rest(PPQN/2); on(root,2,PPQN,95); on(root,2,PPQN/2,55); rest(PPQN/2) } // trapbasic approx
      }
    }
  })
  tl.push({t,type:'endTrack'}); return tl
}

// ── generateMidi ───────────────────────────────────────────────────────────────
function generateMidi(progression, scaleNotes) {
  const bpm          = ST.midiBpm
  const pattern      = ST.midiPattern
  const barsPerChord = Math.max(1, Math.round(ST.midiTotalBars / progression.length))
  const octaveMap    = { low:3, mid:4, high:5 }
  const octave       = octaveMap[ST.midiOctaveLevel]
  const exportMode   = ST.midiExportMode
  const inclChords   = ['chords','chords+melody','chords+bass','all'].includes(exportMode)
  const inclMelody   = ['melody','chords+melody','melody+bass','all'].includes(exportMode)
  const inclBass     = ['bass','chords+bass','melody+bass','all'].includes(exportMode)
  const multiTrack   = [inclChords,inclMelody,inclBass].filter(Boolean).length > 1

  const tracks = []
  if (inclChords) tracks.push(buildChordTimeline(progression,bpm,pattern,barsPerChord,octave,multiTrack?'Chords':null,1))
  if (inclMelody) {
    const melOct = inclChords ? octave+1 : octave
    tracks.push(buildMelodyTimeline(progression,scaleNotes,melOct,barsPerChord,ST.midiMelodyStyle,ST.midiPassingNotes,multiTrack?'Melody':null,2))
  }
  if (inclBass) {
    const bassOpts = { style:ST.midiBassStyle, bassOctave:ST.midiBassOctave, rhythm:ST.midiBassRhythm, pattern808:ST.midiBass808Pattern }
    tracks.push(buildBassTimeline(progression,bpm,barsPerChord,bassOpts,multiTrack?'Bass':null,3))
  }
  if (tracks.length === 0) tracks.push(buildChordTimeline(progression,bpm,pattern,barsPerChord,octave,null,1))
  return new Blob([buildMidiFile(tracks)], { type:'audio/midi' })
}

// ── MIDI download ──────────────────────────────────────────────────────────────
function handleMidiDownload() {
  if (ST.midiOptionsProgIdx === null) return
  const refScale = findRefScale(ST.refRoot, ST.refType)
  const diatonic = refScale ? buildDiatonicChords(refScale) : null
  let progression, progLabel

  if (ST.midiOptionsProgIdx === -1) {
    const filled = ST.customSlots.filter(s => s !== null); if (filled.length < 2) return
    progression = filled.map(s => s.notes); progLabel = 'custom'
  } else if (ST.midiOptionsComplex) {
    const p = COMPLEX_PROGRESSIONS[ST.midiOptionsProgIdx]; if (!refScale) return
    progression = p.chords.map(ch => buildExtendedChordNotes(refScale, ch)); progLabel = p.chords.map(c=>c.label).join('-')
  } else {
    if (!diatonic) return
    const p = PROGRESSIONS[ST.midiOptionsProgIdx]
    progression = p.indices.map(i => diatonic[i].notes); progLabel = p.label
  }

  const scaleNotes = refScale ? refScale.notes : ['C','D','E','F','G','A','B']
  const blob = generateMidi(progression, scaleNotes)
  const barsEach = Math.max(1, Math.round(ST.midiTotalBars / progression.length))
  const prefix = ST.midiOptionsProgIdx === -1 ? 'custom' : toFilenameSlug(refScale?.name ?? 'scale')
  const parts = []
  if (['chords','chords+melody','chords+bass','all'].includes(ST.midiExportMode)) parts.push(ST.midiPattern)
  if (['melody','chords+melody','melody+bass','all'].includes(ST.midiExportMode)) parts.push(ST.midiMelodyStyle)
  if (['bass','chords+bass','melody+bass','all'].includes(ST.midiExportMode)) parts.push(ST.midiBassStyle)
  const filename = `${prefix}-${toFilenameSlug(progLabel)}-${parts.join('-')||'export'}-${ST.midiTotalBars}bars-${ST.midiBpm}bpm.mid`

  const url = URL.createObjectURL(blob)
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click()
  URL.revokeObjectURL(url)
  ST.midiMode = false; ST.midiOptionsProgIdx = null; renderMidiStudio()
}

    </div>

        <h2 style="font-size:1rem;color:var(--ink);font-weight:600;margin:0 0 4px">midi studio</h2>
        <p style="font-size:0.78rem;color:var(--muted);margin:0">compose and export midi progressions</p>
      </div>
      <div id="st-midi-studio" style="display:flex;flex-direction:column;gap:16px"></div>
    </div>`

  // Hide tip for non-quiz modes
  function updateTip() {
    const tip = document.getElementById('st-tip')
    if (tip) tip.style.display = ['builder','namekey'].includes(ST.mode) ? '' : 'none'
  }

  // Populate quiz state for loaded mode
  const pool = activePool().length > 0 ? activePool() : SCALES
  if (ST.mode === 'namekey') {
    const p = pool.length >= 4 ? pool : SCALES; ST.mcOptions = generateOptions(ST.currentScale, p)
  }
  if (ST.mode === 'scaleear') {
    const p = pool.length >= 4 ? pool : SCALES; ST.scaleearOptions = generateScaleEarOptions(ST.currentScale, p)
  }
  if (ST.mode === 'chordear') { const notes = setupChordearQuestion(); synth.playSustainedChord(notes) }
  if (ST.mode === 'intervals') { const d = setupIntervalQuestion(); playIntervalNotes(d.root, d.rootOct, d.upper, d.upperOct, ST.intervalAscending) }

  // Patch changeMode to also update tip
  const _changeMode = changeMode
  window.changeMode = function(m) { _changeMode(m); updateTip() }

  renderStatusBar()
  renderControls()
  updateTip()
  renderModeContent()
  renderMidiStudio()
}
