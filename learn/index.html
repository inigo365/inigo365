<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>learn — inigo365</title>
  <link rel="icon" type="image/png" href="../images/icon.png">
  <link rel="stylesheet" href="shared/learn.css">
  <style>
    @font-face {
      font-family: 'RuneScape UF';
      src: url('../../fonts/RuneScape-UF.woff2') format('woff2'),
           url('../../fonts/RuneScape-UF.woff')  format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'RuneScape UF', monospace;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 40px 24px 24px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .learn-panel {
      background: rgba(255, 255, 255, 0.69);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #000;
      border-radius: 0;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      padding: 22px 22px 18px;
      width: 56vw;
      min-width: 420px;
      height: calc(100vh - 48px);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
      z-index: 20;
    }

    .site-banner {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 0 18px;
      flex: 0 0 auto;
      flex-shrink: 0;
    }
    .site-banner img {
      width: min(980px, 100%);
      height: auto;
      max-height: clamp(60px, 10vw, 120px);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    @media (max-width: 768px) {
      .site-banner {
        margin-bottom: 14px;
      }
      .site-banner img {
        max-height: clamp(50px, 14vw, 90px);
      }
    }

    .pill-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #tool-frame {
      display: none;
      width: 100%;
      height: calc(100vh - 180px);
      min-height: 300px;
      border: none;
      background: transparent;
      flex-shrink: 0;
    }

    .pokemon-pill {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      padding: 14px 16px;
      background: white;
      border: 2px solid #000;
      border-radius: 0;
      font-family: 'RuneScape UF', monospace;
      color: #1A3A5C;
      text-decoration: none;
      cursor: url('../../images/cursor/cursor-hover.png'), pointer;
      transition: background 0.12s;
      gap: 0;
    }
    .pokemon-pill:hover, .pokemon-pill.active {
      background: #D6E8F7;
    }
    .pill-icon {
      width: 36px;
      min-width: 36px;
      text-align: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .pill-label {
      flex: 1;
      font-family: 'RuneScape UF', monospace;
      font-size: 1rem;
      color: #1A3A5C;
      text-align: center;
    }
    .pill-desc {
      width: 140px;
      min-width: 140px;
      font-family: 'RuneScape UF', monospace;
      font-size: 0.75rem;
      color: #8A9BB0;
      text-align: right;
      flex-shrink: 0;
    }

    #hub-view {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    #tool-view {
      display: none;
      flex-direction: column;
      overflow: hidden;
      padding-top: 4px;
    }

    .back-btn {
      display: none;
      flex-shrink: 0;
      font-family: 'RuneScape UF', monospace;
      font-size: 0.85rem;
      color: #1A3A5C;
      background: none;
      border: none;
      cursor: url('../../images/cursor/cursor-hover.png'), pointer;
      margin-bottom: 14px;
      padding: 0;
      letter-spacing: 0.5px;
    }
    .back-btn:hover { color: #4A7FD4; }

    @media (max-width: 700px) {
      html, body {
        height: auto;
        overflow: auto;
      }
      body {
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
        min-height: 100vh;
        height: auto;
      }
      .learn-panel {
        width: 100%;
        height: auto;
        max-height: none;
        overflow: visible;
      }
      #hub-view, #tool-view, #tool-frame {
        overflow: visible;
        flex: none;
        height: auto;
      }
    }

    @media (min-width: 701px) {
      .friend-sprite {
        position: fixed;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 38vw;
        max-width: 520px;
        pointer-events: none;
        z-index: 10;
        image-rendering: pixelated;
      }
    }
  </style>
</head>
<body>

  <!-- Desktop sprite (left side) -->
  <img class="friend-sprite" src="../go/images/friend-spin.gif" alt="">

  <!-- Main panel -->
  <div class="learn-panel" id="learn-panel">

    <!-- Hub view -->
    <div id="hub-view">
      <div class="site-banner" aria-label="inigo365 banner">
        <img src="../go/images/inigo365-banner.png" alt="inigo365">
      </div>
      <div class="pill-stack">
        <button class="pokemon-pill" onclick="loadTool('guitar-tuner.html', this)">
          <span class="pill-icon">♩</span>
          <span class="pill-label">guitar tuner</span>
          <span class="pill-desc">tune via mic</span>
        </button>
        <button class="pokemon-pill" onclick="loadTool('ear-training.html', this)">
          <span class="pill-icon">♪</span>
          <span class="pill-label">ear training</span>
          <span class="pill-desc">identify intervals</span>
        </button>
        <button class="pokemon-pill" onclick="loadTool('song-analyser.html', this)">
          <span class="pill-icon">◎</span>
          <span class="pill-label">song analyser</span>
          <span class="pill-desc">key + bpm detection</span>
        </button>
        <button class="pokemon-pill" onclick="loadTool('scale-trainer.html', this)">
          <span class="pill-icon">▦</span>
          <span class="pill-label">scale trainer</span>
          <span class="pill-desc">scales, chords + progressions</span>
        </button>
        <button class="pokemon-pill" onclick="loadTool('midi-studio.html', this)">
          <span class="pill-icon">♫</span>
          <span class="pill-label">midi studio</span>
          <span class="pill-desc">compose + export</span>
        </button>
      </div>
    </div>

    <!-- Tool view -->
    <div id="tool-view" style="display:none;">
      <div class="site-banner" aria-label="inigo365 banner">
        <img src="../go/images/inigo365-banner.png" alt="inigo365">
      </div>
      <button class="back-btn" id="back-btn" onclick="goBack()">← back</button>
      <iframe id="tool-frame" class="tool-frame" src="" title="tool"></iframe>
    </div>

  </div>

  <script>
    function loadTool(src, btn) {
      document.getElementById('hub-view').style.display = 'none';
      document.getElementById('tool-view').style.display = 'block';
      document.getElementById('back-btn').style.display = 'block';
      const frame = document.getElementById('tool-frame');
      frame.style.display = 'block';
      frame.src = src;
    }
    function goBack() {
      document.getElementById('hub-view').style.display = 'block';
      document.getElementById('tool-view').style.display = 'none';
      document.getElementById('tool-frame').src = '';
    }
    function goHome() {
      goBack();
    }
    document.getElementById('tool-frame').onload = function() {
      try {
        const doc = this.contentDocument || this.contentWindow.document;
        doc.documentElement.style.height = '100%';
        doc.documentElement.style.overflowY = 'auto';
        doc.documentElement.style.overflowX = 'hidden';
        doc.body.style.height = '100%';
        doc.body.style.overflowY = 'auto';
        doc.body.style.overflowX = 'hidden';
        doc.body.style.background = 'transparent';
        doc.body.style.margin = '0';
      } catch(e) {}
    };
  </script>

</body>
</html>
