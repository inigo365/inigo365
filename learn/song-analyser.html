<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>song analyser — learn</title>
  <link rel="icon" type="image/png" href="../images/icon.png">
  <link rel="stylesheet" href="shared/learn.css">
  <style>
    @font-face {
      font-family: 'RuneScape UF';
      src: url('../../fonts/RuneScape-UF.woff2') format('woff2'),
           url('../../fonts/RuneScape-UF.woff')  format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    body { font-family: 'RuneScape UF', monospace; }
    .friend-sprite { display: none !important; }
    html {
      height: auto !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
    }
    body {
      height: auto !important;
      min-height: unset !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      padding-bottom: 24px !important;
      margin: 0 !important;
      background: transparent !important;
    }
    .page {
      min-height: unset !important;
      padding-bottom: 16px !important;
    }
    .drop-zone {
      border: 1px dashed var(--border);
      border-radius: 2px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      background: transparent;
      transition: all 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .drop-zone.dragging {
      border-color: var(--c-main);
      background: var(--blue-light);
    }
    .drop-zone.analysing { cursor: default; }

    .result-card {
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--cream);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .result-primary {
      font-size: 1.5rem;
      color: var(--ink);
      text-shadow: 1px 1px 0 var(--blue-light);
    }
    .result-secondary { font-size: 0.78rem; color: var(--muted); }
    .result-confidence { font-size: 0.75rem; color: var(--muted); }

    /* Tap BPM */
    .tap-btn {
      width: 100%;
      padding: 18px 0;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--cream);
      color: var(--ink);
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .tap-btn.pressed {
      background: var(--blue-light);
      border-color: var(--c-main);
      transform: scale(0.96);
      transition: none;
    }

    .bpm-readout {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .bpm-value {
      font-size: 1.8rem;
      color: var(--c-main);
      font-weight: 700;
    }
    .bpm-count { font-size: 0.72rem; color: var(--muted); }

    /* Animated dots */
    @keyframes dot-cycle { 0%,100%{opacity:1} 33%{opacity:0.3} 66%{opacity:0.6} }
    html, body {
      background: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .page { background: transparent !important; padding-top: 8px !important; }
  </style>
</head>
<body>
<img class="friend-sprite" src="../go/images/friend-spin.gif" alt="" style="position:fixed;left:32px;bottom:40px;width:140px;pointer-events:none;z-index:10;image-rendering:pixelated;">
<div class="page">

  <nav class="learn-nav">
    <a href="../go/index.html">← home</a>
    <span class="sep">/</span>
    <a href="index.html">← learn</a>
    <span class="sep">/</span>
    <span>song analyser</span>
  </nav>

  <div class="tool-header">
    <h1 class="tool-title">song analyser</h1>
    <p class="tool-subtitle">find the key, tempo and mood of any track</p>
  </div>

  <div class="card col gap-14">

    <!-- Drop zone -->
    <div id="drop-zone" class="drop-zone" role="button" tabindex="0"
         aria-label="Drop audio file or click to browse">
      drop a song to analyse its key + bpm
    </div>
    <input id="file-input" type="file"
           accept="audio/*,.mp3,.wav,.aif,.aiff,.flac,.m4a,.aac,.ogg,.opus"
           style="display:none">

    <!-- Error -->
    <p class="error-text" id="error-msg" style="display:none"></p>

    <!-- Result -->
    <div id="result-card" style="display:none" class="result-card">
      <div class="result-primary" id="result-key"></div>
      <div class="result-secondary" id="result-alt-key"></div>
      <div class="result-primary" id="result-bpm"></div>
      <div class="result-confidence" id="result-confidence"></div>
    </div>

    <!-- Tap BPM section -->
    <div class="col gap-10">
      <button id="tap-btn" class="tap-btn">tap tempo</button>
      <div id="bpm-readout" style="display:none" class="bpm-readout">
        <span class="bpm-value" id="bpm-value"></span>
        <span class="bpm-count" id="bpm-count"></span>
      </div>
      <span id="keep-tapping" style="display:none" class="muted-text">keep tapping…</span>
      <button id="reset-btn" style="display:none" class="btn-ghost">reset</button>
      <p class="muted-text">spacebar also taps — useful on desktop</p>
    </div>

  </div>
</div>

<script>
// ── FFT (Cooley-Tukey radix-2) ─────────────────────────────────────────────────
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const halfLen = len >> 1;
    const ang = -2 * Math.PI / len;
    const wBaseRe = Math.cos(ang), wBaseIm = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let wRe = 1, wIm = 0;
      for (let j = 0; j < halfLen; j++) {
        const uRe = re[i+j], uIm = im[i+j];
        const vRe = re[i+j+halfLen]*wRe - im[i+j+halfLen]*wIm;
        const vIm = re[i+j+halfLen]*wIm + im[i+j+halfLen]*wRe;
        re[i+j] = uRe+vRe; im[i+j] = uIm+vIm;
        re[i+j+halfLen] = uRe-vRe; im[i+j+halfLen] = uIm-vIm;
        const newWRe = wRe*wBaseRe - wIm*wBaseIm;
        wIm = wRe*wBaseIm + wIm*wBaseRe; wRe = newWRe;
      }
    }
  }
}

function computeFFT(frame) {
  const n = frame.length;
  const re = new Float32Array(frame), im = new Float32Array(n);
  fft(re, im);
  const mag = new Float32Array(n >> 1);
  for (let i = 0; i < mag.length; i++) mag[i] = Math.sqrt(re[i]*re[i] + im[i]*im[i]);
  return mag;
}

// ── Key detection (Krumhansl-Schmuckler) ──────────────────────────────────────
function correlation(a, b) {
  const meanA = a.reduce((s,v)=>s+v,0)/a.length;
  const meanB = b.reduce((s,v)=>s+v,0)/b.length;
  const num = a.reduce((s,v,i)=>s+(v-meanA)*(b[i]-meanB),0);
  const den = Math.sqrt(a.reduce((s,v)=>s+(v-meanA)**2,0)*b.reduce((s,v)=>s+(v-meanB)**2,0));
  return den === 0 ? 0 : num/den;
}

function detectKey(buffer) {
  const maxSamples = Math.min(buffer.length, 60 * buffer.sampleRate);
  const data = buffer.getChannelData(0).subarray(0, maxSamples);
  const sampleRate = buffer.sampleRate;
  const chroma = new Float32Array(12).fill(0);
  const frameSize = 4096, hopSize = 2048, halfFrame = frameSize >> 1;

  for (let i = 0; i < data.length - frameSize; i += hopSize) {
    const frame = data.slice(i, i + frameSize);
    const fftMag = computeFFT(frame);
    for (let bin = 1; bin < halfFrame; bin++) {
      const freq = (bin * sampleRate) / frameSize;
      if (freq < 80 || freq > 4000) continue;
      const pc = Math.round(12 * Math.log2(freq / 440) + 69) % 12;
      if (pc >= 0) chroma[(pc + 12) % 12] += fftMag[bin];
    }
  }

  const max = Math.max(...chroma);
  if (max === 0) return { primary:{note:'C',mode:'major',score:0}, secondary:{note:'A',mode:'minor',score:0}, confidence:'low' };

  const normChroma = Array.from(chroma).map(v => v/max);
  const majorProfile = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
  const minorProfile = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
  const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  const candidates = [];
  for (let shift = 0; shift < 12; shift++) {
    const shifted = normChroma.map((_,i) => normChroma[(i+shift)%12]);
    candidates.push({ note:notes[shift], mode:'major', score:correlation(shifted, majorProfile) });
    candidates.push({ note:notes[shift], mode:'minor', score:correlation(shifted, minorProfile) });
  }
  candidates.sort((a,b) => b.score-a.score);

  const gap = candidates[0].score - candidates[1].score;
  const confidence = gap > 0.15 ? 'high' : gap > 0.08 ? 'medium' : 'low';
  return { primary:candidates[0], secondary:candidates[1], confidence };
}

// ── BPM detection ──────────────────────────────────────────────────────────────
function detectBPM(buffer) {
  const maxSamples = Math.min(buffer.length, 30 * buffer.sampleRate);
  const data = buffer.getChannelData(0).subarray(0, maxSamples);
  const sampleRate = buffer.sampleRate;
  const frameSize = 512, hopSize = 256;

  const energy = [];
  for (let i = 0; i < data.length - frameSize; i += hopSize) {
    let sum = 0;
    for (let j = 0; j < frameSize; j++) sum += data[i+j]**2;
    energy.push(Math.sqrt(sum/frameSize));
  }

  const onsets = [0];
  for (let i = 1; i < energy.length; i++) onsets.push(Math.max(0, energy[i]-energy[i-1]));
  const maxOnset = onsets.reduce((m,v)=>v>m?v:m,0);
  const normOnsets = onsets.map(v=>v/(maxOnset||1));

  const fps = sampleRate / hopSize;
  const bpmCandidates = [60,70,75,80,85,90,95,100,105,110,115,120,125,130,135,140,145,150,160,170,180,190,200];
  let bestBPM = 120, bestScore = -Infinity;

  for (const bpm of bpmCandidates) {
    const period = (fps*60)/bpm;
    let score = 0;
    const limit = normOnsets.length - Math.ceil(period*4);
    for (let i = 0; i < limit; i++) {
      score += normOnsets[i]*(normOnsets[Math.round(i+period)]||0);
      score += normOnsets[i]*(normOnsets[Math.round(i+period*2)]||0);
      score += normOnsets[i]*(normOnsets[Math.round(i+period*0.5)]||0);
    }
    if (score > bestScore) { bestScore = score; bestBPM = bpm; }
  }

  if (bestBPM > 160) return Math.round(bestBPM/2);
  if (bestBPM < 80)  return Math.round(bestBPM*2);
  return bestBPM;
}

// ── Main analyse function ──────────────────────────────────────────────────────
const AUDIO_EXT = /\.(mp3|wav|aif|aiff|flac|m4a|aac|ogg|opus)$/i;

function isAudioFile(file) {
  return file.type.startsWith('audio/') || AUDIO_EXT.test(file.name);
}

let dotsInterval = null;
let dotCount = 1;

function startDots() {
  dotCount = 1;
  const dz = document.getElementById('drop-zone');
  dz.textContent = '[ analysing· ]';
  dotsInterval = setInterval(() => {
    dotCount = (dotCount % 3) + 1;
    dz.textContent = '[ analysing' + '·'.repeat(dotCount) + ' ]';
  }, 420);
}

function stopDots() {
  clearInterval(dotsInterval);
}

async function analyse(file) {
  if (!isAudioFile(file)) {
    showError('[ please drop an audio file (mp3, wav, flac, m4a…) ]');
    return;
  }
  hideError();
  hideResult();

  const dz = document.getElementById('drop-zone');
  dz.classList.add('analysing');
  startDots();

  try {
    const arrayBuffer = await file.arrayBuffer();
    const audioCtx    = new OfflineAudioContext(1, 1, 44100);
    let audioBuffer   = await audioCtx.decodeAudioData(arrayBuffer);
    await new Promise(resolve => setTimeout(resolve, 0));

    const keyResult = detectKey(audioBuffer);
    const bpm       = detectBPM(audioBuffer);
    audioBuffer = null;

    showResult({
      key:        keyResult.primary.note,
      mode:       keyResult.primary.mode,
      altKey:     keyResult.secondary.note,
      altMode:    keyResult.secondary.mode,
      bpm,
      confidence: keyResult.confidence,
    });
  } catch (e) {
    showError('[ could not analyse this file — try a different format ]');
  } finally {
    stopDots();
    dz.classList.remove('analysing');
    dz.textContent = '[ drop a song to analyse its key + bpm ]';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = '';
}
function hideError() { document.getElementById('error-msg').style.display = 'none'; }

function showResult(r) {
  document.getElementById('result-key').textContent        = `[ key: ${r.key} ${r.mode} ]`;
  document.getElementById('result-alt-key').textContent    = `[ also possible: ${r.altKey} ${r.altMode} ]`;
  document.getElementById('result-bpm').textContent        = `[ bpm: ${r.bpm} ]`;
  document.getElementById('result-confidence').textContent = `[ ${r.confidence} confidence ]`;
  document.getElementById('result-card').style.display     = '';
}
function hideResult() { document.getElementById('result-card').style.display = 'none'; }

// ── Drop zone events ───────────────────────────────────────────────────────────
const dz = document.getElementById('drop-zone');
const fi = document.getElementById('file-input');

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragging'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragging'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragging');
  const file = e.dataTransfer.files[0];
  if (file && !dz.classList.contains('analysing')) analyse(file);
});
dz.addEventListener('click', () => { if (!dz.classList.contains('analysing')) fi.click(); });
dz.addEventListener('keydown', e => { if (e.key === 'Enter') fi.click(); });
fi.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) analyse(file);
  e.target.value = '';
});

// ── Tap BPM ────────────────────────────────────────────────────────────────────
let tapTimestamps = [];
let tapBpm = null;
let tapCount = 0;
let tapPressed = false;

function handleTap() {
  const now = Date.now();
  if (tapTimestamps.length > 0 && now - tapTimestamps[tapTimestamps.length - 1] > 3000) {
    tapTimestamps = [now];
    tapBpm = null; tapCount = 1;
    renderTap(); return;
  }
  tapTimestamps = [...tapTimestamps, now].slice(-8);
  if (tapTimestamps.length >= 2) {
    const intervals = [];
    for (let i = 1; i < tapTimestamps.length; i++) intervals.push(tapTimestamps[i] - tapTimestamps[i-1]);
    const avg = intervals.reduce((a,b)=>a+b,0) / intervals.length;
    tapBpm = Math.round(60000 / avg);
  }
  tapCount = tapTimestamps.length;
  renderTap();
}

function handleReset() {
  tapTimestamps = []; tapBpm = null; tapCount = 0;
  renderTap();
}

function renderTap() {
  const readout   = document.getElementById('bpm-readout');
  const bpmVal    = document.getElementById('bpm-value');
  const bpmCnt    = document.getElementById('bpm-count');
  const keepTap   = document.getElementById('keep-tapping');
  const resetBtn  = document.getElementById('reset-btn');

  if (tapBpm !== null) {
    bpmVal.textContent  = `${tapBpm} bpm`;
    bpmCnt.textContent  = `based on ${tapCount} tap${tapCount !== 1 ? 's' : ''}`;
    readout.style.display = '';
    keepTap.style.display = 'none';
  } else if (tapCount === 1) {
    readout.style.display = 'none';
    keepTap.style.display = '';
  } else {
    readout.style.display = 'none';
    keepTap.style.display = 'none';
  }

  resetBtn.style.display = tapCount > 0 ? '' : 'none';
}

const tapBtn  = document.getElementById('tap-btn');
const resetBtn = document.getElementById('reset-btn');

tapBtn.addEventListener('pointerdown',  () => { handleTap(); tapBtn.classList.add('pressed'); });
tapBtn.addEventListener('pointerup',    () => tapBtn.classList.remove('pressed'));
tapBtn.addEventListener('pointerleave', () => tapBtn.classList.remove('pressed'));
tapBtn.addEventListener('pointercancel',() => tapBtn.classList.remove('pressed'));
resetBtn.addEventListener('click', handleReset);

// Spacebar taps
document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  if (ae instanceof HTMLInputElement || ae instanceof HTMLTextAreaElement) return;
  if (e.key === ' ') { e.preventDefault(); handleTap(); }
});
</script>
<script>
if (window.self !== window.top) {
  const nav = document.querySelector('.learn-nav');
  if (nav) nav.style.display = 'none';
  const header = document.querySelector('.tool-header');
  if (header) header.style.marginTop = '0';

}
</script>
</body>
</html>
