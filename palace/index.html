<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<link rel="preload" as="font" type="font/woff2" href="/fonts/RuneScape-UF.woff2" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>inigo365</title>
  <link rel="icon" type="image/png" href="../images/icon.png">
  <link rel="stylesheet" href="shared/learn.css">
  <style>
    @font-face {
      font-family: 'RuneScape UF';
      src: url('/fonts/RuneScape-UF.woff2') format('woff2'),
           url('/fonts/RuneScape-UF.woff')  format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .rack-wrap, .friend-sprite {
      animation: fadeIn 0.45s ease both;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    html {
      background-image: url('../go/images/background.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body {
      background-image: url('../go/images/background.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body {
      font-family: 'RuneScape UF', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Rack panel ─────────────────────────────────────────────── */
    .rack-wrap {
      position: relative;
      width: min(900px, 100%);
      border: 2px solid #000;
      border-radius: 0;
      background: rgba(255,255,255,0.69);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      padding: 0;
      display: flex;
      flex-direction: column;
      height: calc(var(--vh, 1vh) * 100 - 40px);
      max-height: calc(var(--vh, 1vh) * 100 - 40px);
    }
    .rack-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(26,58,92,0.03) 2px, rgba(26,58,92,0.03) 3px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(26,58,92,0.02) 3px, rgba(26,58,92,0.02) 4px);
    }
    .rack-wrap > * {
      position: relative;
      z-index: 1;
    }

    /* ── Scroll area ────────────────────────────────────────────── */
    .rack-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
      border-top: 1px solid rgba(26, 58, 92, 0.3);
    }

    /* ── Banner ─────────────────────────────────────────────────── */
    .site-banner {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      flex: 0 0 auto;
    }
    .site-banner img {
      width: min(980px, 100%);
      height: auto;
      max-height: clamp(96px, 18vw, 200px);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    @media (max-width: 768px) {
      .site-banner img {
        max-height: clamp(110px, 18vw, 180px);
      }
    }

    /* ── Rack row ───────────────────────────────────────────────── */
    .rack-row {
      display: flex;
      align-items: stretch;
      height: 64px;
      border-bottom: 1px solid rgba(26, 58, 92, 0.3);
      transition: background 0.15s;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .rack-row:hover        { background: rgba(74, 127, 212, 0.10); }
    .rack-row.active       { background: #4A7FD4; }

    /* ── Ear columns ────────────────────────────────────────────── */
    .rack-ear {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      background: rgba(26, 58, 92, 0.07);
      padding: 10px 0;
    }
    .rack-ear.left  { border-right: 1px solid rgba(26, 58, 92, 0.18); }
    .rack-ear.right { border-left:  1px solid rgba(26, 58, 92, 0.18); }
    .rack-row.active .rack-ear             { background: rgba(0, 0, 0, 0.14); }
    .rack-row.active .rack-ear.left        { border-right-color: rgba(255,255,255,0.12); }
    .rack-row.active .rack-ear.right       { border-left-color:  rgba(255,255,255,0.12); }

    /* ── Screws ─────────────────────────────────────────────────── */
    .screw {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #C8DCF0;
      border: 1px solid #8A9BB0;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.22), 0 1px 0 rgba(255,255,255,0.4);
      position: relative;
      flex-shrink: 0;
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 50%; left: 15%;
      width: 70%; height: 1.5px;
      background: rgba(26, 58, 92, 0.3);
      transform: translateY(-50%) rotate(45deg);
      border-radius: 1px;
    }
    .rack-row.active .screw        { background: #8BB8E8; border-color: rgba(255,255,255,0.3); }
    .rack-row.active .screw::after { background: rgba(255,255,255,0.35); }

    /* ── Unit number ────────────────────────────────────────────── */
    .rack-unit-num {
      width: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'RuneScape UF', monospace;
      font-size: 0.58rem;
      color: #8A9BB0;
      letter-spacing: 0.04em;
    }
    .rack-row.active .rack-unit-num { color: rgba(255,255,255,0.5); }

    /* ── Main label area ────────────────────────────────────────── */
    .rack-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      min-width: 0;
      gap: 10px;
    }
    .rack-name {
      font-family: 'RuneScape UF', monospace;
      font-size: 1.375rem;
      color: #1A3A5C;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }
    .rack-desc {
      font-family: 'RuneScape UF', monospace;
      font-size: 0.58rem;
      color: #8A9BB0;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      text-align: right;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .rack-row.active .rack-name { color: #fff; }
    .rack-row.active .rack-desc { color: rgba(255,255,255,0.6); }

    /* ── LED ────────────────────────────────────────────────────── */
    .rack-led-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 12px;
      flex-shrink: 0;
    }
    .rack-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(138, 155, 176, 0.45);
      border: 1px solid rgba(26, 58, 92, 0.18);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .rack-led.on {
      background: #00ff00;
      border-color: transparent;
      box-shadow: 0 0 5px #00ff00, 0 0 10px rgba(0,255,0,0.35);
    }
    .rack-led-label {
      font-family: 'RuneScape UF', monospace;
      font-size: 0.5rem;
      color: #8A9BB0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: color 0.15s;
    }
    .rack-led-label.on { color: #00ff00; }

    /* ── Drawer ─────────────────────────────────────────────────── */
    .rack-drawer {
      display: none;
      background: transparent;
      border-bottom: 1px solid rgba(26, 58, 92, 0.3);
      padding: 16px 16px 0;
    }
    .rack-drawer.open { display: block; }
    .rack-iframe {
      width: 100%;
      border: none;
      display: block;
      background: transparent;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Footer ─────────────────────────────────────────────────── */
    .rack-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(26, 58, 92, 0.06);
      border-top: 2px solid #1A3A5C;
    }
    .rack-status {
      font-family: 'RuneScape UF', monospace;
      font-size: 0.58rem;
      color: #8A9BB0;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .rack-status-dot {
      color: #00ff00;
      margin-right: 3px;
    }
    .rack-back {
      font-family: 'RuneScape UF', monospace;
      font-size: 0.58rem;
      color: #8A9BB0;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .rack-back:hover { color: #1A3A5C; }

    /* ── Featured (headline) cards ──────────────────────────────── */
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 16px;
      flex: 0 0 auto;
    }
    /* Headline cards — money-texture background (go/index.html .portal-tile--bg
       approach), NOT the rack's frosted-glass/screws/LED chrome. Texture image
       is set inline per-card in buildRack(); a dark overlay + light bold text
       with a text-shadow keep the labels legible over the busy note art. */
    .featured-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 120px;
      padding: 18px 16px;
      border: 2px solid #000;              /* consistent black tile border */
      background-color: #1A3A5C;           /* fallback behind the texture */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      /* interactive cursor handled by the shared .hoverable rule (learn.css) */
    }
    .featured-card::before {               /* dark legibility overlay */
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: background 0.15s;
    }
    .featured-card:hover::before  { background: rgba(0, 0, 0, 0.32); }
    .featured-card.active::before { background: rgba(74, 127, 212, 0.55); }
    .featured-card .rack-name {
      position: relative;
      z-index: 1;
      font-size: 1.7rem;                   /* larger than the regular 1.375rem */
      font-weight: bold;
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.65);
      white-space: normal;
    }
    .featured-card .rack-desc {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      font-size: 0.62rem;
      text-align: left;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
    }
    .featured-card:hover .rack-name {
      text-decoration: underline;
      text-decoration-color: gold;
    }
    /* Goal 3a: an open featured drawer spans the full grid width (its own row)
       instead of being squeezed into one column beside its card. */
    .featured-grid > .rack-drawer.open { grid-column: 1 / -1; }

    .section-label {
      font-family: 'RuneScape UF', monospace;
      font-size: 0.58rem;
      color: #8A9BB0;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      padding: 4px 16px;
      flex: 0 0 auto;
    }

    @media (max-width: 700px) {
      .featured-grid { grid-template-columns: 1fr; padding: 10px; }
    }

    /* ── Boot-sequence overlay (Goal 4) ─────────────────────────── */
    #palace-boot-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1400ms ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    #palace-boot-overlay.fading {
      opacity: 0;
      pointer-events: none;
    }
    #palace-boot-gif {
      width: min(50vw, 420px);
      height: auto;
      display: block;
    }
    #palace-boot-text {
      font-family: "RuneScape UF", Arial, Helvetica, sans-serif;
      font-size: 28px;
      font-weight: bold;
      color: #00ff41;
      white-space: nowrap;
      line-height: 1;
      text-align: center;
    }
    #palace-boot-cursor {
      display: inline-block;
      width: 0.55em;
      height: 0.85em;
      background: #00ff41;
      vertical-align: text-bottom;
      margin-left: 1px;
    }
    #palace-boot-cursor.waiting {
      animation: cursorBlink 900ms steps(1, end) infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* ── Desktop layout ─────────────────────────────────────────── */
    @media (min-width: 701px) {
      body {
        align-items: center;
        justify-content: flex-end;
      }
      .rack-wrap {
        margin-left: auto;
        margin-right: 4vw;
      }
      .friend-sprite {
        position: fixed;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 38vw;
        max-width: 520px;
      }
    }

    /* ── Mobile ─────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      body        { background-attachment: scroll; }
      .rack-wrap  {
        width: 100%;
        height: calc(var(--vh, 1vh) * 100);
        max-height: calc(var(--vh, 1vh) * 100);
        margin: 0;
      }
      .rack-row       { height: 48px; }
      .rack-ear       { width: 24px; }
      .rack-name      { font-size: 18px; white-space: normal; }
      .rack-desc      { display: none; }
      .rack-unit-num  { width: 20px; font-size: 0.52rem; }
      .rack-led-wrap  { padding: 0 8px; }
      .friend-sprite {
        display: none; /* the boot-sequence intro (Goal 4) now owns the friend
                          gif's "first impression" moment on mobile — showing
                          a second copy behind/beside the full-width rack on
                          small screens would just look like clutter, not a
                          companion visual the way it does on wide desktop
                          layouts where there's spare space beside the rack */
      }
    }
  </style>
</head>
<body>

  <img class="friend-sprite" src="../go/images/friend-spin.webp" alt="">

  <div class="rack-wrap">

    <!-- Banner -->
    <div class="site-banner" aria-label="inigo365 banner">
      <img src="../go/images/inigo365-banner.webp" alt="inigo365">
    </div>

    <div class="rack-scroll">

    <!-- Featured (headline) units — inside the scroll area so a tall open
         drawer becomes scrollable instead of spilling past .rack-wrap. -->
    <div id="featured-units" class="featured-grid"></div>
    <div class="section-label">music tools</div>

    <div id="rack-units"></div>

    </div><!-- /.rack-scroll -->

    <!-- Footer -->
    <div class="rack-footer">
      <a href="../go/index.html" class="rack-back hoverable">← back</a>
      <span class="rack-status">
        <span class="rack-status-dot">●</span><span id="module-count"></span> modules ready
      </span>
    </div>

  </div>

  <script>
    function setVH() {
      document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    setVH();
    window.addEventListener('resize', setVH);
  </script>

  <script>
    const TOOLS = [
      { id: 'about',         name: 'what is inigo365?',  desc: 'on ai, art, and this site', src: 'what-is-inigo365.html', enabled: false },
      { id: 'hand-spin',    name: 'object gallery',    desc: 'pinch + drag · 3d',    src: 'bart/hand-spin.html',    scrollToBottom: true, featured: true, bgImage: '../go/images/20m.webp' },
      { id: 'trillion',      name: 'what $1 trillion looks like', desc: 'what it means', src: 'trillion-widget.html', featured: true, bgImage: '../go/images/100.webp'   },
      { id: 'invoice',       name: 'invoice generator', desc: 'create + export pdf',  src: 'invoice-generator.html', enabled: false },
      { id: 'midi-studio',   name: 'midi studio',      desc: 'compose + export',      src: 'midi-studio.html'   },
      { id: 'scale-trainer', name: 'scale trainer',    desc: 'scales + progressions', src: 'scale-trainer.html' },
      { id: 'guitar-tuner',  name: 'guitar tuner',     desc: 'pitch detection',       src: 'guitar-tuner.html'  },
      { id: 'song-analyser', name: 'song analyser',    desc: 'key + bpm detection',   src: 'song-analyser.html' },
      { id: 'ear-training',  name: 'ear training',     desc: 'interval recognition',  src: 'ear-training.html'  },
    ];

    // ── Build rack units from TOOLS array ──────────────────────────
    // Keyed by ORIGINAL array index (idx) for element ids / TOOLS[idx] lookups
    // used by toggleRow/openRow/closeRow. Display numbering for the music-tool
    // list is a separate running counter so it reads 01-05 with no gaps.
    (function buildRack() {
      const rackContainer     = document.getElementById('rack-units');
      const featuredContainer = document.getElementById('featured-units');
      const featuredDrawers   = [];
      let musicNum = 0;

      TOOLS.forEach(function (tool, idx) {
        // 1. Hidden tools: render nothing, don't count.
        if (tool.enabled === false) return;

        // Shared drawer markup (same structure for featured + regular rows).
        const drawer = document.createElement('div');
        drawer.className = 'rack-drawer';
        drawer.id = 'drawer-' + idx;
        drawer.innerHTML =
          '<iframe id="frame-' + idx + '" class="rack-iframe" src="" title="' + tool.name + '" allow="downloads"></iframe>';

        const row = document.createElement('div');
        row.id = 'row-' + idx;
        row.setAttribute('onclick', 'toggleRow(' + idx + ')');

        if (tool.featured === true) {
          // 2. Featured headline card — money-texture tile, NO rack chrome
          //    (no ears/screws/LED). '.hoverable' gives it the shared custom
          //    cursor. Texture image applied inline per-card.
          row.className = 'featured-card hoverable';
          if (tool.bgImage) row.style.backgroundImage = 'url("' + tool.bgImage + '")';
          row.innerHTML =
            '<span class="rack-name">' + tool.name + '</span>' +
            '<span class="rack-desc">' + tool.desc + '</span>';
          featuredContainer.appendChild(row);
          // Defer the drawer: appended after BOTH cards (below) so an open
          // drawer forms its own clean full-width row (with grid-column:1/-1)
          // rather than landing between the two cards.
          featuredDrawers.push(drawer);
        } else {
          // 3. Regular music-tool row — running display number 01-05.
          const num = String(++musicNum).padStart(2, '0');
          row.className = 'rack-row hoverable';
          row.innerHTML =
            '<div class="rack-ear left"><div class="screw"></div><div class="screw"></div></div>' +
            '<div class="rack-unit-num">' + num + '</div>' +
            '<div class="rack-main">' +
              '<span class="rack-name">' + tool.name + '</span>' +
              '<span class="rack-desc">' + tool.desc + '</span>' +
            '</div>' +
            '<div class="rack-led-wrap">' +
              '<div class="rack-led" id="led-' + idx + '"></div>' +
              '<div class="rack-led-label" id="led-label-' + idx + '">off</div>' +
            '</div>' +
            '<div class="rack-ear right"><div class="screw"></div><div class="screw"></div></div>';
          rackContainer.appendChild(row);
          rackContainer.appendChild(drawer);
        }
      });

      // Featured drawers go after both featured cards (see note above).
      featuredDrawers.forEach(function (d) { featuredContainer.appendChild(d); });

      document.getElementById('module-count').textContent =
        TOOLS.filter(t => t.enabled !== false).length;
    })();

    let activeRow = null;

    function toggleRow(idx) {
      if (activeRow === idx) {
        closeRow(idx);
        activeRow = null;
      } else {
        if (activeRow !== null) closeRow(activeRow);
        openRow(idx);
        activeRow = idx;
      }
    }

    function openRow(idx) {
      const row      = document.getElementById('row-'       + idx);
      const drawer   = document.getElementById('drawer-'    + idx);
      const frame    = document.getElementById('frame-'     + idx);
      const led      = document.getElementById('led-'       + idx);
      const ledLabel = document.getElementById('led-label-' + idx);

      row.classList.add('active');
      drawer.classList.add('open');
      // Featured cards have no LED chrome — guard so the drawer still opens.
      if (led) led.classList.add('on');
      if (ledLabel) { ledLabel.textContent = 'on'; ledLabel.classList.add('on'); }

      frame.style.minHeight = '0';
      frame.src = TOOLS[idx].src;
      frame.onload = function () {
        const iframe = this;
        try {
          const doc = iframe.contentDocument;

          function syncHeight() {
            try {
              // Use body.scrollHeight only — documentElement.scrollHeight on iOS Safari
              // reports the iframe's rendered height (not content height), so Math.max
              // would pin the iframe tall and prevent it from shrinking after collapse.
              const h = doc.body
                ? doc.body.scrollHeight
                : (doc.documentElement ? doc.documentElement.scrollHeight : 0);
              iframe.style.height = (h > 0 ? h : 600) + 'px';
            } catch (e) {}
          }

          syncHeight();
          iframe.style.display = 'block';

          if (window.ResizeObserver && doc.body) {
            if (iframe._observer) iframe._observer.disconnect();
            iframe._observer = new ResizeObserver(syncHeight);
            iframe._observer.observe(doc.body);
          }
        } catch (e) {
          iframe.style.height = '600px';
          iframe.style.display = 'block';
        }

        // Scroll after syncHeight so rack-scroll has correct total content height.
        // scrollToBottom (object viewer): pull drawer bottom into view.
        // Default: scroll row heading to top of rack-scroll = directly under the banner.
        if (TOOLS[idx].scrollToBottom) {
          setTimeout(() => {
            drawer.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }, 100);
        } else {
          setTimeout(() => {
            row.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 50);
        }
      };
    }

    function closeRow(idx) {
      const row      = document.getElementById('row-'       + idx);
      const drawer   = document.getElementById('drawer-'    + idx);
      const frame    = document.getElementById('frame-'     + idx);
      const led      = document.getElementById('led-'       + idx);
      const ledLabel = document.getElementById('led-label-' + idx);

      row.classList.remove('active');
      drawer.classList.remove('open');
      if (led) led.classList.remove('on');
      if (ledLabel) { ledLabel.textContent = 'off'; ledLabel.classList.remove('on'); }

      if (frame._observer) { frame._observer.disconnect(); frame._observer = null; }
      frame.src = '';
      frame.style.height = '';
      frame.style.minHeight = '0';
    }

    function loadTool(src) {
      const idx = TOOLS.findIndex(t => t.src === src);
      if (idx === -1) return;
      if (activeRow === idx) {
        document.getElementById('row-' + idx).scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        toggleRow(idx);
      }
    }

    function goBack() {
      if (activeRow !== null) {
        closeRow(activeRow);
        activeRow = null;
      }
    }
  </script>

  <!-- Boot-sequence intro (Goal 4) — friend gif + typewriter, once per session -->
  <script src="js/palace-boot.js"></script>

</body>
