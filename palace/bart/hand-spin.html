<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>object gallery — inigo365</title>
<link rel="icon" type="image/png" href="../../images/icon.png">
<link rel="stylesheet" href="../shared/learn.css">
<style>
  @font-face {
    font-family: 'RuneScape UF';
    src: url('./RuneScape-UF.woff2') format('woff2'),
         url('./RuneScape-UF.woff')  format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  /* ── Cursor ─────────────────────────────────────────────────────── */
  html, body {
    cursor: url('../../images/cursor/cursor.png'), auto;
  }
  button, input, a, select, [onclick] {
    cursor: url('../../images/cursor/cursor-hover.png'), pointer;
  }

  /* ── Transparent bg so rack panel glass shows through ───────────── */
  html, body {
    background: transparent !important;
    background-image: none !important;
  }

  /* ── Fixed height when running inside the rack drawer iframe ─────── */
  /* body.scrollHeight must be a stable pixel value for the
     ResizeObserver in palace/index.html to sync correctly.
     100vh in an iframe causes a feedback loop. */
  body.in-iframe {
    height: 480px !important;
    overflow: hidden !important;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'RuneScape UF', monospace; }

  /* Container: canvas provides its own dark WebGL background;
     body is transparent so the rack glass shows in the drawer padding */
  #container {
    position: relative; width: 100%; height: 100vh;
  }
  body.in-iframe #container { height: 480px !important; }

  canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  #hand-overlay { pointer-events: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; }

  /* ── All UI boxes use the same cream card styling as trillion-widget ── */
  #status {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 15px; color: var(--ink); letter-spacing: 0.08em; white-space: nowrap;
    font-family: 'RuneScape UF', monospace;
    background: rgba(253,250,245,0.96); border: 1px solid #1A3A5C;
    padding: 5px 14px; border-radius: 2px;
  }
  #pinch-dot {
    position: absolute; top: 18px; right: 18px; width: 10px; height: 10px;
    border-radius: 50%; background: rgba(26,58,92,0.2); transition: background 0.08s, box-shadow 0.08s;
  }
  #pinch-dot.active { background: var(--blue-deep); box-shadow: 0 0 10px rgba(74,127,212,0.5); }
  #cam-label {
    position: absolute; bottom: 12px; left: 12px; display: flex; align-items: center;
    gap: 6px; font-size: 13px; color: var(--ink); letter-spacing: 0.06em;
    font-family: 'RuneScape UF', monospace;
    background: rgba(253,250,245,0.96); padding: 4px 10px; border-radius: 2px;
    border: 1px solid #1A3A5C;
  }
  #cam-label span { width: 7px; height: 7px; border-radius: 50%; background: #1D9E75; flex-shrink: 0; }
  #cam-off-btn {
    position: absolute; bottom: 44px; left: 12px; display: none;
    font-size: 13px; font-family: 'RuneScape UF', monospace;
    color: var(--red); letter-spacing: 0.06em;
    background: rgba(253,250,245,0.96); border: 1px solid rgba(185,64,64,0.55);
    padding: 4px 12px; border-radius: 2px;
    cursor: url('../../images/cursor/cursor-hover.png'), pointer;
    pointer-events: all; transition: background 0.15s;
  }
  #cam-off-btn:hover { background: rgba(185,64,64,0.08); }

  /* On mobile, revert cam-label / cam-off-btn to their original top-left stack */
  @media (max-width: 768px) {
    #cam-label   { top: 12px; left: 12px; bottom: auto; }
    #cam-off-btn { top: 52px; left: 12px; bottom: auto; }
  }

  #vel-bar { display: none; }

  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: all;
  }
  #overlay-card {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: rgba(253,250,245,0.96);
    border: 2px solid #1A3A5C;
    border-radius: 2px;
    padding: 36px 48px;
    max-width: 420px; width: 90%; text-align: center;
  }
  #overlay-card h1 {
    font-size: 1.6rem; color: var(--ink); font-weight: 400;
    letter-spacing: 0.12em; font-family: 'RuneScape UF', monospace;
  }
  #overlay-card button {
    padding: 12px 32px;
    background: var(--blue-deep); border: 2px solid #1A3A5C;
    color: #fff; font-size: 1rem; font-family: 'RuneScape UF', monospace;
    letter-spacing: 0.06em; border-radius: 2px;
    cursor: url('../../images/cursor/cursor-hover.png'), pointer;
    transition: opacity 0.15s;
  }
  #overlay-card button:hover { opacity: 0.85; }
  #overlay-card p {
    font-size: 0.88rem; color: var(--muted); letter-spacing: 0.06em;
    font-family: 'RuneScape UF', monospace; line-height: 1.5;
  }

  /* ── Object picker (GLB selector) ──────────────────────────────── */
  #object-picker-btn {
    font-family: 'RuneScape UF', monospace;
    font-size: 13px; color: var(--ink); letter-spacing: 0.06em;
    background: rgba(253,250,245,0.96); border: 1px solid var(--border);
    border-radius: 2px; padding: 5px 14px;
    pointer-events: all;
    cursor: url('../../images/cursor/cursor-hover.png'), pointer;
    transition: background 0.15s;
  }
  #object-picker-btn:hover { background: rgba(74,127,212,0.08); }
  /* The standalone instance (direct child of #ui) is styled to match
     #status exactly — same pill, just stacked above it — and stays
     hidden until the camera/hand-tracking session is actually live.
     The one inside #overlay-card stays in normal flex flow with the
     rest of the card's contents and keeps the smaller shared style. */
  #ui > #object-picker-btn {
    display: none;
    position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
    font-size: 15px; letter-spacing: 0.08em; white-space: nowrap;
    background: rgba(253,250,245,0.96); border: 1px solid #1A3A5C;
    padding: 5px 14px; border-radius: 2px;
  }
  #object-picker-menu {
    position: fixed; display: none; flex-direction: column;
    background: rgba(253,250,245,0.96); border: 2px solid #1A3A5C;
    border-radius: 2px; overflow: hidden; z-index: 1001; min-width: 160px;
  }
  #object-picker-menu.open { display: flex; }
  .object-picker-row {
    padding: 8px 16px; font-family: 'RuneScape UF', monospace;
    font-size: 13px; color: var(--ink); letter-spacing: 0.06em;
    cursor: url('../../images/cursor/cursor-hover.png'), pointer;
    pointer-events: all; border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .object-picker-row:last-child { border-bottom: none; }
  .object-picker-row:hover { background: rgba(74,127,212,0.10); }

  /* Loading card */
  #loading {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; pointer-events: none;
  }
  #loading-card {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    background: rgba(253,250,245,0.96); border: 2px solid #1A3A5C;
    border-radius: 2px; padding: 32px 48px;
  }
  #loading p { font-size: 1rem; color: var(--ink); letter-spacing: 0.08em; font-family: 'RuneScape UF', monospace; }
  #loading-bar { width: 120px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  #loading-fill { height: 100%; background: var(--blue-deep); border-radius: 1px; animation: loadpulse 1.4s ease-in-out infinite; }
  @keyframes loadpulse { 0%,100%{width:10%} 50%{width:80%} }

  /* Debug panel (internal, no toggle button) */
  #dbg {
    position: absolute; bottom: 60px; left: 12px; right: 12px; max-height: 180px;
    overflow-y: auto; background: rgba(253,250,245,0.96); border: 1px solid #1A3A5C;
    border-radius: 2px; padding: 8px 10px; font-size: 10px; color: var(--ink); line-height: 1.6;
    pointer-events: all; display: none; z-index: 999; font-family: monospace;
  }
  #dbg .err { color: var(--red); }
  #dbg .warn { color: #b97a00; }
  #dbg .ok { color: var(--green); }
</style>
</head>
<body>
<div id="container">
  <canvas id="canvas3d"></canvas>
  <canvas id="hand-overlay"></canvas>
  <div id="ui">
    <div id="cam-label"><span></span>cam</div>
    <button id="cam-off-btn">■ stop camera</button>
    <div id="pinch-dot"></div>
    <div id="vel-bar"><div id="vel-fill"></div></div>
    <div id="status">loading model...</div>
    <button id="object-picker-btn" type="button">object: bart</button>
    <div id="overlay">
      <div id="overlay-card">
        <h1>object gallery</h1>
        <button id="object-picker-btn" type="button">object: bart</button>
        <button id="start-btn">enable camera + hand tracking</button>
        <p>camera feed hidden · pinch + drag to spin</p>
      </div>
    </div>
    <div id="loading">
      <div id="loading-card">
        <p id="load-msg">loading...</p>
        <div id="loading-bar"><div id="loading-fill"></div></div>
      </div>
    </div>
    <div id="dbg"></div>
    <div id="object-picker-menu"></div>
  </div>
</div>

<!-- import map must come before any module script -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<!-- debug logger — available before module loads -->
<script>
(function(){
  const dbgEl = document.getElementById('dbg');

  window._dbg = function(msg, type) {
    const line = document.createElement('div');
    if (type) line.className = type;
    const t = new Date().toISOString().slice(11,23);
    line.textContent = `[${t}] ${msg}`;
    dbgEl.appendChild(line);
    dbgEl.scrollTop = dbgEl.scrollHeight;
    console.log(`[dbg] ${msg}`);
  };

  // Catch any uncaught errors (including module crashes)
  window.addEventListener('error', e => {
    dbgEl.style.display = 'block';
    window._dbg(`UNCAUGHT: ${e.message} (${e.filename?.split('/').pop()}:${e.lineno})`, 'err');
  });
  window.addEventListener('unhandledrejection', e => {
    dbgEl.style.display = 'block';
    window._dbg(`UNHANDLED PROMISE: ${e.reason}`, 'err');
  });

  window._dbg('page loaded, scripts starting', 'ok');
})();
</script>

<!-- MediaPipe: plain scripts, not modules -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"
  onload="window._dbg('mediapipe hands loaded','ok')"
  onerror="window._dbg('mediapipe hands FAILED to load','err')"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
  onload="window._dbg('mediapipe camera_utils loaded','ok')"
  onerror="window._dbg('mediapipe camera_utils FAILED to load','err')"></script>

<script type="module">
window._dbg('module script started');

let currentGlb = './bartagainagainagain.glb';

const GLB_FILES = [
  { label: 'bart', src: './bartagainagainagain.glb' },
  { label: 'brain', src: './brain.glb' },
  { label: 'friend', src: './friend.glb' },
];

let THREE, GLTFLoader, DRACOLoader;
try {
  const threeModule = await import('https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js');
  THREE = threeModule;
  window._dbg('three.js loaded', 'ok');
} catch(e) {
  window._dbg('three.js FAILED: ' + e.message, 'err');
  throw e;
}
try {
  const m = await import('https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js');
  GLTFLoader = m.GLTFLoader;
  window._dbg('GLTFLoader loaded', 'ok');
} catch(e) {
  window._dbg('GLTFLoader FAILED: ' + e.message, 'err');
  throw e;
}
try {
  const m = await import('https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/DRACOLoader.js');
  DRACOLoader = m.DRACOLoader;
  window._dbg('DRACOLoader loaded', 'ok');
} catch(e) {
  window._dbg('DRACOLoader FAILED: ' + e.message, 'warn');
  DRACOLoader = null; // non-fatal: GLB may not need Draco
}

const statusEl = document.getElementById('status');
const pinchDot = document.getElementById('pinch-dot');
const velFill = document.getElementById('vel-fill');
const uiPickerBtn = document.querySelector('#ui > #object-picker-btn');

// --- camera refs for the stop-camera button ---
let streamRef = null;
let videoRef  = null;
let mpCameraRef = null;

// --- rotation state declared at module top level, no TDZ issue ---
let isPinching = false;
let lastPinchX = 0;
let lastPinchY = 0;
let pinchVelX = 0;
let pinchVelY = 0;
let velX = 0;
let velY = 0;
let rotX = 0;
let rotY = 0;

const PINCH_ON  = 0.11;   // fingers must be this close to start pinching
const PINCH_OFF = 0.15;   // fingers must be this far apart to release (hysteresis)
const DAMPING = 0.88;       // how fast momentum fades after release
const IDLE_SPEED = 0.003;   // constant background Y rotation
const DRAG_SCALE = 1.8;     // how much wrist movement maps to rotation
const MOMENTUM_SCALE = 0.6; // how much pinch velocity carries over on release

// --- Three.js setup ---
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); // fully transparent — rack glass shows through
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const cam3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
cam3d.position.set(0, 0, 3);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
fillLight.position.set(-3, 0, -2);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xAFA9EC, 0.8);
rimLight.position.set(0, -2, -3);
scene.add(rimLight);

const pivot = new THREE.Group();
scene.add(pivot);

// --- Load GLB ---
const gltfLoader = new GLTFLoader();
if (DRACOLoader) {
  try {
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    gltfLoader.setDRACOLoader(draco);
    window._dbg('DRACOLoader attached to GLTFLoader', 'ok');
  } catch(e) {
    window._dbg('DRACOLoader setup failed: ' + e.message, 'warn');
  }
} else {
  window._dbg('Skipping DRACOLoader (will fail if GLB uses Draco compression)', 'warn');
}

function loadModel(src) {
  window._dbg('Loading GLB: ' + src);
  statusEl.textContent = 'loading object...';
  // clear out whatever's currently on the pivot before loading the next one
  while (pivot.children.length) {
    pivot.remove(pivot.children[0]);
  }
  gltfLoader.load(src, (gltf) => {
    window._dbg('GLB loaded successfully', 'ok');
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const baseScale = 1.6 / maxDim;
    const isMobile = window.innerWidth <= 768;
    const isSmallerModel = src.includes('friend.glb') || src.includes('brain.glb');
    const scale = isSmallerModel
      ? (isMobile ? baseScale * 0.64 : baseScale * 0.8)
      : baseScale;
    model.scale.setScalar(scale);
    model.position.sub(centre.multiplyScalar(scale));
    pivot.add(model);
    statusEl.textContent = 'show your hand · pinch + drag to spin';
  }, (xhr) => {
    if (xhr.total) window._dbg(`GLB progress: ${Math.round(xhr.loaded/xhr.total*100)}%`);
  }, (err) => {
    window._dbg('GLB load error: ' + (err.message || err), 'err');
    statusEl.textContent = 'glb load failed — is the file in the same folder?';
  });
}

loadModel(currentGlb);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  cam3d.aspect = window.innerWidth / window.innerHeight;
  cam3d.updateProjectionMatrix();
  resizeOverlay();
});

// --- Hand overlay canvas ---
const overlayCanvas = document.getElementById('hand-overlay');
const ctx2d = overlayCanvas.getContext('2d');
let lastHandLandmarks = null;

function resizeOverlay() {
  overlayCanvas.width = window.innerWidth;
  overlayCanvas.height = window.innerHeight;
}
resizeOverlay();

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17],[0,5]
];
const FINGERTIPS = [4, 8, 12, 16, 20];

function drawHandOverlay() {
  const W = overlayCanvas.width, H = overlayCanvas.height;
  ctx2d.clearRect(0, 0, W, H);
  if (!lastHandLandmarks) return;
  const lm = lastHandLandmarks;

  // MediaPipe x is mirrored (0=right of frame from user POV), flip it
  const lx = i => (1 - lm[i].x) * W;
  const ly = i => lm[i].y * H;

  // skeleton lines — dark ink on light glass background
  ctx2d.strokeStyle = isPinching ? 'rgba(74,127,212,0.7)' : 'rgba(26,58,92,0.35)';
  ctx2d.lineWidth = 1.5;
  ctx2d.lineCap = 'round';
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx2d.beginPath();
    ctx2d.moveTo(lx(a), ly(a));
    ctx2d.lineTo(lx(b), ly(b));
    ctx2d.stroke();
  }

  // joints
  for (let i = 0; i < 21; i++) {
    const isTip = FINGERTIPS.includes(i);
    const isPinchFinger = (i === 4 || i === 8);
    ctx2d.beginPath();
    ctx2d.arc(lx(i), ly(i), isTip ? 4 : 2.5, 0, Math.PI * 2);
    if (isPinching && isPinchFinger) {
      ctx2d.fillStyle = '#4A7FD4';
      ctx2d.shadowColor = '#4A7FD4';
      ctx2d.shadowBlur = 10;
    } else {
      ctx2d.fillStyle = isTip ? 'rgba(26,58,92,0.8)' : 'rgba(26,58,92,0.4)';
      ctx2d.shadowBlur = 0;
    }
    ctx2d.fill();
    ctx2d.shadowBlur = 0;
  }

  // pinch midpoint indicator
  if (isPinching) {
    const mx = (lx(4) + lx(8)) / 2;
    const my = (ly(4) + ly(8)) / 2;
    ctx2d.beginPath();
    ctx2d.arc(mx, my, 6, 0, Math.PI * 2);
    ctx2d.strokeStyle = 'rgba(74,127,212,0.9)';
    ctx2d.lineWidth = 1.5;
    ctx2d.stroke();
  }
}

// --- Render loop ---
function animate() {
  requestAnimationFrame(animate);

  // hand-driven momentum fades out when not pinching
  if (!isPinching) {
    rotX += velX;
    rotY += velY;
    velX *= DAMPING;
    velY *= DAMPING;
  }

  pivot.rotation.x = rotX;
  pivot.rotation.y = rotY;
  renderer.render(scene, cam3d);
  drawHandOverlay();
}
animate();

// --- Hand tracking ---
function pdist(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

function releasePinch() {
  // carry momentum forward — will decay via DAMPING in render loop
  velX = pinchVelY * Math.PI * MOMENTUM_SCALE;
  velY = -pinchVelX * Math.PI * MOMENTUM_SCALE;
  isPinching = false;
}

function onResults(results) {
  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    if (isPinching) releasePinch();
    lastHandLandmarks = null;
    pinchDot.classList.remove('active');
    velFill.style.width = '0%';
    statusEl.textContent = 'no hand · bring your hand into frame';
    return;
  }

  const lm = results.multiHandLandmarks[0];
  lastHandLandmarks = lm;

  const thumbTip = lm[4];
  const indexTip = lm[8];
  const dist = pdist(thumbTip, indexTip);
  const pinching = isPinching ? dist < PINCH_OFF : dist < PINCH_ON;

  // track the midpoint of the pinch rather than the wrist —
  // means any pinch+drag anywhere on screen drives the spin
  const pinchMidX = (thumbTip.x + indexTip.x) / 2;
  const pinchMidY = (thumbTip.y + indexTip.y) / 2;

  if (pinching) {
    pinchDot.classList.add('active');
    if (!isPinching) {
      isPinching = true;
      lastPinchX = pinchMidX;
      lastPinchY = pinchMidY;
      pinchVelX = 0;
      pinchVelY = 0;
      velX = 0;
      velY = 0;
    } else {
      // smooth the per-frame velocity with a light low-pass
      const rawVX = (pinchMidX - lastPinchX) * DRAG_SCALE;
      const rawVY = (pinchMidY - lastPinchY) * DRAG_SCALE;
      pinchVelX = pinchVelX * 0.5 + rawVX * 0.5;
      pinchVelY = pinchVelY * 0.5 + rawVY * 0.5;
      lastPinchX = pinchMidX;
      lastPinchY = pinchMidY;
      rotY -= pinchVelX * Math.PI;
      rotX += pinchVelY * Math.PI;
    }
    const spd = Math.sqrt(pinchVelX ** 2 + pinchVelY ** 2);
    velFill.style.width = Math.min(spd * 800, 100) + '%';
    statusEl.textContent = 'pinching · drag to spin';
  } else {
    pinchDot.classList.remove('active');
    if (isPinching) releasePinch();
    velFill.style.width = '0%';
    statusEl.textContent = 'hand detected · pinch + drag to spin';
  }
}

window._dbg('registering start-btn click handler', 'ok');
document.getElementById('start-btn').addEventListener('click', async () => {
  window._dbg('start-btn clicked');
  document.getElementById('overlay').style.display = 'none';
  const loadingEl = document.getElementById('loading');
  loadingEl.style.display = 'flex';
  document.getElementById('load-msg').textContent = 'requesting camera...';

  const video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.style.display = 'none';
  document.body.appendChild(video);

  try {
    window._dbg('calling getUserMedia...');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    window._dbg('camera stream acquired', 'ok');
    streamRef = stream;
    videoRef  = video;
    video.srcObject = stream;
    await video.play();
    window._dbg('video playing', 'ok');
  } catch (e) {
    window._dbg('camera error: ' + e.name + ' — ' + e.message, 'err');
    statusEl.textContent = 'camera denied: ' + e.name;
    loadingEl.style.display = 'none';
    document.getElementById('overlay').style.display = 'flex';
    return;
  }

  document.getElementById('load-msg').textContent = 'loading hand model...';

  try {
    window._dbg('checking Hands global: ' + typeof Hands);
    window._dbg('checking Camera global: ' + typeof Camera);

    if (typeof Hands === 'undefined') throw new Error('Hands global not defined — mediapipe script failed to load');
    if (typeof Camera === 'undefined') throw new Error('Camera global not defined — camera_utils script failed to load');

    const hands = new Hands({
      locateFile: f => {
        const url = `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`;
        window._dbg('mediapipe locateFile: ' + f);
        return url;
      }
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75, minTrackingConfidence: 0.65 });
    hands.onResults(onResults);
    window._dbg('Hands instance created', 'ok');

    const mpCamera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640, height: 480
    });

    mpCameraRef = mpCamera;
    window._dbg('starting mpCamera...');
    mpCamera.start().then(() => {
      window._dbg('mpCamera started', 'ok');
      loadingEl.style.display = 'none';
      statusEl.textContent = 'show your hand · pinch + drag to spin';
      document.getElementById('cam-off-btn').style.display = 'block';
      uiPickerBtn.style.display = 'block';
    }).catch(e => {
      window._dbg('mpCamera.start() failed: ' + e.message, 'err');
    });
  } catch(e) {
    window._dbg('hand tracking setup error: ' + e.message, 'err');
    statusEl.textContent = 'hand tracking failed — see debug panel';
    loadingEl.style.display = 'none';
  }
});

// --- Stop camera button ---
document.getElementById('cam-off-btn').addEventListener('click', () => {
  window._dbg('stopping camera');
  if (streamRef) {
    streamRef.getTracks().forEach(t => t.stop());
    streamRef = null;
  }
  if (mpCameraRef && typeof mpCameraRef.stop === 'function') {
    try { mpCameraRef.stop(); } catch(e) {}
    mpCameraRef = null;
  }
  if (videoRef) {
    videoRef.srcObject = null;
    videoRef.remove();
    videoRef = null;
  }
  // reset tracking state
  lastHandLandmarks = null;
  isPinching = false;
  velX = 0; velY = 0;
  ctx2d.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  pinchDot.classList.remove('active');
  velFill.style.width = '0%';
  statusEl.textContent = 'loading model...';
  document.getElementById('cam-off-btn').style.display = 'none';
  uiPickerBtn.style.display = 'none';
  document.getElementById('overlay').style.display = 'flex';
});

// --- Object picker (GLB selector) ---
const objectPickerBtns = document.querySelectorAll('#object-picker-btn');
const objectPickerMenu = document.getElementById('object-picker-menu');

function updateObjectPickerLabel(label) {
  objectPickerBtns.forEach(btn => { btn.textContent = 'object: ' + label; });
}

function closeObjectPickerMenu() {
  objectPickerMenu.classList.remove('open');
}

function openObjectPickerMenu(btn) {
  objectPickerMenu.classList.add('open');
  const rect = btn.getBoundingClientRect();
  const menuHeight = objectPickerMenu.offsetHeight;
  objectPickerMenu.style.left = rect.left + 'px';
  objectPickerMenu.style.top = (rect.top - menuHeight - 6) + 'px';
}

function toggleObjectPickerMenu(btn) {
  if (objectPickerMenu.classList.contains('open')) {
    closeObjectPickerMenu();
  } else {
    openObjectPickerMenu(btn);
  }
}

GLB_FILES.forEach(entry => {
  const row = document.createElement('div');
  row.className = 'object-picker-row';
  row.textContent = entry.label;
  row.addEventListener('click', (e) => {
    e.stopPropagation();
    currentGlb = entry.src;
    updateObjectPickerLabel(entry.label);
    closeObjectPickerMenu();
    loadModel(currentGlb);
  });
  objectPickerMenu.appendChild(row);
});

objectPickerBtns.forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleObjectPickerMenu(btn);
  });
});

// clicking inside the menu itself shouldn't trigger the outside-click close
objectPickerMenu.addEventListener('click', (e) => { e.stopPropagation(); });

document.addEventListener('click', () => {
  closeObjectPickerMenu();
});

// sync initial label in case currentGlb default ever drifts from GLB_FILES[0]
const initialEntry = GLB_FILES.find(f => f.src === currentGlb);
if (initialEntry) updateObjectPickerLabel(initialEntry.label);

window._dbg('module fully initialised', 'ok');
</script>
<script>
  if (window.self !== window.top) {
    document.body.classList.add('in-iframe');
  }
</script>
</body>
</html>
