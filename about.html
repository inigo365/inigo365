<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>inigo365— About</title>
  <link rel="icon" type="image/png" href="./images/icon.png" />
  <link rel="stylesheet" href="style.css" />

  <!-- SEO -->
  <meta name="description" content="Iggy Macdonald — Art Department, Lighting, Production, SFX. London based. Available worldwide. UK licence & passport." />

  <style>
    /* =========================
       COLOURS (NEW)
    ========================= */
   :root{
  --text-main: #111817;
  --text-soft: #2a3634;
  --text-muted: #4a5c5a;
  --accent: #0f3f3a;
}


    /* =========================
       BASE
    ========================= */
    html, body {
      height: 100%;
      margin: 0;
    }

    .about-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      margin: 0;
    }

    /* TRUE edge-to-edge background */
    .about-bg {
      position: fixed;
      inset: 0;
      z-index: 0;

      background-image: url("images/about/about-mobile1.jpg");
      background-size: cover;
      background-position: 50% 35%;
      background-repeat: no-repeat;

      width: 100vw;
      height: 100vh;
    }

    /* (Unused now, safe to remove later) */
    .about-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 35%;
      transform: scale(1.04);
    }

    @media (max-width: 520px) {
      .about-image { object-position: 50% 30%; }
    }

    /* =========================
       CARD
    ========================= */
    .about-card {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;

  width: min(76ch, 92vw);
  height: calc(100svh - 32px);     /* fixed height = viewport */
  overflow-y: auto;                /* scroll inside the card */
  -webkit-overflow-scrolling: touch;

  padding: clamp(16px, 2.4vw, 24px);
  border-radius: 18px;

  background: rgba(245, 248, 247, 0.85);
  border: 1px solid rgba(111, 213, 118, 0.22);
  box-shadow: 0 14px 40px rgba(0,0,0,0.28);
  outline: 1px solid rgba(255,255,255,0.06);

  opacity: 0;
  transition: opacity 700ms ease;

  /* NEW */
  display: flex;
  flex-direction: column;
  align-items: center;             /* centres image + text */
  text-align: center;
}


    body.fade-in-page .about-card { opacity: 1; }

    .about-card * {
      font-family: "RuneScape UF", Arial, sans-serif;
      color: var(--text-main); /* NEW */
      text-shadow: none;

    }

    /* =========================
       PROFILE IMAGE
    ========================= */
    .about-profile {
  display: block;
  margin: 0 auto 14px;

  width: min(520px, 92%);
  height: min(58svh, 520px);       /* BIG on desktop, pushes text down */
  object-fit: cover;               /* fills the frame */
  object-position: center;         /* always centred */

  background: rgba(0,0,0,0.0);
  padding: 3px;

  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.0);
  box-shadow: 0 10px 22px rgba(0,0,0,0.00);
}

/* Mobile: reduce the image so it doesn't eat the whole card */
@media (max-width: 520px) {
  .about-profile {
    height: min(34svh, 340px);
    width: min(360px, 92%);
  }
}

    /* =========================
       TEXT
    ========================= */
    .about-name {
      text-align: center;
      font-weight: 900;
      font-size: clamp(20px, 2.6vw, 34px);
      margin: 6px 0 4px;
      letter-spacing: 0.02em;
      color: var(--text-main); /* explicit */
    }

    .about-meta {
      text-align: center;
      font-weight: 800;
      font-size: clamp(13px, 1.3vw, 17px);
      margin-bottom: 14px;

      color: var(--text-soft);     /* NEW */
      letter-spacing: 0.03em;      /* NEW: improves readability */
      opacity: 1;                  /* ensure colour controls opacity */
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: clamp(12px, 1.1vw, 15px);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-main); /* stays crisp */
    }

    .about-copy {
      text-align: center;
      font-weight: 800;
      font-size: clamp(13px, 1.4vw, 18px);
      line-height: 1.55;
      margin-bottom: 8px;

      color: var(--text-soft);   /* NEW */
      letter-spacing: 0.03em;    /* NEW */
    }

    .about-note {
      text-align: center;
      font-weight: 900;
      font-size: clamp(12px, 1.2vw, 16px);
      margin-top: 10px;

      color: var(--text-muted);  /* NEW */
      opacity: 1;
    }

    .about-handle {
      text-align: center;
      font-weight: 900;
      font-size: clamp(14px, 1.4vw, 19px);
      margin-top: 6px;

      color: var(--accent);      /* NEW */
    }

    /* =========================
       CTA BUTTONS
    ========================= */
    .about-cta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .about-btn {
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: clamp(13px, 1.2vw, 17px);
      text-decoration: none;

      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.14);
      cursor: pointer;

      color: var(--text-main); /* NEW */
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .about-btn.primary {
      background: rgba(255,255,255,0.24);
      border-color: rgba(143, 183, 195, 0.55); /* NEW: subtle accent */
    }

    .about-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.3);
      color: var(--accent); /* NEW */
    }

    /* =========================
       BACK LINK
    ========================= */
    /* BACK LINK — default (desktop/tablet): top-left */
.back.back-about {
  position: fixed;
  z-index: 10;
  top: max(12px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  right: auto;
}
@media (max-width: 520px) {
  /* Keep it visible/clickable without sitting on top of the card/photo */
  .back.back-about {
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
  }
}
@media (max-width: 520px) {
  /* Let the card fit content (no big empty white area), but still cap it to viewport */
  .about-card {
    height: auto;                           /* key: removes forced empty space */
    max-height: calc(100svh - 88px);        /* keeps it from going under the back button */
    overflow-y: auto;                       /* scroll only if genuinely needed */
    top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Show the whole photo (no crop) */
  .about-profile {
    height: auto;                           /* key: let the image determine height */
    max-height: 38svh;                      /* keeps it from dominating the card */
    width: min(360px, 92%);
    object-fit: contain;                    /* key: no cropping */
    object-position: center;
  }
}


    @media (max-width: 420px) {
      .about-card { padding: 14px; }
    }
  </style>
</head>

<body class="fade-in-page">
  <a class="back back-about" href="home.html">← Back</a>

  <section class="about-section">
    <div class="about-bg" aria-hidden="true"></div>

    <div class="about-card">
      <img src="images/about/profile.jpg" class="about-profile" alt="Iggy Macdonald">

      <div class="about-name">Iggy Macdonald</div>
      <div class="about-meta">
        London, UK • Aotearoa, New Zealand
      </div>
      <div class="about-copy">
      UK/NZ licence &amp; passport
      </div>
   
      <div class="about-copy">
        Multidisciplinary artist working across film, photography, fashion, art & music. 
      </div>
      <div class="chip-row">
        <div class="chip">Art Dept</div>
        <div class="chip">Lighting</div>
        <div class="chip">Production</div>
        <div class="chip">SFX</div>
      </div>

      <div class="about-note">References &amp; CV on request</div>
      <div class="about-handle">@iggysmalllls</div>

      <div class="about-cta">
        <a class="about-btn primary" href="mailto:macdonald.iggy@gmail.com">Email</a>
        <a class="about-btn primary" href="https://wa.me/447432435885" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a class="about-btn primary" href="https://www.instagram.com/iggysmalllls/" target="_blank">
          Instagram
        </a>
      </div>
    </div>
  </section>
</body>
</html>
