<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>inigo365— About</title>
  <link rel="icon" type="image/png" href="./images/icon.png" />

  <!-- SEO -->
  <meta name="description" content="Iggy Macdonald — Art Department, Lighting, Production, SFX. London based. Available worldwide. UK licence & passport." />

  <style>
    @font-face {
      font-family: "RuneScape UF";
      src: url("./fonts/RuneScape-UF.woff2") format("woff2"),
           url("./fonts/RuneScape-UF.woff") format("woff");
      font-display: swap;
    }

    :root{
      --accent: #2d93ea;   /* matches home page */
      --btn: #000000;
    }

    /* =========================
       BASE (match home behaviour)
       ========================= */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;          /* page itself never scrolls */
      overflow-x: hidden;
      overscroll-behavior: none;

      font-family: "RuneScape UF", Arial, sans-serif;

      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
      background: transparent;
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* hard lock sideways */
    html, body { max-width: 100%; }
    .about-section, .about-card { max-width: 100%; }
    .about-card { overflow-x: hidden; touch-action: pan-y; }

    /* =========================
       LAYOUT (unchanged)
       ========================= */
    .about-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      margin: 0;
    }

    /* TRUE edge-to-edge background (match home) */
    .about-bg {
      position: fixed;
      inset: 0;
      z-index: 0;

      background-image: url("images/about/background.png");
      background-size: cover;
      background-position: 50% 35%;
      background-repeat: no-repeat;
      background-attachment: fixed;

      width: 100vw;
      height: 100vh;
    }

    @media (max-width: 768px){
      .about-bg{ background-attachment: scroll; }
    }

    /* =========================
       CARD (restyled to match home tray)
       Layout kept the same (fixed + centered + scroll inside)
       ========================= */
    .about-card {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;

      width: min(76ch, 92vw);
      height: calc(100svh - 32px);     /* fixed height = viewport */
      overflow-y: auto;                /* scroll inside the card */
      -webkit-overflow-scrolling: touch;

      padding: clamp(16px, 2.4vw, 24px);

      /* HOME STYLE */
      border-radius: 0;
      border: 2px solid #000;
      background: rgba(255,255,255,0.69);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);

      opacity: 0;
      transition: opacity 700ms ease;

      /* keep your layout exactly */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    body.fade-in-page .about-card { opacity: 1; }

    .about-card * {
      font-family: "RuneScape UF", Arial, sans-serif;
      color: #000;
      text-shadow: none;
    }

    /* =========================
       PROFILE IMAGE (layout unchanged)
       ========================= */
    .about-profile {
      display: block;
      margin: 0 auto 14px;

      width: min(520px, 92%);
      height: min(58svh, 520px);
      object-fit: cover;
      object-position: center;

      background: rgba(0,0,0,0.0);
      padding: 3px;

      border-radius: 0;
      border: 0px solid #000;
      box-shadow: 0 6px 18px rgba(0,0,0,0.0);
    }

    @media (max-width: 520px) {
      .about-profile {
        height: min(34svh, 340px);
        width: min(360px, 92%);
      }
    }

    /* =========================
       TEXT (same layout, home typography feel)
       ========================= */
    .about-name {
      text-align: center;
      font-weight: 900;
      font-size: clamp(20px, 2.6vw, 34px);
      margin: 6px 0 4px;
      letter-spacing: 0.02em;
      text-transform: none; /* keep as-is */
    }

    .about-meta {
      text-align: center;
      font-weight: 800;
      font-size: clamp(13px, 1.3vw, 17px);
      margin-bottom: 14px;
      letter-spacing: 0.03em;
      opacity: 0.9;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chip {
      padding: 7px 10px;
      border-radius: 0;
      font-weight: 900;
      font-size: clamp(12px, 1.1vw, 15px);

      border: 2px solid #000;
      background: rgba(255,255,255,0.74);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .about-copy {
      text-align: center;
      font-weight: 800;
      font-size: clamp(13px, 1.4vw, 18px);
      line-height: 1.55;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
      opacity: 0.9;
    }

    .about-note {
      text-align: center;
      font-weight: 900;
      font-size: clamp(12px, 1.2vw, 16px);
      margin-top: 10px;
      opacity: 0.85;
    }

    .about-handle {
      text-align: center;
      font-weight: 900;
      font-size: clamp(14px, 1.4vw, 19px);
      margin-top: 6px;
      color: var(--accent);
    }

    /* =========================
       CTA BUTTONS (home-style: crisp, underline on hover)
       ========================= */
    .about-cta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .about-btn {
      padding: 10px 14px;
      border-radius: 0;
      font-weight: 900;
      font-size: clamp(13px, 1.2vw, 17px);
      text-decoration: none;

      border: 2px solid #000;
      background: rgba(255,255,255,0.74);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      color: #000;
      transition: opacity 0.15s ease;
    }

    .about-btn.primary {
      /* keep same look; just a tiny bit more present */
      background: rgba(255,255,255,0.82);
    }

    .about-btn:hover {
      text-decoration: underline;
    }

    /* =========================
       BACK LINK (match home back button vibe)
       ========================= */
    .back.back-about{
  position: fixed;
  z-index: 10;
  top: max(12px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  right: auto;

  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 28px;

  border: 0px solid #000;
  padding: 6px 10px;

  color: #000;
  text-decoration: none;
  line-height: 1;
}
.back.back-about:hover{ text-decoration: underline; }


    @media (max-width: 520px) {
      .back.back-about {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
      }
    }

    /* Your existing mobile layout tweaks (kept) */
    @media (max-width: 520px) {
      .about-card {
        height: auto;
        max-height: calc(100svh - 88px);
        overflow-y: auto;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .about-profile {
        height: auto;
        max-height: 38svh;
        width: min(360px, 92%);
        object-fit: contain;
        object-position: center;
      }
    }

    @media (max-width: 420px) {
      .about-card { padding: 14px; }
    }

    /* =========================
       iOS reliability: use --vh so the card never ends up under Safari UI
       (doesn't change your layout, just makes the "viewport" unit accurate)
       ========================= */
    @media (max-width: 768px){
      .about-section{
        height: calc(var(--vh, 1vh) * 100);
      }
      .about-card{
        height: calc((var(--vh, 1vh) * 100) - 32px);
      }
    }
  </style>
</head>

<body class="fade-in-page">
  <a class="back back-about" href="home.html">← Back</a>

  <section class="about-section">
    <div class="about-bg" aria-hidden="true"></div>

    <div class="about-card">
      <img src="images/about/profile.jpg" class="about-profile" alt="Iggy Macdonald">

      <div class="about-name">Iggy Macdonald</div>
      <div class="about-meta">
        London, UK • Aotearoa, New Zealand
      </div>
      <div class="about-copy">
        UK/NZ licence &amp; passport
      </div>

      <div class="about-copy">
        Multidisciplinary artist working across film, photography, fashion, art &amp; music.
      </div>

      <div class="chip-row">
        <div class="chip">Art Dept</div>
        <div class="chip">Lighting</div>
        <div class="chip">Production</div>
        <div class="chip">SFX</div>
      </div>

      <div class="about-note">References &amp; CV on request</div>
      <div class="about-handle">@iggysmalllls</div>

      <div class="about-cta">
        <a class="about-btn primary" href="mailto:macdonald.iggy@gmail.com">Email</a>
        <a class="about-btn primary" href="https://wa.me/447432435885" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a class="about-btn primary" href="https://www.instagram.com/iggysmalllls/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </div>
  </section>

  <script>
    // iOS Safari: reliable viewport unit
    (function () {
      const setVh = () => {
        document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
      };
      setVh();
      window.addEventListener("resize", setVh);
      window.addEventListener("orientationchange", setVh);
    })();

    // keep pinch-zoom gesture glitches away (same vibe as home)
    document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
    document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
    document.addEventListener("gestureend", (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
