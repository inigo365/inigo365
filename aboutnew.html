<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>inigo365— About</title>
  <link rel="icon" type="image/png" href="./images/icon.png" />
  <link rel="stylesheet" href="style.css" />

  <!-- SEO -->
  <meta name="description" content="Iggy Macdonald — Art Department, Lighting, Production, SFX. London based. Available worldwide. UK licence & passport." />

  <style>
    /* =========================
       COLOURS (NEW)
    ========================= */
   :root{
  --text-main: #111817;
  --text-soft: #2a3634;
  --text-muted: #4a5c5a;
  --accent: #0f3f3a;
}


    /* =========================
       BASE
    ========================= */
    html, body {
      height: 100%;
      margin: 0;
    }

    .about-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      margin: 0;
    }

    /* TRUE edge-to-edge background */
    .about-bg {
      position: fixed;
      inset: 0;
      z-index: 0;

      background-image: url("images/about/about-mobile1.jpg");
      background-size: cover;
      background-position: 50% 35%;
      background-repeat: no-repeat;

      width: 100vw;
      height: 100vh;
    }

    /* (Unused now, safe to remove later) */
    .about-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 35%;
      transform: scale(1.04);
    }

    @media (max-width: 520px) {
      .about-image { object-position: 50% 30%; }
    }

    /* =========================
       CARD
    ========================= */
    .about-card {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;

  width: min(76ch, 92vw);
  height: calc(100svh - 32px);     /* fixed height = viewport */
  overflow-y: auto;                /* scroll inside the card */
  -webkit-overflow-scrolling: touch;

  padding: clamp(16px, 2.4vw, 24px);
  border-radius: 18px;

  background: rgba(245, 248, 247, 0.85);
  border: 1px solid rgba(111, 213, 118, 0.22);
  box-shadow: 0 14px 40px rgba(0,0,0,0.28);
  outline: 1px solid rgba(255,255,255,0.06);

  opacity: 0;
  transition: opacity 700ms ease;

  /* NEW */
  display: flex;
  flex-direction: column;
  align-items: center;             /* centres image + text */
  text-align: center;
}


    body.fade-in-page .about-card { opacity: 1; }

    .about-card * {
      font-family: "RuneScape UF", Arial, sans-serif;
      color: var(--text-main); /* NEW */
      text-shadow: none;

    }

    /* =========================
       PROFILE IMAGE
    ========================= */
    .about-profile {
  display: block;
  margin: 0 auto 14px;

  width: min(520px, 92%);
  height: min(58svh, 520px);       /* BIG on desktop, pushes text down */
  object-fit: cover;               /* fills the frame */
  object-position: center;         /* always centred */

  background: rgba(0,0,0,0.0);
  padding: 3px;

  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.0);
  box-shadow: 0 10px 22px rgba(0,0,0,0.00);
}

/* Mobile: reduce the image so it doesn't eat the whole card */
@media (max-width: 520px) {
  .about-profile {
    height: min(34svh, 340px);
    width: min(360px, 92%);
  }
}

    /* =========================
       TEXT
    ========================= */
    .about-name {
      text-align: center;
      font-weight: 900;
      font-size: clamp(20px, 2.6vw, 34px);
      margin: 6px 0 4px;
      letter-spacing: 0.02em;
      color: var(--text-main); /* explicit */
    }

    .about-meta {
      text-align: center;
      font-weight: 800;
      font-size: clamp(13px, 1.3vw, 17px);
      margin-bottom: 14px;

      color: var(--text-soft);     /* NEW */
      letter-spacing: 0.03em;      /* NEW: improves readability */
      opacity: 1;                  /* ensure colour controls opacity */
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: clamp(12px, 1.1vw, 15px);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-main); /* stays crisp */
    }

    .about-copy {
      text-align: center;
      font-weight: 800;
      font-size: clamp(13px, 1.4vw, 18px);
      line-height: 1.55;
      margin-bottom: 8px;

      color: var(--text-soft);   /* NEW */
      letter-spacing: 0.03em;    /* NEW */
    }

    .about-note {
      text-align: center;
      font-weight: 900;
      font-size: clamp(12px, 1.2vw, 16px);
      margin-top: 10px;

      color: var(--text-muted);  /* NEW */
      opacity: 1;
    }

    .about-handle {
      text-align: center;
      font-weight: 900;
      font-size: clamp(14px, 1.4vw, 19px);
      margin-top: 6px;

      color: var(--accent);      /* NEW */
    }

    /* =========================
       CTA BUTTONS
    ========================= */
    .about-cta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .about-btn {
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: clamp(13px, 1.2vw, 17px);
      text-decoration: none;

      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.14);
      cursor: pointer;

      color: var(--text-main); /* NEW */
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .about-btn.primary {
      background: rgba(255,255,255,0.24);
      border-color: rgba(143, 183, 195, 0.55); /* NEW: subtle accent */
    }

    .about-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.3);
      color: var(--accent); /* NEW */
    }

    /* =========================
       BACK LINK
    ========================= */
.back.back-about {
  position: fixed;
  z-index: 10;
  top: max(12px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  right: auto;
}
@media (max-width: 520px) {
  .back.back-about {
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
  }
}
@media (max-width: 520px) {
  .about-card {
    height: auto;
    max-height: calc(100svh - 88px);
    overflow-y: auto;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .about-profile {
    height: auto;
    max-height: 38svh;
    width: min(360px, 92%);
    object-fit: contain;
    object-position: center;
  }
}

    @media (max-width: 420px) {
      .about-card { padding: 14px; }
    }

    /* =========================================================
       SECRET GAME (ADDITIVE ONLY — DOES NOT AFFECT LAYOUT)
    ========================================================= */

    .profile-wrap {
  position: relative;
  display: inline-block;
  border-radius: 0;
  overflow: visible; /* important: do NOT clip the image */
}
.profile-game {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;

  /* HARD CLIP the overlay to match the image corners */
  border-radius: 10px;
  clip-path: inset(0 round 10px);
}

.profile-win {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;

  border-radius: 10px;
  clip-path: inset(0 round 10px);
}



    /* Invisible hotspot positioned in % of the image box */
    .pop-hotspot {
      position: absolute;
      /* Based on your screenshot: POP region */
      left: 56.3%;
      top: 79.5%;
      width: 27.3%;
      height: 20.5%;
      background: transparent;
      pointer-events: auto;
      cursor: default;
      z-index: 5;
    }

    .profile-win-inner {
      pointer-events: auto;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(0,0,0,0.15);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      max-width: 92%;
    }

    .profile-win-code {
      font-weight: 900;
      font-size: clamp(14px, 1.6vw, 18px);
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .profile-win-btn {
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 900;
      border: 1px solid rgba(0,0,0,0.2);
      background: rgba(255,255,255,0.9);
      cursor: pointer;
    }
  </style>
</head>

<body class="fade-in-page">
  <a class="back back-about" href="home.html">← Back</a>

  <section class="about-section">
    <div class="about-bg" aria-hidden="true"></div>

    <div class="about-card">
      <!-- ONLY change here: wrap the image, overlay canvas + hotspot -->
      <div class="profile-wrap" id="profileWrap">
        <img src="images/about/profile.jpg" class="about-profile" alt="Iggy Macdonald" id="profileImg">

        <canvas class="profile-game" id="profileGame" aria-hidden="true"></canvas>
        <div class="pop-hotspot" id="popHotspot" aria-hidden="true"></div>

        <div class="profile-win" id="profileWin" aria-hidden="true">
          <div class="profile-win-inner">
            <div class="profile-win-code" id="winCode">PASSCODE: …</div>
            <button class="profile-win-btn" id="copyBtn">Copy</button>
          </div>
        </div>
      </div>

      <div class="about-name">Iggy Macdonald</div>
      <div class="about-meta">
        London, UK • Aotearoa, New Zealand
      </div>
      <div class="about-copy">
      UK/NZ licence &amp; passport
      </div>

      <div class="about-copy">
        Multidisciplinary artist working across film, photography, fashion, art & music.
      </div>
      <div class="chip-row">
        <div class="chip">Art Dept</div>
        <div class="chip">Lighting</div>
        <div class="chip">Production</div>
        <div class="chip">SFX</div>
      </div>

      <div class="about-note">References &amp; CV on request</div>
      <div class="about-handle">@iggysmalllls</div>

      <div class="about-cta">
        <a class="about-btn primary" href="mailto:macdonald.iggy@gmail.com">Email</a>
        <a class="about-btn primary" href="https://wa.me/447432435885" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a class="about-btn primary" href="https://www.instagram.com/iggysmalllls/" target="_blank">
          Instagram
        </a>
      </div>
    </div>
  </section>

  <script>
    // =========================
    // CONFIG
    // =========================
    const SECRET_CODE = "YOUR-PASSCODE-HERE";
    const POP_SOUND_URL = "go/sounds/password.mp3";

    // Win conditions:
    const SURVIVE_SECONDS = 20;
    const SCORE_TARGET = 25;

    // =========================
    // ELEMENTS
    // =========================
    const img = document.getElementById("profileImg");
    const wrap = document.getElementById("profileWrap");
    const canvas = document.getElementById("profileGame");
    const hotspot = document.getElementById("popHotspot");

    const winLayer = document.getElementById("profileWin");
    const winCode = document.getElementById("winCode");
    const copyBtn = document.getElementById("copyBtn");

    const popAudio = new Audio(POP_SOUND_URL);
    popAudio.preload = "auto";

    // =========================
    // CANVAS DPI SAFE RESIZE
    // =========================
    const ctx = canvas.getContext("2d", { alpha: true });

    function resizeCanvasToElement() {
      const r = img.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      canvas.width = Math.max(1, Math.floor(r.width * dpr));
      canvas.height = Math.max(1, Math.floor(r.height * dpr));
      canvas.style.width = r.width + "px";
      canvas.style.height = r.height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels
    }

    const ro = new ResizeObserver(() => {
      resizeCanvasToElement();
    });
    ro.observe(img);

    window.addEventListener("resize", resizeCanvasToElement);

    // =========================
    // GAME STATE
    // =========================
    let running = false;
    let startTime = 0;
    let lastT = 0;

    // Runner mechanics (simple, monochrome)
    const state = {
      player: { x: 0, y: 0, w: 10, h: 10, vy: 0 },
      obstacles: [],
      score: 0,
      nextSpawn: 0,
      grounded: true
    };

    function resetGame() {
      const w = img.getBoundingClientRect().width;
      const h = img.getBoundingClientRect().height;

      // Ground line (not drawn) near bottom of image
      const groundY = h * 0.94;

      state.player.x = w * 0.18;
      state.player.y = groundY - state.player.h;
      state.player.vy = 0;
      state.grounded = true;

      state.obstacles = [];
      state.score = 0;

      // spawn timer
      state.nextSpawn = 0;

      winLayer.style.display = "none";
      winLayer.style.pointerEvents = "none";
    }

    function startGame() {
      if (running) return;

      resizeCanvasToElement();
      resetGame();

      running = true;
      startTime = performance.now();
      lastT = startTime;

      // Enable interaction only during game
      canvas.style.pointerEvents = "auto";

      // Best effort: play sound on user gesture
      popAudio.currentTime = 0;
      popAudio.play().catch(()=>{});

      requestAnimationFrame(loop);
    }

    function stopGameWin() {
      running = false;
      canvas.style.pointerEvents = "none";

      winCode.textContent = `PASSCODE: ${SECRET_CODE}`;
      winLayer.style.display = "flex";
      winLayer.style.pointerEvents = "none"; // inner handles pointer events
    }

    // =========================
    // DRAW
    // =========================
    function clear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function draw() {
  clear();

  const w = img.getBoundingClientRect().width;
  const h = img.getBoundingClientRect().height;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, w, h);
  ctx.clip();

  const groundY = h * 0.94;

  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.fillRect(state.player.x, state.player.y, state.player.w, state.player.h);

  for (const o of state.obstacles) ctx.fillRect(o.x, o.y, o.w, o.h);

  // HUD (make it white now)
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.font = "900 12px RuneScape UF, Arial, sans-serif";
  const elapsed = (performance.now() - startTime) / 1000;
  ctx.fillText(`${Math.min(SURVIVE_SECONDS, elapsed).toFixed(1)}s  |  ${Math.floor(state.score)}`, 10, 18);

  ctx.restore();
}


    // =========================
    // UPDATE
    // =========================
    function loop(t) {
      if (!running) return;

      const dt = Math.min(0.04, (t - lastT) / 1000);
      lastT = t;

      const w = img.getBoundingClientRect().width;
      const h = img.getBoundingClientRect().height;
      const groundY = h * 0.94;

      // gravity
      const gravity = 1050; // px/s^2
      state.player.vy += gravity * dt;
      state.player.y += state.player.vy * dt;

      // ground collision
      if (state.player.y >= groundY - state.player.h) {
        state.player.y = groundY - state.player.h;
        state.player.vy = 0;
        state.grounded = true;
      } else {
        state.grounded = false;
      }

      // spawn obstacles
      state.nextSpawn -= dt;
      if (state.nextSpawn <= 0) {
        const speed = 210; // px/s
        const ow = 8 + Math.random() * 10;   // 8–18
        const oh = 10 + Math.random() * 18;  // 10–28
        state.obstacles.push({
          x: w + 10,
          y: groundY - oh,
          w: ow,
          h: oh,
          vx: speed + Math.random() * 60
        });

        // spawn interval: slightly random but fair
        state.nextSpawn = 0.55 + Math.random() * 0.55;
      }

      // move obstacles, score when passed
      for (const o of state.obstacles) {
        o.x -= o.vx * dt;

        // score when obstacle passes player (once)
        if (!o._scored && (o.x + o.w) < state.player.x) {
          o._scored = true;
          state.score += 1;
        }
      }

      // remove offscreen
      state.obstacles = state.obstacles.filter(o => o.x + o.w > -20);

      // collision
      for (const o of state.obstacles) {
        const hit =
          state.player.x < o.x + o.w &&
          state.player.x + state.player.w > o.x &&
          state.player.y < o.y + o.h &&
          state.player.y + state.player.h > o.y;

        if (hit) {
          // restart silently (keeps secret vibe)
          resetGame();
          startTime = performance.now();
          lastT = startTime;
          break;
        }
      }

      // win conditions
      const elapsed = (t - startTime) / 1000;
      if (elapsed >= SURVIVE_SECONDS || state.score >= SCORE_TARGET) {
        stopGameWin();
        draw(); // final frame
        return;
      }

      draw();
      requestAnimationFrame(loop);
    }

    // =========================
    // CONTROLS
    // =========================
    function jump() {
      if (!running) return;
      if (!state.grounded) return;

      state.player.vy = -420; // jump impulse
      state.grounded = false;
    }

    // Tap/click inside image to jump (only when running)
    canvas.addEventListener("pointerdown", (e) => {
      if (!running) return;
      e.preventDefault();
      jump();
    });

    // Space to jump
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (running) {
          e.preventDefault();
          jump();
        }
      }
    });

    // =========================
    // SECRET TRIGGER
    // =========================
    hotspot.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      startGame();
    });

    // =========================
    // WIN: COPY
    // =========================
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(SECRET_CODE);
        copyBtn.textContent = "Copied ✓";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
      } catch {
        // fallback: do nothing (still secret)
        copyBtn.textContent = "Copy failed";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
      }
    });

    // Initial sizing (in case RO hasn't fired yet)
    window.addEventListener("load", () => {
      resizeCanvasToElement();
      // keep overlay aligned with image radius/padding visually
      // (canvas already has border-radius via CSS)
    });
  </script>
</body>
</html>
