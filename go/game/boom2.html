<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>put the bag in the bag</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="./images/icon.png">
<style>
@font-face {
  font-family: "RuneScape UF";
  src: url("../../fonts/RuneScape-UF.woff2") format("woff2"),
       url("../../fonts/RuneScape-UF.woff") format("woff");
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "RuneScape UF", Arial, sans-serif;
  cursor: url("../../images/cursor/cursor.png"), auto;
  background: #fff;
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

/* Custom hover cursor for all interactive elements */
button,
a,
input,
.leaderboard-btn,
.leaderboard-close {
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* ===================== TOP SCORE HUD ===================== */
#topScores{
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 4vw, 40px);

  height: 44px;
  padding: 0 16px;
  white-space: nowrap;

  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(18px, 2.2vw, 26px);
  line-height: 1;

  color: #2d93ea;

  background: rgba(255, 255, 255, 0.15);
  border: 1.5px solid rgba(45, 147, 234, 0.25);
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
}

#topScores > div{
  flex: 0 0 auto;
}

/* ===================== HUD STACK (below top scores) ===================== */
#hudStack {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 60px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
}

/* ===================== SHIELD HUD ICON ===================== */
#shieldHud {
  display: flex;
  align-items: center;
  gap: 6px;

  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(14px, 1.8vw, 18px);
  color: #2d93ea;

  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: opacity 0.3s ease, max-height 0.3s ease;
}

#shieldHud.active {
  opacity: 1;
  max-height: 30px;
}

#shieldHud img {
  width: 24px;
  height: 24px;
  image-rendering: pixelated;
}

/* Pickup notification toasts */
#pickupNotifications {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.pickup-toast {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(14px, 1.8vw, 18px);
  color: gold;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  transform: translateY(-6px);
}

.pickup-toast.show {
  opacity: 1;
  transform: translateY(0);
}

.pickup-toast img {
  width: 24px;
  height: 24px;
  image-rendering: pixelated;
}

#rotateNotice {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    color: #2d93ea;
    font-family: 'RuneScape UF', Arial, sans-serif;
    font-size: 5vw;
    text-align: center;
    line-height: 100vh;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
}

#rotateNotice.active {
    opacity: 1;
    pointer-events: none;
}

/* ===================== SHARED GAME BUTTON ===================== */
.game-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  background: transparent;
  border: none;
  color: #2d93ea;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  text-transform: lowercase;
  padding: 4px 8px;
  touch-action: none;
  transition: opacity 0.5s ease, transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.game-btn:hover {
  transform: scale(1.08);
}

.game-btn:active {
  transform: scale(0.95);
}

/* Back Button */
.back-button {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 100;
  opacity: 0;
  padding: 0;
}

/* Music Button (game-over only fallback — hidden on home now) */
.music-button {
  position: fixed;
  bottom: 8px;
  left: 8px;
  z-index: 400;
  opacity: 0;
  padding: 0;
}

/* ===================== HOME SCREEN CENTRE STACK ===================== */
#homeUI {
  position: fixed;
  top: 66%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 61;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
}

#homeUI.active {
  opacity: 1;
  pointer-events: auto;
}

#startSplash {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(18px, 4.5vw, 36px);
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.25);
  white-space: nowrap;
  pointer-events: none;
}

#homeToggles {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

#homeToggles button {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(16px, 3.5vw, 22px);
  background: transparent;
  border: none;
  color: white;
  opacity: 0.7;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  text-transform: lowercase;
  padding: 2px 4px;
  transition: opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}

#homeToggles button:hover {
  opacity: 1;
}

#homeToggles .home-sep {
  color: white;
  opacity: 0.35;
  font-size: clamp(16px, 3.5vw, 22px);
  user-select: none;
}

#homeHowToBtn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(18px, 4vw, 28px);
  background: transparent;
  border: none;
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.25);
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  text-transform: lowercase;
  padding: 4px 8px;
  transition: opacity 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}

#homeHowToBtn:hover {
  transform: scale(1.08);
}

#homeHowToBtn:active {
  transform: scale(0.95);
}

canvas {
  display: block;
  margin: 0 auto;
  background: transparent;
  position: relative;
  z-index: 2; /* above the white overlay */
}


/* Point Popup */
.point-popup {
  position: absolute;
  font-size: 28px;
  color: #d1dce8;
  font-family: "RuneScape UF", Arial, sans-serif;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 6;
}

/* Name Input Modal */
.name-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  flex-direction: column;
  pointer-events: none;
}

.name-modal > * {
  pointer-events: auto;
}

.name-modal.show {
  display: flex;
}

.name-modal h2 {
  font-size: 36px;
  color: #2d93ea;
  margin-bottom: 8px;
}

.name-modal .final-score {
  font-size: 28px;
  color: #2d93ea;
  margin-bottom: 24px;
}

.name-modal input {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  padding: 12px 16px;
  border: 2px solid #2d93ea;
  background: white;
  outline: none;
  text-align: center;
  width: 200px;
  margin-bottom: 16px;
}

.name-modal button {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  padding: 12px 32px;
  border: 2px solid #2d93ea;
  background: #2d93ea;
  color: white;
  margin-top: 12px;
}

.name-modal button:hover {
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* Inline leaderboard / goodybag links inside name modal */
.modal-actions-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
  margin-bottom: 0;
}

.modal-link-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 18px;
  background: transparent;
  border: none;
  color: #2d93ea;
  opacity: 0.8;
  padding: 2px 4px;
  text-transform: lowercase;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  transition: opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.modal-link-btn:hover {
  opacity: 1;
}

.modal-link-sep {
  color: #2d93ea;
  opacity: 0.35;
  font-size: 18px;
  user-select: none;
}

/* Game Over sprite display */
.game-over-sprite {
  width: 64px;
  height: 64px;
  margin-bottom: 12px;
  image-rendering: pixelated;
}

/* Primary button (submit) */
.name-modal .btn-primary {
  background: #2d93ea;
  color: white;
  border: 2px solid #2d93ea;
}

.name-modal .btn-primary:hover {
  background: #1a7bd4;
  border-color: #1a7bd4;
}

/* Secondary button (play again) */
.name-modal .btn-secondary {
  background: transparent;
  color: #2d93ea;
  border: 2px solid #2d93ea;
}

.name-modal .btn-secondary:hover {
  background: rgba(45, 147, 234, 0.08);
}

/* Leaderboard */
#leaderboardBackdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.75);
  display: none;
  z-index: 9999;
  align-items: center;
  justify-content: center;
}

.leaderboard {
  background: white;
  border: 2px solid #2d93ea;
  padding: 24px;
  padding-top: 16px;
  min-width: 280px;
  max-width: calc(100vw - 32px);
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  box-sizing: border-box;
}

.leaderboard h3 {
  font-size: 28px;
  color: #2d93ea;
  margin: 0 0 16px 0;
  text-align: center;
}

.leaderboard-entry {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  color: #2d93ea;
  padding: 8px 0;
  border-bottom: 1px solid #e0e0e0;
}

.leaderboard-entry:last-child {
  border-bottom: none;
}

.leaderboard-entry .rank {
  width: 30px;
}

.leaderboard-entry .name {
  flex: 1;
  text-align: left;
  padding-left: 8px;
}

.leaderboard-entry .score {
  width: 60px;
  text-align: right;
}

/* Top 3 leaderboard medals */
.leaderboard-entry.rank-1 {
  color: #d4a017;
  font-weight: bold;
  font-size: 24px;
  padding: 10px 4px;
  border-radius: 2px;
  animation: rank1Glow 2.5s ease-in-out infinite;
}

@keyframes rank1Glow {
  0%, 100% { background: rgba(212, 160, 23, 0.04); }
  50%      { background: rgba(212, 160, 23, 0.12); }
}

.leaderboard-entry.rank-2 {
  color: #a8a8a8;
  font-weight: bold;
  font-size: 22px;
  padding: 8px 0;
}

.leaderboard-entry.rank-3 {
  color: #cd7f32;
  font-weight: bold;
  font-size: 22px;
  padding: 8px 0;
}

/* Highlight player's own entry */
.leaderboard-entry.is-player {
  background: rgba(45, 147, 234, 0.08);
  border-radius: 4px;
}

.leaderboard-btn {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 100;
  display: none;
}

.leaderboard-close {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 28px;
  background: transparent;
  border: none;
  color: #2d93ea;
  font-family: "RuneScape UF", Arial, sans-serif;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  -webkit-tap-highlight-color: transparent;
}

#overlayHighscore{
  position: fixed;
  top: 40px;           /* 8px button top + ~24px button height + gap */
  right: 8px;          /* align with leaderboard button */
  font-size: 24px;
  color: #2d93ea;
  font-family: "RuneScape UF", Arial, sans-serif;
  text-align: right;
  z-index: 1001;        /* above playWrap (50) */
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
  white-space: nowrap;
}

.soundcloud-btn {
  position: fixed;
  bottom: 8px;
  right: 15px;
  z-index: 400;
  display: none;
}

/* Goodybag Backdrop */
#goodybagBackdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.75);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 9998;
}

#goodybagBackdrop.active {
    display: flex;
    opacity: 1;
    pointer-events: auto;
}

#goodybagBackdrop button {
    font-family: "RuneScape UF", Arial, sans-serif;
    color: #2d93ea;
    background: transparent;
    border: none;
    font-size: 24px;
    cursor: url("../../images/cursor/cursor-hover.png"), pointer;
    margin: 10px;
}

#goodybagBackdrop .leaderboard button {
    margin: 8px 0;               /* vertical spacing between buttons */
    text-align: center;
}

#goodybagContent {
    text-align: center;          /* center text inside simple divs */
    display: flex;               /* make container flex */
    flex-direction: column;      /* stack child elements vertically */
    align-items: center;         /* center horizontally */
    justify-content: flex-start; /* top-aligned */
    gap: 12px;                   /* spacing between items */
}
#goodybagContent ul {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: center;          /* center track names */
}
#goodybagContent li {
    margin: 4px 0;
}

/* Soundtrack page wrapper */
.soundtrack-wrapper {
  width: min(520px, 86vw);
  box-sizing: border-box;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.soundtrack-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.soundtrack-header .soundtrack-title {
  font-weight: bold;
}

.soundtrack-header .soundtrack-link-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 20px;
  padding: 4px 8px;
  background: transparent;
  border: none;
  color: #2d93ea;
  text-transform: lowercase;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

.soundtrack-tracklist {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
  flex: 0 1 auto;
  overflow-y: auto;
  padding-right: 6px;
  max-height: 50vh;
  margin-bottom: 10px;
}

.soundtrack-tracklist li {
  margin: 4px 0;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.soundtrack-bottom {
  display: flex;
  align-items: center;
  margin-top: 8px;
  width: 100%;
}

.soundtrack-bottom .soundtrack-nav {
  display: flex;
  gap: 12px;
  flex: 0 0 auto;
  justify-content: flex-start;
}

.soundtrack-bottom .soundtrack-spacer {
  flex: 1 1 auto;
}

.soundtrack-nav-btn,
.soundtrack-select-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  background: transparent;
  border: none;
  color: #2d93ea;
  text-transform: lowercase;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* Password unlock items with sprites */
.password-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 6px 0;
  font-size: 20px;
  color: #2d93ea;
}

.password-item img {
  width: 32px;
  height: 32px;
  image-rendering: pixelated;
}

.password-link {
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: background 0.15s ease, transform 0.15s ease;
}

.password-link:hover {
  background: rgba(45, 147, 234, 0.08);
  transform: scale(1.04);
}

.password-link:active {
  transform: scale(0.96);
}

/* Collection grid - max 10 across (48px sprite + 8px gap = 56px each, 10 * 56 - 8 = 552) */
.collection-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 8px 0;
  max-width: 552px;
  margin: 0 auto;
  max-height: 50vh;
  overflow-y: auto;
}

.collection-sprite {
  width: 48px;
  height: 48px;
  image-rendering: pixelated;
  opacity: 1;
  transition: transform 0.15s ease;
}

.collection-sprite:hover {
  transform: scale(1.15);
}

.collection-sprite.locked {
  opacity: 0.12;
  filter: grayscale(1);
}

.collection-count {
  font-size: 16px;
  color: #2d93ea;
  opacity: 0.7;
  margin-top: 6px;
}

#goodybagButtons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 360px;
    margin: 20px auto 0;
}

#goodybagButtons button {
    flex: 0 1 auto;
    min-width: 130px;
    text-align: center;
    font-size: 24px;
    background: transparent;
    border: 2px solid #2d93ea;
    color: #2d93ea;
    padding: 8px 16px;
    text-transform: lowercase;
}

#goodybagButtons #collectionBtn {
    flex-basis: 100%;
    max-width: 200px;
}

#goodybagButtons button:disabled {
    opacity: 0.5;
    cursor: default;
}

.goody-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
}

.goody-row button {
    font-family: "RuneScape UF", Arial, sans-serif;
    font-size: 28px;
    background: transparent;
    border: none;
    color: #2d93ea;
    text-transform: lowercase;
    cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}
#howToBackdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.75);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 9998;
}

#howToBackdrop.active {
  display: flex;
  opacity: 1;
  pointer-events: auto;
}

#howToBackdrop .leaderboard {
  width: min(480px, 90vw);
}

#howToButtons {
  display: flex;
  justify-content: center;
  width: 100%;
  margin-top: 20px;
}

#howToButtons button {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  background: transparent;
  border: 2px solid #2d93ea;
  color: #2d93ea;
  padding: 8px 22px;
  text-transform: lowercase;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* How To Play item rows */
.howto-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 8px 0;
  text-align: left;
  font-size: 18px;
  color: #2d93ea;
}

.howto-item img {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  image-rendering: pixelated;
}

.howto-section-title {
  font-size: 20px;
  color: #2d93ea;
  margin: 14px 0 6px;
  text-align: center;
  font-weight: bold;
}

.howto-intro {
  font-size: 18px;
  color: #2d93ea;
  text-align: center;
  margin-bottom: 10px;
  white-space: pre-line;
}

/* One stable overlay "unit" */
#playWrap{
  position: absolute;
  top: 44%;
  left: calc(50% + 8px);
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
  transition: opacity 0.5s, transform 0.5s;
  z-index: 60;
  pointer-events: none; /* enabled when shown via JS */

  /* keep paint cheap */
  will-change: transform, opacity;
}

/* play.png sizing */
#playWrap #playOverlay{
  display: block;
  max-width: 70vw;
  max-height: 70vh;
  width: auto;
  height: auto;
}

/* yellow splash locked to play.png */
#playSplashText{
  position: absolute;

  /* ✅ THIS is the “same place forever” part */
  left: 71.4%;
  top: 61.1%;

  transform: translate(-50%, -50%) rotate(-18deg);
  pointer-events: none;
  white-space: nowrap;
  line-height: 1;

  color: #ffd400;
  font-family: "RuneScape UF", Arial, sans-serif;

  /* ✅ bigger on mobile, smaller on desktop */
  font-size: clamp(18px, 5.2vw, 44px);

  /* ✅ cheap shadow (avoid blur) */
  text-shadow: 1px 1px 0 rgba(0,0,0,0.14);
}
@keyframes playPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -50%) scale(1.05); }
}

#playWrap.pulsing{
  animation: playPulse 1.2s ease-in-out infinite;
}

#funTextPopup{
  white-space: pre-line;  /* ✅ respects \n */
  line-height: 1.25;      /* optional but nice */
}
#pageBg{

  };

  if (!tierBanner) return;

  const now = Date.now();
  const elapsed = now - tierBanner.start;
  if (elapsed > tierBanner.duration) {
    tierBanner = null;
    return;

  const FADE_OUT_MS = 1000;
  let alpha = 1;
  if (elapsed > tierBanner.duration - FADE_OUT_MS) {

  }

  const baseY = tierBanner.baseY || 70;
  const x = canvas.width / 2;

  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';

  if (idx >= NOTBAG_START && idx < NOTBAG_START + NOTBAG_COUNT) {
    return notbagSprites[idx - NOTBAG_START];
  }
  if (idx >= UNLOCK_START && idx < UNLOCK_START + UNLOCK_COUNT) {
    return unlockSprites[idx - UNLOCK_START];
  }
  if (idx >= POWERUP_START && idx < POWERUP_START + POWERUP_COUNT) {
    return powerupSprites[idx - POWERUP_START];
  }
  return null;
}

function getWeightedSpriteIndex(first = false) {
  const used = new Set();
  used.add(ball.spriteIndex);

  // ===== PROGRESSIVE BAG LOGIC =====
  if (!first) {
    const roll = Math.random() * 1000; // scaled 0-1000 for easier mapping

    // Mythic: guaranteed at 1000, start chance 150+
    if (score >= 150) {
      const mythicChance = Math.min((score - 150) / (1000 - 150), 1); // 0→1
      if (roll / 1000 < mythicChance) return NUM_SPRITES; // mythic bag
    }

    // Goated: start 90+, chance ramps up to ~rare max
    if (score >= 90) {
      const goatedChance = Math.min((score - 90) / (150 - 90), 1); // 0→1
      if (roll / 1000 < goatedChance) return 19 + Math.floor(Math.random() * (NUM_SPRITES - 19)); // goated range
    }

    // Rare: start 35+, chance ramps up
    if (score >= 35) {
      const rareChance = Math.min((score - 35) / (90 - 35), 1); // 0→1
      if (roll / 1000 < rareChance) return 13 + Math.floor(Math.random() * 6); // rare range
    }
  }

  // ===== NORMAL COMMON SPRITES =====
  const min = first ? 0 : 0;
  const max = first ? 4 : 12;

  const candidates = [];
  for (let i = min; i <= max; i++) {
    if (!used.has(i)) candidates.push(i);
  }

  if (candidates.length === 0) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // Simple weighting for newest bag
  const newestBag = max;
  const weighted = [];
  candidates.forEach(i => {
    const weight = (i === newestBag) ? 5 : 2;
    for (let w = 0; w < weight; w++) weighted.push(i);
  });

  return weighted[Math.floor(Math.random() * weighted.length)];
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(n, max));
}

  const clampedY = clamp(y, padding, cachedWinH - padding - estH);

  funTextPopup.style.left = clampedX + 'px';
  funTextPopup.style.top = clampedY + 'px';

        }

        showPopup('+1', ball.x, pointY, TIER_COLORS.common);
      }
      updateTopScores();
      addToCollection(h.spriteIndex);
      ball.spriteIndex = h.spriteIndex;
      hoops.splice(i, 1);
      continue;
    }

   // Missed hoop ends game (EXCEPT definitely-not-bag)
if (h.x + SPRITE_SIZE < ball.x - 20) {

    // If this hoop is definitely-not-bag, you can miss it safely.
  // Show popup ONCE, but do NOT remove the hoop (let it drift off-screen).
  if (h.spriteIndex >= NOTBAG_START && h.spriteIndex < NOTBAG_START + NOTBAG_COUNT) {
  if (h.x + SPRITE_SIZE < -10) {

  // Otherwise normal miss behaviour

    hoops.splice(i, 1);

  }

  return startDeathAnimation();
}

  }

if (hoops.length === 0 || hoops[hoops.length - 1].x < canvas.width - GAP) addHoop();

// ✅ bg active only during the 3-baghetti run (pickup+forced)
if (baghettiRunLeft > 0) showBaghettiBg();
else hideBaghettiBg();

if (!gameOver) rafId = requestAnimationFrame(loop);
// ✅ lightweight throttled score UI update
if (!loop._lastTopUpdate || performance.now() - loop._lastTopUpdate > 120) {
  updateTopScores();
  loop._lastTopUpdate = performance.now();
}
}

// ===================== DEATH ANIMATION =====================
function startDeathAnimation() {
  if (dying || gameOver) return;
  dying = true;

  // Stop the main game loop
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;

  // Death physics: small upward pop, random spin + horizontal drift
  deathVy = -4;
  deathVx = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.random() * 1.5);
  deathSpinRate = (Math.random() < 0.5 ? -1 : 1) * (0.08 + Math.random() * 0.08);
  deathRotation = 0;
  deathLastTs = null;

  requestAnimationFrame(deathLoop);
}

function deathLoop(ts) {
  if (!dying) return;

  if (deathLastTs == null) deathLastTs = ts;
  let dt = (ts - deathLastTs) / 16.6667;
  deathLastTs = ts;
  dt = Math.max(0.5, Math.min(dt, 2.5));

  // Death gravity (heavier than gameplay gravity for a snappy fall)
  deathVy += 0.5 * dt;
  ball.y += deathVy * dt;
  ball.x += deathVx * dt;
  deathRotation += deathSpinRate * dt;

  // Redraw scene
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTierBanner();

  // Draw frozen hoops (visual context, not moving)
  for (let i = 0; i < hoops.length; i++) {
    const h = hoops[i];
    const hoopImg = imgForIndex(h.spriteIndex);
    if (hoopImg) ctx.drawImage(hoopImg, h.x, h.y, SPRITE_SIZE, SPRITE_SIZE);
  }

  // Draw tumbling ball
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(deathRotation);
  ctx.scale(ball.scaleX, ball.scaleY);

  const ballImg = imgForIndex(ball.spriteIndex);
  const halfSprite = SPRITE_SIZE / 2;
  if (ballImg) ctx.drawImage(ballImg, -halfSprite, -halfSprite, SPRITE_SIZE, SPRITE_SIZE);

  ctx.restore();

  // Check if ball has fallen off screen
  if (ball.y > canvas.height + SPRITE_SIZE * 2) {
    finishDeath();
    return;
  }

  requestAnimationFrame(deathLoop);
}

function finishDeath() {
  dying = false;
  deathRotation = 0;
  deathVx = 0;
  deathVy = 0;
  deathLastTs = null;
  endGame();
}

function endGame() {
  if (gameOver) return;
  gameOver = true;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  lastTs = null;
  hideTopScores();
  document.getElementById('hudStack').style.opacity = 0;

  // Bring overlay in front of canvas so leftover sprites are hidden
  document.getElementById('homeOverlay').style.zIndex = 3;

  if (score > cachedHighscore) {
    cachedHighscore = score;
    localStorage.setItem('flappyBasketHighscore', score);
  }
  backButton.style.opacity = 1;
  leaderboardBtn.style.display = 'block';
  showNameModal(score, ball.spriteIndex);
}

let currentSoundtrackIndex = null;

function resolveInitialSoundtrackIndex() {
  const selected = getSelectedSoundtrackIndex();
  if (selected >= 0 && selected < SOUNDTRACKS.length) return selected;
  return getPageLoadRandomSoundtrackIndex(); // random ONCE per page load
}

function ensureSoundtrackLoadedOnce() {
  if (currentSoundtrackIndex !== null) return; // already chosen this page load
  currentSoundtrackIndex = resolveInitialSoundtrackIndex();
  const s = SOUNDTRACKS[currentSoundtrackIndex];
  if (!s) return;

  // only set src once so it never restarts between runs
  bgMusic.src = s.src;
  bgMusic.load();
  bgMusic.loop = true;
}

function setSoundtrackByIndex(idx, tryPlay = true) {
  const s = SOUNDTRACKS[idx];
  if (!s) return;

  // ✅ If already on this track, don't restart it
  if (currentSoundtrackIndex === idx) {
    if (tryPlay && bgMusic.paused) {
      bgMusic.play().then(() => musicToggle.textContent = "music: on").catch(() => {});
    }
    return;
  }

  currentSoundtrackIndex = idx;

  bgMusic.pause();
  bgMusic.src = s.src;
  bgMusic.load();
  bgMusic.loop = true;

  if (tryPlay) {
    bgMusic.play().then(() => {
      musicToggle.textContent = "music: on";
    }).catch(() => {});
  }
}

function pickRandomSoundtrackIndex() {
  return Math.floor(Math.random() * SOUNDTRACKS.length);
}
let pageLoadRandomSoundtrackIndex = null;

function getPageLoadRandomSoundtrackIndex() {
  if (pageLoadRandomSoundtrackIndex === null) {
    pageLoadRandomSoundtrackIndex = pickRandomSoundtrackIndex();
  }
  return pageLoadRandomSoundtrackIndex;
}

  if (wrap) {
    wrap.style.opacity = '1';
    wrap.querySelectorAll('.nokia-key').forEach(k => k.style.pointerEvents = 'auto');
  }
  updateNokiaMusicLabel();
}

function hideNokiaKeypad() {
  const wrap = document.getElementById('nokiaPhoneWrap');
  if (wrap) {
    wrap.style.opacity = '0';
    wrap.querySelectorAll('.nokia-key').forEach(k => k.style.pointerEvents = 'none');
  }
}

function updateNokiaMusicLabel() {
  if (!nokiaMusicLabel) return;
  if (bgMusic.readyState > 2 && !bgMusic.paused) {
    nokiaMusicLabel.textContent = 'music: on';
  } else {
    nokiaMusicLabel.textContent = 'music: off';
  }
}

// Stop non-start button taps from bubbling to canvas/playWrap (which would start the game)
nokiaKeypad.addEventListener('touchstart', (e) => {
  const key = e.target.closest('.nokia-key');
  if (!key) return;
  const action = key.dataset.action;
  // Let tap/to/start bubble — they start the game anyway
  if (action === 'tap' || action === 'to' || action === 'start') return;
  // All other buttons: stop the event so it doesn't reach canvas/playWrap
  e.stopPropagation();
}, { passive: false });

// Click handlers for each key
nokiaKeypad.addEventListener('click', (e) => {
  const key = e.target.closest('.nokia-key');
  if (!key) return;
  const action = key.dataset.action;
  // Stop non-start clicks from bubbling
  if (action !== 'tap' && action !== 'to' && action !== 'start') {
    e.stopPropagation();
  }

  switch (action) {
    case 'tap':    // 1 - "tap" (part of "tap to start!")
    case 'to':     // 2 - "to"
    case 'start':  // 3 - "start!"
      startGame();
      break;

    case 'music':  // 6
      if (bgMusic.paused) {
        ensureSoundtrackLoadedOnce();
        bgMusic.play().catch(() => {});
        musicToggle.textContent = 'music: on';
      } else {
        bgMusic.pause();
        musicToggle.textContent = 'music: off';
      }
      updateNokiaMusicLabel();
      break;

    case 'sfx':    // 5
      sfxEnabled = !sfxEnabled;
      sfxUserToggled = true;
      if (nokiaSfxLabel) nokiaSfxLabel.textContent = sfxEnabled ? 'sfx: on' : 'sfx: off';
      break;

    case 'howto':  // 4
      openHowTo();
      break;

    case 'goody':  // 7
      openGoodybag();
      break;

    case 'scores': // 9
      toggleLeaderboard();
      break;

    case 'back':   // 8
      goBack();
      break;

    // ---- SECRET / FUTURE KEYS ----
    // To activate: remove 'deco' class from the button in HTML,
    // then add your logic below.
    case 'star':   // * key
      break;
    case 'zero':   // 0 key
      break;
    case 'hash':   // # key
      break;
  }
});

</script>
