<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>put the bag in the bag</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="./images/icon.png">
<style>
@font-face {
  font-family: "RuneScape UF";
  src: url("../../fonts/RuneScape-UF.woff2") format("woff2"),
       url("../../fonts/RuneScape-UF.woff") format("woff");
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "RuneScape UF", Arial, sans-serif;
  cursor: url("../../images/cursor/cursor.png"), auto;
  background: #fff;
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

/* Custom hover cursor for all interactive elements */
button,
a,
input,
.leaderboard-btn,
.leaderboard-close {
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* ===================== TOP SCORE HUD ===================== */
#topScores{
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 4vw, 40px);

  height: 44px;
  padding: 0 16px;
  white-space: nowrap;

  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(18px, 2.2vw, 26px);
  line-height: 1;

  color: #2d93ea;

  background: rgba(255, 255, 255, 0.12);
  border: 1.5px solid rgba(45, 147, 234, 0.25);
  border-radius: 8px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
}

#topScores > div{
  flex: 0 0 auto;
}

/* ===================== SHIELD HUD ICON ===================== */
#shieldHud {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;

  display: flex;
  align-items: center;
  gap: 6px;

  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: clamp(14px, 1.8vw, 18px);
  color: #2d93ea;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#shieldHud.active {
  opacity: 1;
}

#shieldHud img {
  width: 24px;
  height: 24px;
  image-rendering: pixelated;
}

#rotateNotice {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    color: #2d93ea;
    font-family: 'RuneScape UF', Arial, sans-serif;
    font-size: 5vw;
    text-align: center;
    line-height: 100vh;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
}

#rotateNotice.active {
    opacity: 1;
    pointer-events: none;
}

/* ===================== SHARED GAME BUTTON ===================== */
.game-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  background: transparent;
  border: none;
  color: #2d93ea;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  text-transform: lowercase;
  padding: 4px 8px;
  touch-action: none;
  transition: opacity 0.5s ease, transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.game-btn:hover {
  transform: scale(1.08);
}

.game-btn:active {
  transform: scale(0.95);
}

/* Back Button */
.back-button {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 100;
  opacity: 1;
  padding: 0;
}

/* Music Button */
.music-button {
  position: fixed;
  bottom: 8px;
  left: 8px;
  z-index: 400;
  opacity: 0;
  padding: 0;
}

canvas {
  display: block;
  margin: 0 auto;
  background: transparent;
  position: relative;
  z-index: 1; /* above the background layer */
}


/* Point Popup */
.point-popup {
  position: absolute;
  font-size: 28px;
  color: #d1dce8;
  font-family: "RuneScape UF", Arial, sans-serif;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 6;
}

/* Name Input Modal */
.name-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  flex-direction: column;
  pointer-events: none;
}

.name-modal > * {
  pointer-events: auto;
}

.name-modal.show {
  display: flex;
}

.name-modal h2 {
  font-size: 36px;
  color: #2d93ea;
  margin-bottom: 8px;
}

.name-modal .final-score {
  font-size: 28px;
  color: #2d93ea;
  margin-bottom: 24px;
}

.name-modal input {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  padding: 12px 16px;
  border: 2px solid #2d93ea;
  background: white;
  outline: none;
  text-align: center;
  width: 200px;
  margin-bottom: 16px;
}

.name-modal button {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  padding: 12px 32px;
  border: 2px solid #2d93ea;
  background: #2d93ea;
  color: white;
  margin-top: 12px;
}

.name-modal button:hover {
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* Game Over sprite display */
.game-over-sprite {
  width: 64px;
  height: 64px;
  margin-bottom: 12px;
  image-rendering: pixelated;
}

/* Primary button (submit) */
.name-modal .btn-primary {
  background: #2d93ea;
  color: white;
  border: 2px solid #2d93ea;
}

.name-modal .btn-primary:hover {
  background: #1a7bd4;
  border-color: #1a7bd4;
}

/* Secondary button (play again) */
.name-modal .btn-secondary {
  background: transparent;
  color: #2d93ea;
  border: 2px solid #2d93ea;
}

.name-modal .btn-secondary:hover {
  background: rgba(45, 147, 234, 0.08);
}

/* Leaderboard */
#leaderboardBackdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.75);
  display: none;
  z-index: 9999;
  align-items: center;
  justify-content: center;
}

.leaderboard {
  background: white;
  border: 2px solid #2d93ea;
  padding: 24px;
  min-width: 280px;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
}

.leaderboard h3 {
  font-size: 28px;
  color: #2d93ea;
  margin: 0 0 16px 0;
  text-align: center;
}

.leaderboard-entry {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  color: #2d93ea;
  padding: 8px 0;
  border-bottom: 1px solid #e0e0e0;
}

.leaderboard-entry:last-child {
  border-bottom: none;
}

.leaderboard-entry .rank {
  width: 30px;
}

.leaderboard-entry .name {
  flex: 1;
  text-align: left;
  padding-left: 8px;
}

.leaderboard-entry .score {
  width: 60px;
  text-align: right;
}

/* ================= LEADERBOARD TOP 3 – CLEAN & READABLE ================= */

/* Shared base: strong weight + crisp outline */
.leaderboard-entry.rank-1,
.leaderboard-entry.rank-2,
.leaderboard-entry.rank-3 {
  font-weight: 800;
  letter-spacing: 0.2px;

  /* Pure outline — NO blur */
  text-shadow:
    1px 0 0 rgba(0,0,0,0.65),
   -1px 0 0 rgba(0,0,0,0.65),
    0 1px 0 rgba(0,0,0,0.65),
    0 -1px 0 rgba(0,0,0,0.65);

  /* Subtle row lift */
  border-radius: 6px;
  padding: 8px 10px;
}

/* 🥇 GOLD — punchy + heavy */
.leaderboard-entry.rank-1 {
  color: #ffd400; /* bright arcade gold */
  font-weight: 900;
  background: linear-gradient(
    90deg,
    rgba(255, 212, 0, 0.14),
    rgba(255, 212, 0, 0.04)
  );
}

/* 🥈 SILVER — clean, readable */
.leaderboard-entry.rank-2 {
  color: #e6edf5;
  background: linear-gradient(
    90deg,
    rgba(230, 237, 245, 0.12),
    rgba(230, 237, 245, 0.02)
  );
}

/* 🥉 BRONZE — brighter, not muddy */
.leaderboard-entry.rank-3 {
  color: #ff9a3c;
  background: linear-gradient(
    90deg,
    rgba(255, 154, 60, 0.14),
    rgba(255, 154, 60, 0.03)
  );
}

/* Extra emphasis on the SCORE for #1 only */
.leaderboard-entry.rank-1 .score {
  color: #fff2a8;
  font-weight: 900;
}



/* Highlight player's own entry */
.leaderboard-entry.is-player {
  background: rgba(45, 147, 234, 0.08);
  border-radius: 4px;
}

.leaderboard-btn {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 100;
  display: none;
}

.leaderboard-close {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 24px;
  background: transparent;
  border: none;
  color: #2d93ea;
  font-family: "RuneScape UF", Arial, sans-serif;
}

#overlayHighscore{
  position: fixed;
  top: 40px;           /* 8px button top + ~24px button height + gap */
  right: 8px;          /* align with leaderboard button */
  font-size: 24px;
  color: #2d93ea;
  font-family: "RuneScape UF", Arial, sans-serif;
  text-align: right;
  z-index: 1001;        /* above playWrap (50) */
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
  white-space: nowrap;
}

.soundcloud-btn {
  position: fixed;
  bottom: 8px;
  right: 15px;
  z-index: 400;
  display: none;
}

/* Goodybag Backdrop */
#goodybagBackdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.75);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 9998;
}

#goodybagBackdrop.active {
    display: flex;
    opacity: 1;
    pointer-events: auto;
}

#goodybagBackdrop button {
    font-family: "RuneScape UF", Arial, sans-serif;
    color: #2d93ea;
    background: transparent;
    border: none;
    font-size: 24px;
    cursor: url("../../images/cursor/cursor-hover.png"), pointer;
    margin: 10px;
}

#goodybagBackdrop .leaderboard button {
    margin: 8px 0;               /* vertical spacing between buttons */
    text-align: center;
}

#goodybagContent {
    text-align: center;          /* center text inside simple divs */
    display: flex;               /* make container flex */
    flex-direction: column;      /* stack child elements vertically */
    align-items: center;         /* center horizontally */
    justify-content: flex-start; /* top-aligned */
    gap: 12px;                   /* spacing between items */
}
#goodybagContent ul {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: center;          /* center track names */
}
#goodybagContent li {
    margin: 4px 0;
}

/* Soundtrack page wrapper */
.soundtrack-wrapper {
  width: min(520px, 86vw);
  box-sizing: border-box;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.soundtrack-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.soundtrack-header .soundtrack-title {
  font-weight: bold;
}

.soundtrack-header .soundtrack-link-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 20px;
  padding: 4px 8px;
  background: transparent;
  border: none;
  color: #2d93ea;
  text-transform: lowercase;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

.soundtrack-tracklist {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
  flex: 0 1 auto;
  overflow-y: auto;
  padding-right: 6px;
  max-height: 50vh;
  margin-bottom: 10px;
}

.soundtrack-tracklist li {
  margin: 4px 0;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.soundtrack-bottom {
  display: flex;
  align-items: center;
  margin-top: 8px;
  width: 100%;
}

.soundtrack-bottom .soundtrack-nav {
  display: flex;
  gap: 12px;
  flex: 0 0 auto;
  justify-content: flex-start;
}

.soundtrack-bottom .soundtrack-spacer {
  flex: 1 1 auto;
}

.soundtrack-nav-btn,
.soundtrack-select-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  background: transparent;
  border: none;
  color: #2d93ea;
  text-transform: lowercase;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* Password unlock items with sprites */
.password-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 6px 0;
  font-size: 20px;
  color: #2d93ea;
}

.password-item img {
  width: 32px;
  height: 32px;
  image-rendering: pixelated;
}

#goodybagButtons {
    display: flex;
    justify-content: space-between; /* one left, one right */
    width: 100%;                    /* fill the modal width */
    max-width: 360px;               /* optional, keeps it from being too wide */
    margin-top: 20px;
}

#goodybagButtons button {
    flex: 1;                        /* buttons take equal width */
    margin: 0 8px;                  /* small gap between buttons */
    text-align: center;
    font-size: 24px;
    background: transparent;
    border: 2px solid #2d93ea;
    color: #2d93ea;
    padding: 8px 0;
    text-transform: lowercase;
}

#goodybagButtons button:disabled {
    opacity: 0.5;
    cursor: default;
}

.goody-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
}

.goody-row button {
    font-family: "RuneScape UF", Arial, sans-serif;
    font-size: 28px;
    background: transparent;
    border: none;
    color: #2d93ea;
    text-transform: lowercase;
    cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}
#howToBackdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.75);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 9998;
}

#howToBackdrop.active {
  display: flex;
  opacity: 1;
  pointer-events: auto;
}

#howToButtons {
  display: flex;
  justify-content: center;
  width: 100%;
  margin-top: 20px;
}

#howToButtons button {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  background: transparent;
  border: 2px solid #2d93ea;
  color: #2d93ea;
  padding: 8px 22px;
  text-transform: lowercase;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

/* How To Play item rows */
.howto-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
  text-align: left;
  font-size: 18px;
  color: #2d93ea;
}

.howto-item img {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  image-rendering: pixelated;
}

.howto-section-title {
  font-size: 20px;
  color: #2d93ea;
  margin: 14px 0 6px;
  text-align: center;
  font-weight: bold;
}

.howto-intro {
  font-size: 18px;
  color: #2d93ea;
  text-align: center;
  margin-bottom: 10px;
  white-space: pre-line;
}

/* One stable overlay "unit" */
#playWrap{
  position: absolute;
  top: 44%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
  transition: opacity 0.5s, transform 0.5s;
  z-index: 50;
  pointer-events: none; /* enabled when shown via JS */

  /* keep paint cheap */
  will-change: transform, opacity;
}

/* play.png sizing */
#playWrap #playOverlay{
  display: block;
  max-width: 80vw;
  max-height: 80vh;
  width: auto;
  height: auto;
}

/* yellow splash locked to play.png */
#playSplashText{
  position: absolute;

  /* ✅ THIS is the “same place forever” part */
  left: 71.4%;
  top: 61.1%;

  transform: translate(-50%, -50%) rotate(-18deg);
  pointer-events: none;
  white-space: nowrap;
  line-height: 1;

  color: #ffd400;
  font-family: "RuneScape UF", Arial, sans-serif;

  /* ✅ bigger on mobile, smaller on desktop */
  font-size: clamp(18px, 5.2vw, 44px);

  /* ✅ cheap shadow (avoid blur) */
  text-shadow: 1px 1px 0 rgba(0,0,0,0.14);
}
@keyframes playPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -50%) scale(1.05); }
}

#playWrap.pulsing{
  animation: playPulse 1.2s ease-in-out infinite;
}

#funTextPopup{
  white-space: pre-line;  /* ✅ respects \n */
  line-height: 1.25;      /* optional but nice */
}
#pageBg{
  position: fixed;
  inset: 0;
  z-index: 0;            /* behind everything */
  pointer-events: none;

  background-image: url("background.png"); /* same folder as play.png */
  background-size: cover;       /* keeps aspect ratio, crops as needed */
  background-position: center;  /* nice crop */
  background-repeat: no-repeat;
}

#baghettiBg{
  position: fixed;
  inset: 0;
  z-index: 2;            /* behind popups/top UI, above the canvas bg */
  pointer-events: none;

  background-image: url("baghetti-bg.png"); /* <-- change path */
  background-size: cover;       /* desktop sized, mobile crops */
  background-position: center;  /* keep the interesting bit centered */
  background-repeat: no-repeat;

  opacity: 0;
  transition: opacity 1s ease-out; /* slow fade (both directions) */
}

</style>
</head>
<body>
<div id="pageBg"></div>
<div id="rotateNotice">Please rotate your phone to portrait</div>
<button class="back-button game-btn" onclick="goBack()">← back</button>
<button class="music-button game-btn" id="musicToggle" style="bottom:8px; left:8px;">music toggle</button>
<button id="goodybagBtn" class="soundcloud-btn game-btn">goodybag</button>
<button id="howToBtn" class="soundcloud-btn game-btn">how to play</button>
<audio id="bgMusic" src="/go/game/soundtrack01.mp3" loop></audio>

<div id="playWrap">
  <img id="playOverlay" src="play.png" alt="play">
  <div id="playSplashText"></div>
</div>

<div id="overlayHighscore"></div>
<div id="overlayLastScore" style="position: absolute; top: 90%; left: 50%; transform: translateX(-50%); font-size: 28px; color: #2d93ea; z-index: 51; font-family: 'RuneScape UF', Arial, sans-serif; text-align: center; opacity: 0; transition: opacity 0.5s;"></div>

<div id="topScores">
  <div id="topCurrentScore">current score: 0</div>
  <div id="topHighscore">highscore: 0</div>
</div>

<div id="shieldHud">
  <img src="sprites/powerups/shield.png" alt="shield">
  <span>shield active</span>
</div>

<button class="leaderboard-btn game-btn" onclick="toggleLeaderboard()">leaderboard</button>

<div class="name-modal" id="nameModal">
  <img id="gameOverSprite" class="game-over-sprite" src="" alt="" style="display:none;">
  <h2>game over!</h2>
  <div class="final-score" id="finalScore">score: 0</div>
  <div class="final-score" id="modalHighscore">highscore: 0</div>

  <input type="text" id="playerName" placeholder="enter name" maxlength="12" autocomplete="off">
  <button class="btn-primary" onclick="submitScore()">submit</button>
  <button class="btn-secondary" onclick="playAgain()">play again</button>
</div>


<div id="leaderboardBackdrop">
  <div class="leaderboard" id="leaderboard">
    <button class="leaderboard-close" onclick="toggleLeaderboard()">×</button>
    <h3>leaderboard</h3>
    <div id="leaderboardEntries">loading...</div>
  </div>
</div>

<div id="mythicUnlockPopup" style="
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  text-align: center;
  font-family: 'RuneScape UF', Arial, sans-serif;
  color: #2d93ea;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s ease;
  z-index: 5000;
">
  <div style="font-size: 32px;">*mythic found*</div>
  <div style="font-size: 28px; margin-top: 14px;">
    soundtrack unlocked!
  </div>
</div>

<div id="goodybagBackdrop">
  <div class="leaderboard">

    <button class="leaderboard-close" onclick="closeGoodybag()">×</button>

    <h3>goodies</h3>

    <div id="goodybagContent" style="font-size:18px; color:#2d93ea;">
      <!-- filled dynamically -->
    </div>

    <div id="goodybagButtons">
      <button id="soundtrackBtn" disabled>soundtracks</button>
      <button id="passwordBtn" disabled>passwords</button>
    </div>

  </div>
</div>
<div id="howToBackdrop">
  <div class="leaderboard">
    <button class="leaderboard-close" onclick="closeHowTo()">×</button>
    <h3>how to play</h3>
    <div id="howToContent" style="font-size:18px; color:#2d93ea; text-align:center;">
      <!-- filled dynamically after assets load -->
    </div>

    </div>
  </div>
</div>

<canvas id="gameCanvas"></canvas>
<div id="baghettiBg"></div>
<div class="point-popup" id="pointPopup">+1</div>
<div class="point-popup" id="funTextPopup"></div>

<script>
// ===================== GAME VARIABLES =====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const backButton = document.querySelector('.back-button');
const leaderboardBtn = document.querySelector('.leaderboard-btn');
const overlayHighscoreEl = document.getElementById('overlayHighscore');
const topScoresEl = document.getElementById('topScores');

let tierBanner = null; // { lines: string[], color: string, until: number }

function setTierBanner(text, color, durationMs = 4000) {
  const topScoresEl = document.getElementById('topScores');
  const rect = topScoresEl ? topScoresEl.getBoundingClientRect() : null;
  const baseY = rect ? (rect.bottom + 14) : 70;

  const lines = String(text).split('\n');

  // Pre-calculate font size once (instead of every frame)
  let fontSize = Math.max(16, Math.min(34, Math.round(canvas.width * 0.045)));
  const maxWidth = canvas.width - 24;
  for (let i = 0; i < 16; i++) {
    ctx.font = `${fontSize}px "RuneScape UF", Arial, sans-serif`;
    const widest = Math.max(...lines.map(line => ctx.measureText(line).width));
    if (widest <= maxWidth) break;
    fontSize = Math.max(14, fontSize - 1);
  }

  tierBanner = {
    lines,
    color,
    start: Date.now(),
    duration: durationMs,
    baseY,
    fontSize
  };
}


function drawTierBanner() {
  if (!tierBanner) return;

  const now = Date.now();
  const elapsed = now - tierBanner.start;
  if (elapsed > tierBanner.duration) {
    tierBanner = null;
    return;
  }

  const FADE_OUT_MS = 1000;
  let alpha = 1;
  if (elapsed > tierBanner.duration - FADE_OUT_MS) {
    alpha = 1 - (elapsed - (tierBanner.duration - FADE_OUT_MS)) / FADE_OUT_MS;
  }

  const baseY = tierBanner.baseY || 70;
  const x = canvas.width / 2;
  const fontSize = tierBanner.fontSize;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `${fontSize}px "RuneScape UF", Arial, sans-serif`;
  ctx.fillStyle = tierBanner.color;

  const lineH = Math.round(fontSize * 1.15);
  for (let i = 0; i < tierBanner.lines.length; i++) {
    ctx.fillText(tierBanner.lines[i], x, baseY + i * lineH);
  }

  ctx.restore();
}

function getWeightedSpriteIndex(first = false) {
  const used = new Set();
  used.add(ball.spriteIndex);

  // ===== PROGRESSIVE BAG LOGIC =====
  if (!first) {
    const roll = Math.random() * 1000; // scaled 0-1000 for easier mapping

    // Mythic: guaranteed at 1000, start chance 150+
    if (score >= 150) {
      const mythicChance = Math.min((score - 150) / (1000 - 150), 1); // 0→1
      if (roll / 1000 < mythicChance) return NUM_SPRITES; // mythic bag
    }

    // Goated: start 90+, chance ramps up to ~rare max
    if (score >= 90) {
      const goatedChance = Math.min((score - 90) / (150 - 90), 1); // 0→1
      if (roll / 1000 < goatedChance) return 19 + Math.floor(Math.random() * (NUM_SPRITES - 19)); // goated range
    }

    // Rare: start 35+, chance ramps up
    if (score >= 35) {
      const rareChance = Math.min((score - 35) / (90 - 35), 1); // 0→1
      if (roll / 1000 < rareChance) return 13 + Math.floor(Math.random() * 6); // rare range
    }
  }

  // ===== NORMAL COMMON SPRITES =====
  const min = first ? 0 : 0;
  const max = first ? 4 : 12;

  const candidates = [];
  for (let i = min; i <= max; i++) {
    if (!used.has(i)) candidates.push(i);
  }

  if (candidates.length === 0) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // Simple weighting for newest bag
  const newestBag = max;
  const weighted = [];
  candidates.forEach(i => {
    const weight = (i === newestBag) ? 5 : 2;
    for (let w = 0; w < weight; w++) weighted.push(i);
  });

  return weighted[Math.floor(Math.random() * weighted.length)];
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(n, max));
}

function showTextPopup(text, x, y, color = '#2d93ea', duration = 600, align = 'center') {
  const fontSize = 24;
  const padding = 12;

  funTextPopup.textContent = text;
  funTextPopup.style.cssText =
    'display:block;opacity:0;white-space:pre;font-size:' + fontSize + 'px;color:' + color +
    ';text-align:' + (align === 'right' ? 'right' : 'center') +
    ';transform:translate(' + (align === 'right' ? '-100%' : '-50%') + ',0) translateY(8px);';

  // Estimate width from text length (avoids layout thrashing from offsetWidth reads)
  const estCharW = fontSize * 0.55;
  const estW = text.length * estCharW;
  const estH = fontSize * 1.3;

  // Clamp position using cached dimensions
  let clampedX = x;
  if (align === 'right') {
    clampedX = clamp(x, padding + estW, cachedWinW - padding);
  } else {
    clampedX = clamp(x, padding + estW / 2, cachedWinW - padding - estW / 2);
  }
  const clampedY = clamp(y, padding, cachedWinH - padding - estH);

  funTextPopup.style.left = clampedX + 'px';
  funTextPopup.style.top = clampedY + 'px';

  requestAnimationFrame(() => {
    funTextPopup.style.opacity = 1;
  });

  setTimeout(() => {
    funTextPopup.style.opacity = 0;
    funTextPopup.style.transform =
      (align === 'right')
        ? "translate(-100%, 0) translateY(22px)"
        : "translate(-50%, 0) translateY(22px)";
  }, duration);
}

function drawGlowHalo(cx, cy, radius, color, pulse) {
  const r = radius + 4 + Math.sin(pulse) * 2;
  const alpha = 0.18 + Math.sin(pulse) * 0.06;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

const bgMusic = document.getElementById('bgMusic');
let currentSoundtrackIndex = null;

function resolveInitialSoundtrackIndex() {
  const selected = getSelectedSoundtrackIndex();
  if (selected >= 0 && selected < SOUNDTRACKS.length) return selected;
  return getPageLoadRandomSoundtrackIndex(); // random ONCE per page load
}

function ensureSoundtrackLoadedOnce() {
  if (currentSoundtrackIndex !== null) return; // already chosen this page load
  currentSoundtrackIndex = resolveInitialSoundtrackIndex();
  const s = SOUNDTRACKS[currentSoundtrackIndex];
  if (!s) return;

  // only set src once so it never restarts between runs
  bgMusic.src = s.src;
  bgMusic.load();
  bgMusic.loop = true;
}

function setSoundtrackByIndex(idx, tryPlay = true) {
  const s = SOUNDTRACKS[idx];
  if (!s) return;

  // ✅ If already on this track, don't restart it
  if (currentSoundtrackIndex === idx) {
    if (tryPlay && bgMusic.paused) {
      bgMusic.play().then(() => musicToggle.textContent = "music: on").catch(() => {});
    }
    return;
  }

  currentSoundtrackIndex = idx;

  bgMusic.pause();
  bgMusic.src = s.src;
  bgMusic.load();
  bgMusic.loop = true;

  if (tryPlay) {
    bgMusic.play().then(() => {
      musicToggle.textContent = "music: on";
    }).catch(() => {});
  }
}

function pickRandomSoundtrackIndex() {
  return Math.floor(Math.random() * SOUNDTRACKS.length);
}
let pageLoadRandomSoundtrackIndex = null;

function getPageLoadRandomSoundtrackIndex() {
  if (pageLoadRandomSoundtrackIndex === null) {
    pageLoadRandomSoundtrackIndex = pickRandomSoundtrackIndex();
  }
  return pageLoadRandomSoundtrackIndex;
}

  html += '<div class="howto-item">' +
    '<img src="sprites/mythic1.png" alt="mythic bag">' +
    '<span style="color:' + TIER_COLORS.mythic + '">mythic bag - +5 points</span>' +
    '</div>';

  html += '<div class="howto-section-title">hazards</div>';

  html += '<div class="howto-item">' +
    '<img src="sprites/notbag/00.png" alt="not bag">' +
    '<span style="color:#ec564f">definitely not bag - avoid!</span>' +
    '</div>';

  html += '<div class="howto-section-title">powerups</div>';

  html += '<div class="howto-item">' +
    '<img src="sprites/powerups/shield.png" alt="shield">' +
    '<span>look out for ibuprofen</span>' +
    '</div>';

  html += '<div class="howto-item">' +
    '<img src="sprites/unlock/deathstar.png" alt="secret bag">' +
    '<span style="color:gold">secret bags - find them all...</span>' +
    '</div>';

  html += '<div class="howto-intro" style="margin-top:10px;">collect immense & powerful bags.\nsonically benefit yourself.\nprosper greatly.</div>';

  container.innerHTML = html;
}

howToBtn.addEventListener('click', openHowTo);


function refreshGoodybagButtons() {
const hasSoundtracks = getUnlockedSoundtrackLevel() > 0;
const hasAnyPassword =
  localStorage.getItem(UNLOCK_KEYS.password_tinny) === 'true' ||
  localStorage.getItem(UNLOCK_KEYS.password_onway) === 'true' ||
  localStorage.getItem(UNLOCK_KEYS.password_deathstar) === 'true';

  soundtrackBtn.disabled = !hasSoundtracks;
  passwordBtn.disabled = !hasAnyPassword;
}

function openGoodybag() {
  goodybagBackdrop.classList.add('active');
  refreshGoodybagButtons();

  // If nothing unlocked yet
  if (soundtrackBtn.disabled && passwordBtn.disabled) {
    goodybagContent.innerHTML = `
      <div style="opacity:0.6; font-size:20px;">
        no goodies found yet...
      </div>
    `;
  } else {
    goodybagContent.innerHTML = '';
  }
}

function closeGoodybag() {
  goodybagBackdrop.classList.remove('active');
}

goodybagBtn.addEventListener('click', openGoodybag);

let soundtrackPageIndex = 0;

function renderSoundtrackPage() {
  const unlocked = getUnlockedSoundtrackLevel();

  if (unlocked <= 0) {
    goodybagContent.innerHTML = '<div>no soundtracks unlocked yet...</div>';
    return;
  }

  soundtrackPageIndex = Math.max(0, Math.min(soundtrackPageIndex, unlocked - 1));
  const s = SOUNDTRACKS[soundtrackPageIndex];

  goodybagContent.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.className = 'soundtrack-wrapper';

  // header row
  const headerRow = document.createElement('div');
  headerRow.className = 'soundtrack-header';

  const header = document.createElement('div');
  header.className = 'soundtrack-title';
  header.textContent = s.title;

  const linkBtn = document.createElement('button');
  linkBtn.textContent = 'link';
  linkBtn.className = 'soundtrack-link-btn';
  linkBtn.onclick = () => window.open(s.link, '_blank');

  headerRow.appendChild(header);
  headerRow.appendChild(linkBtn);

  // track list
  const ul = document.createElement('ul');
  ul.className = 'soundtrack-tracklist';
  s.tracks.forEach(track => {
    const li = document.createElement('li');
    li.textContent = track;
    ul.appendChild(li);
  });

  // bottom row
  const bottomRow = document.createElement('div');
  bottomRow.className = 'soundtrack-bottom';

  const leftControls = document.createElement('div');
  leftControls.className = 'soundtrack-nav';

  const spacer = document.createElement('div');
  spacer.className = 'soundtrack-spacer';

  const backBtn = document.createElement('button');
  backBtn.textContent = 'back';
  backBtn.className = 'soundtrack-nav-btn';
  backBtn.style.display = (soundtrackPageIndex === 0) ? 'none' : 'inline-block';
  backBtn.onclick = () => { soundtrackPageIndex--; renderSoundtrackPage(); };

  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'next';
  nextBtn.className = 'soundtrack-nav-btn';
  nextBtn.style.display = (soundtrackPageIndex >= unlocked - 1) ? 'none' : 'inline-block';
  nextBtn.onclick = () => { soundtrackPageIndex++; renderSoundtrackPage(); };

  leftControls.appendChild(backBtn);
  leftControls.appendChild(nextBtn);

  const selectBtn = document.createElement('button');
  selectBtn.textContent = 'select';
  selectBtn.className = 'soundtrack-select-btn';
  selectBtn.onclick = () => {
    setSelectedSoundtrackIndex(soundtrackPageIndex);
    setSoundtrackByIndex(soundtrackPageIndex, true);
  };

  bottomRow.appendChild(leftControls);
  bottomRow.appendChild(spacer);
  bottomRow.appendChild(selectBtn);

  wrapper.appendChild(headerRow);
  wrapper.appendChild(ul);
  wrapper.appendChild(bottomRow);

  goodybagContent.appendChild(wrapper);
}

soundtrackBtn.addEventListener('click', () => {
  soundtrackPageIndex = 0; // always start at soundtrack01
  renderSoundtrackPage();
});


// ----- PASSWORD BUTTON -----
const PASSWORD_SPRITES = {
  tinny: 'sprites/unlock/tinny.png',
  onway: 'sprites/unlock/onway.png',
  deathstar: 'sprites/unlock/deathstar.png'
};

passwordBtn.addEventListener('click', () => {
  const unlocked = [];
  if (localStorage.getItem(UNLOCK_KEYS.password_tinny) === 'true') unlocked.push('tinny');
  if (localStorage.getItem(UNLOCK_KEYS.password_onway) === 'true') unlocked.push('onway');
  if (localStorage.getItem(UNLOCK_KEYS.password_deathstar) === 'true') unlocked.push('deathstar');

  if (!unlocked.length) {
    goodybagContent.innerHTML = '<div>no passwords unlocked yet...</div>';
    return;
  }

  goodybagContent.innerHTML =
    '<div>unlocked passwords:</div>' +
    unlocked.map(p =>
      '<div class="password-item">' +
        '<img src="' + PASSWORD_SPRITES[p] + '" alt="' + p + '">' +
        '<strong>' + p + '</strong>' +
      '</div>'
    ).join('');
});

</script>
