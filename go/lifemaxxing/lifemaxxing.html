<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lifemaxxing — inigo365</title>

<!-- iOS: stop zoom/double-tap zoom -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" href="../images/icon.png">
<link rel="preload" href="../../fonts/RuneScape-UF.woff2" as="font" type="font/woff2" crossorigin>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="lifemaxxing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* ===== FONT (reused exactly from index.html) ===== */
@font-face {
  font-family: "RuneScape UF";
  src: url("../../fonts/RuneScape-UF.woff2") format("woff2"),
       url("../../fonts/RuneScape-UF.woff") format("woff");
  font-display: swap;
}

:root{
  --accent: #2d93ea;  /* blue — matches site nav/play/back */
  --btn: #000000;     /* black — matches site UI buttons */

  /* ---------------------------------------------------------------
     HORIZON TUNING — the player bar's VERTICAL CENTRE sits at this %
     down the viewport. Nudge these two numbers to line the bar up
     with the sky/land seam in each cover crop. Nothing else to hunt.
     --------------------------------------------------------------- */
  --bar-top-desktop: 50%;
  --bar-top-mobile:  54%;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;              /* single fixed viewport, nothing scrolls */
  overscroll-behavior: none;

  font-family: "RuneScape UF", Arial, sans-serif;
  text-transform: lowercase;
  color: var(--btn);

  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

/* cursors — reused exactly from index.html */
html, body { cursor: url("../../images/cursor/cursor.png"), auto; }
button, input, a { cursor: url("../../images/cursor/cursor-hover.png"), pointer; }

/* ===== FULL-BLEED COVER BACKGROUND ===== */
html, body {
  background-image: url("cover-desktop.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
@media (max-width: 600px){
  html, body {
    background-image: url("cover-mobile.png");
    background-attachment: scroll;
  }
}

body{ animation: pgFadeIn 0.5s ease forwards; }
@keyframes pgFadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== PLAYER WRAP — anchored so the bar's CENTRE lands on the horizon ===== */
.player-wrap{
  position: fixed;
  left: 50%;
  top: var(--bar-top-desktop);
  transform: translate(-50%, -50%);   /* top = the bar's vertical centre line */
  z-index: 100;
}

/* =====================================================================
   PIXEL BOX — stepped/notched 8-bit corners, no radius anywhere.
   Two pseudo layers (both self-clipped to a staircase polygon):
     ::before = 2px-larger border plate   ::after = glass/blur fill
   `isolation:isolate` keeps the negative z-index layers behind the
   element's own content but contained (no leaking between slots).
   ===================================================================== */
.pixel-box{
  position: relative;
  isolation: isolate;
  border-radius: 0;
  --step: 5px;   /* size of each corner step */
}
.pixel-box::before,
.pixel-box::after{
  content: "";
  position: absolute;
  pointer-events: none;
  clip-path: polygon(
    10px 0, calc(100% - 10px) 0,
    calc(100% - 10px) 5px, calc(100% - 5px) 5px, calc(100% - 5px) 10px, 100% 10px,
    100% calc(100% - 10px), calc(100% - 5px) calc(100% - 10px),
    calc(100% - 5px) calc(100% - 5px), calc(100% - 10px) calc(100% - 5px), calc(100% - 10px) 100%,
    10px 100%, 10px calc(100% - 5px), 5px calc(100% - 5px), 5px calc(100% - 10px), 0 calc(100% - 10px),
    0 10px, 5px 10px, 5px 5px, 10px 5px
  );
}
/* border plate — 2px larger on every side, so a stepped outline peeks out */
.pixel-box::before{
  inset: -2px;
  background: rgba(0, 0, 0, 0.42);
  z-index: -2;
}
/* glass fill */
.pixel-box::after{
  inset: 0;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
  z-index: -1;
}

/* ===== MAIN PLAYER PANEL ===== */
.player-panel{
  display: flex;
  align-items: center;
  gap: 18px;
  white-space: nowrap;
  padding: 14px 22px;
  letter-spacing: 0.04em;
}

/* text/icon-style controls (behaviour from kintsugiOLD .pctl) */
.pctl{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: none;
  border: none;
  padding: 0;
  flex-shrink: 0;
  transition: opacity 0.15s ease;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}
.pctl:hover{ opacity: 0.55; }
#linksToggle.open{ opacity: 1; }
#linksToggle.open .ctl-icon{ filter: drop-shadow(0 0 3px rgba(45,147,234,0.9)); }

/* =====================================================================
   CONTROL ICONS — raster pixel-art PNGs (32×32 source). Kept crisp with
   pixelated rendering, same treatment as .portal-sprite in index.html.
   24px reads consistently against the 40px spinner / scrubber row and
   needs no per-breakpoint size (the 36px .pctl button is fixed too).
   ===================================================================== */
.ctl-icon{
  width: 24px;
  height: 24px;
  display: block;
  object-fit: contain;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* scrubber + time group */
.scrub-row{
  display: flex;
  align-items: center;
  gap: 12px;
}

/* scrubber — styled exactly like kintsugiOLD #pScrub, accent colour */
#scrub{
  width: 200px;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: rgba(45, 147, 234, 0.28);
  border-radius: 2px;
  outline: none;
  margin: 0;
  padding: 0;
  display: block;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}
#scrub::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}
#scrub::-moz-range-thumb{
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
}

.player-time{
  font-size: 16px;
  min-width: 92px;
  text-align: center;
  color: var(--btn);
  opacity: 0.75;
  white-space: nowrap;
}

/* now-playing spinner (chess-spin.gif) — filter from index.html .portal-sprite-gif-chess */
.spinner{
  width: 40px; height: 40px;
  flex-shrink: 0;
  object-fit: contain;
  image-rendering: pixelated;
  filter: brightness(1.3) saturate(1.8);
  opacity: 0.22;                 /* dim/static-looking until playing */
  transform: scale(1.4);
  transition: opacity 0.3s ease;
}
.spinner.playing{ opacity: 1; }

/* ===== LINK PANEL — 2×2 grid, opens below the bar (bar stays put) ===== */
.link-panel{
  position: absolute;
  top: calc(100% + 14px);
  left: 50%;
  transform: translateX(-50%) translateY(-8px);

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.link-panel.open{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

/* RuneScape inventory-slot look — hard edges, stepped corners, inset bevel */
.link-slot{
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 104px;
  height: 52px;
  padding: 0 12px;

  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 18px;
  text-transform: lowercase;
  text-decoration: none;
  text-align: center;
  color: var(--btn);

  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
/* darker glass + inset bevel for the slots (over the shared pixel-box fill) */
.link-slot::after{
  background: rgba(255, 255, 255, 0.42);
  box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.18),
              inset -2px -2px 4px rgba(255, 255, 255, 0.55);
}
.link-slot:hover{ opacity: 0.72; }
.link-slot:active{ transform: translateY(1px); }

/* =====================================================================
   MOBILE — 2-row stack (pattern from kintsugiOLD mobile #player).
   Row 1: play — spinner — links.   Row 2: scrubber (full width) + time.
   Bar width is calc(100% - 32px) so it can never overflow.
   ===================================================================== */
@media (max-width: 600px){
  .player-wrap{
    top: var(--bar-top-mobile);
    width: calc(100% - 32px);
  }

  .player-panel{
    flex-wrap: wrap;
    justify-content: center;
    white-space: normal;
    width: 100%;
    padding: 12px 16px;
    gap: 12px 18px;
  }

  #playPause   { order: 1; }
  .spinner     { order: 2; }
  #linksToggle { order: 3; }
  .scrub-row   { order: 4; flex-basis: 100%; width: 100%; }

  .scrub-row #scrub{ flex: 1; width: auto; }
  .player-time{ min-width: 0; }

  .link-panel{ width: 100%; }
  .link-slot{ min-width: 0; font-size: 16px; }
}
</style>
</head>

<body>

<div class="player-wrap">

  <!-- MAIN PLAYER ROW -->
  <div class="player-panel pixel-box">
    <button class="pctl" id="playPause" type="button" aria-label="play">
      <img class="ctl-icon" id="playIcon" src="play.png" alt="play">
    </button>

    <div class="scrub-row">
      <input type="range" id="scrub" min="0" max="1" value="0" step="0.001" aria-label="seek">
      <span class="player-time" id="playerTime">0:00 / 0:00</span>
    </div>

    <img class="spinner" id="spinner" src="../images/chess-spin.gif" alt="">

    <button class="pctl" id="linksToggle" type="button" aria-label="links" aria-expanded="false">
      <img class="ctl-icon" src="link.png" alt="links">
    </button>
  </div>

  <!-- LINK PANEL (2×2) -->
  <div class="link-panel" id="linkPanel" aria-hidden="true">
    <a class="link-slot pixel-box" href="#">spotify</a>
    <a class="link-slot pixel-box" href="#">apple music</a>
    <a class="link-slot pixel-box" href="#">bandcamp</a>
    <a class="link-slot pixel-box" href="../index.html">inigo365.com</a>
  </div>

</div>

<audio id="audio" src="lifemaxxing.mp3" preload="metadata"></audio>

<script>
// =====================================================================
//  AUDIO PLAYER — pattern adapted from kintsugiOLD.html playTrack()
//  Single track: lifemaxxing by inigo365. Media Session for lock-screen.
// =====================================================================
const audioEl    = document.getElementById("audio");
const playPause  = document.getElementById("playPause");
const playIcon   = document.getElementById("playIcon");
const scrub      = document.getElementById("scrub");
const playerTime = document.getElementById("playerTime");
const spinner    = document.getElementById("spinner");
const linksToggle= document.getElementById("linksToggle");
const linkPanel  = document.getElementById("linkPanel");

const TRACK_TITLE  = "lifemaxxing";
const TRACK_ARTIST = "inigo365";

let isPlaying   = false;
let _scrubbing  = false;
let _mediaBound = false;

function formatTime(s){
  if (!isFinite(s) || isNaN(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ":" + (sec < 10 ? "0" : "") + sec;
}

function updateTimeDisplay(){
  playerTime.textContent =
    formatTime(audioEl.currentTime) + " / " + formatTime(audioEl.duration);

  if (!_scrubbing && isFinite(audioEl.duration) && audioEl.duration > 0){
    scrub.value = audioEl.currentTime / audioEl.duration;
  }

  if ("mediaSession" in navigator && isFinite(audioEl.duration) && audioEl.duration > 0){
    try {
      navigator.mediaSession.setPositionState({
        duration: audioEl.duration,
        playbackRate: audioEl.playbackRate || 1,
        position: audioEl.currentTime
      });
    } catch (e) {}
  }
}

function syncUI(){
  // swap the control image: play.png <-> pause.png
  playIcon.src = isPlaying ? "pause.png" : "play.png";
  playPause.setAttribute("aria-label", isPlaying ? "pause" : "play");
  spinner.classList.toggle("playing", isPlaying);
  if ("mediaSession" in navigator){
    navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
  }
}

// Bind Media Session metadata + handlers once (mirrors kintsugiOLD playTrack)
function bindMediaSession(){
  if (_mediaBound || !("mediaSession" in navigator)) return;
  _mediaBound = true;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: TRACK_TITLE,
    artist: TRACK_ARTIST,
    album: TRACK_TITLE,
    // cover art shown on the lock screen / notification media player.
    // lifemaxxing.png is 600x600; sizes listed so each OS picks a match.
    artwork: [
      { src: "lifemaxxing.png", sizes: "96x96",   type: "image/png" },
      { src: "lifemaxxing.png", sizes: "192x192", type: "image/png" },
      { src: "lifemaxxing.png", sizes: "256x256", type: "image/png" },
      { src: "lifemaxxing.png", sizes: "384x384", type: "image/png" },
      { src: "lifemaxxing.png", sizes: "512x512", type: "image/png" },
      { src: "lifemaxxing.png", sizes: "600x600", type: "image/png" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audioEl.play().catch(() => {});
  });
  navigator.mediaSession.setActionHandler("pause", () => {
    audioEl.pause();
  });
  try {
    navigator.mediaSession.setActionHandler("seekto", (details) => {
      if (details.seekTime != null && isFinite(audioEl.duration)){
        audioEl.currentTime = Math.min(details.seekTime, audioEl.duration - 0.1);
        updateTimeDisplay();
      }
    });
    navigator.mediaSession.setActionHandler("seekbackward", (details) => {
      audioEl.currentTime = Math.max(0, audioEl.currentTime - (details.seekOffset || 10));
    });
    navigator.mediaSession.setActionHandler("seekforward", (details) => {
      audioEl.currentTime = Math.min(audioEl.duration - 0.1,
                                     audioEl.currentTime + (details.seekOffset || 10));
    });
  } catch (e) {}
}

// ===== play / pause =====
playPause.addEventListener("click", () => {
  bindMediaSession();
  if (isPlaying) audioEl.pause();
  else audioEl.play().catch(() => {});
});

audioEl.addEventListener("play",  () => { isPlaying = true;  syncUI(); });
audioEl.addEventListener("pause", () => { isPlaying = false; syncUI(); });
audioEl.addEventListener("ended", () => {
  isPlaying = false;
  scrub.value = 0;
  syncUI();
  updateTimeDisplay();
});

audioEl.addEventListener("loadedmetadata", updateTimeDisplay);
audioEl.addEventListener("timeupdate", updateTimeDisplay);

// ===== scrubber (exact behaviour from kintsugiOLD #pScrub) =====
scrub.addEventListener("mousedown",  () => { _scrubbing = true; });
scrub.addEventListener("touchstart", () => { _scrubbing = true; }, { passive: true });
scrub.addEventListener("input", () => {
  if (isFinite(audioEl.duration)){
    audioEl.currentTime = scrub.value * audioEl.duration;
    updateTimeDisplay();
  }
});
scrub.addEventListener("mouseup",  () => { _scrubbing = false; });
scrub.addEventListener("touchend", () => { _scrubbing = false; }, { passive: true });
scrub.addEventListener("change",   () => { _scrubbing = false; });

// ===== link panel toggle =====
function setLinks(open){
  linkPanel.classList.toggle("open", open);
  linksToggle.classList.toggle("open", open);
  linkPanel.setAttribute("aria-hidden", open ? "false" : "true");
  linksToggle.setAttribute("aria-expanded", open ? "true" : "false");
}

linksToggle.addEventListener("click", (e) => {
  e.stopPropagation();
  setLinks(!linkPanel.classList.contains("open"));
});

// close on click-elsewhere
document.addEventListener("click", (e) => {
  if (!linkPanel.classList.contains("open")) return;
  if (linkPanel.contains(e.target) || linksToggle.contains(e.target)) return;
  setLinks(false);
});
</script>
</body>
</html>
