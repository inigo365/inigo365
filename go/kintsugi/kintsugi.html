<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kintsugi — inigo365</title>
<style>
@font-face {
  font-family: 'RuneScape';
  src: url('../../fonts/RuneScape-UF.woff2') format('woff2'),
       url('../../fonts/RuneScape-UF.woff') format('woff');
  font-weight: 100 900;
  font-style: normal;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { cursor: url('../../images/cursor/cursor.png'), auto; }

html { background: #0a0905; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'RuneScape', monospace;
  font-weight: bold;
  text-transform: lowercase;
  -webkit-user-select: none;
  user-select: none;
}

body { background: transparent; }

/* ── Background image (separate element so filter applies only to it) ── */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background: url('images/background.png') center/cover no-repeat;
  filter: saturate(1.35);
}

/* ── Background darkening overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 1;
  background: rgba(6, 5, 3, 0.58);
  pointer-events: none;
}

/* ── Grain overlay ── */
.grain {
  position: fixed; inset: 0; z-index: 2;
  pointer-events: none;
  opacity: 0.35;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
  background-size: 256px 256px;
}

/* ── Nav ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center;
  padding: 28px 40px;
  pointer-events: none;
}
.nav-brand, .nav-back {
  font-size: 22px; letter-spacing: 0.14em;
  font-weight: bold;
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  pointer-events: all;
  transition: color 0.3s;
  white-space: nowrap;
  cursor: url('../../images/cursor/cursor-hover.png') 16 16, pointer;
}
.nav-brand:hover, .nav-back:hover { color: rgba(255,255,255,0.9); }

/* ── Panels ── */
#panels {
  position: fixed; inset: 0; z-index: 3;
  display: flex;
}

.panel {
  flex: 1;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  cursor: url('../../images/cursor/cursor-hover.png') 16 16, pointer;
  transition: background 0.7s ease;
}
.panel:hover { background: rgba(255,255,255,0.012); }

/* GIF */
.model-gif {
  width: min(40vw, 408px);
  height: min(40vw, 408px);
  object-fit: contain;
  display: block;
  opacity: 0.82;
  filter: brightness(0.88) saturate(0.8);
  transition: opacity 0.55s ease, filter 0.55s ease, transform 0.55s ease;
  will-change: opacity, filter, transform;
}

.panel.active .model-gif {
  opacity: 1;
  filter: brightness(1.04) saturate(1.0);
  transform: scale(1.04);
}
.panel.dimmed .model-gif {
  opacity: 0.14;
  filter: brightness(0.35) saturate(0.2);
}

/* ── Specimen labels ── */
.label {
  position: absolute;
  font-size: 19px; letter-spacing: 0.26em;
  font-weight: bold;
  color: rgba(255,255,255,0.45);
  transition: color 0.4s ease;
  pointer-events: none;
}
#panel-brain .label  { bottom: 40px; left: 44px; }
#panel-friend .label { bottom: 40px; right: 44px; }
.panel.active .label { color: rgba(255,255,255,0.85); }

/* ── Centre countdown ── */
.centre {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10; pointer-events: none;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.countdown {
  display: flex; gap: 20px; align-items: flex-start;
}
.cd-unit { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.cd-num {
  font-size: clamp(38px, 4.56vw, 67px);
  letter-spacing: 0.08em;
  font-weight: bold;
  color: rgba(255,255,255,0.85);
  line-height: 1;
  min-width: 2ch; text-align: center;
  font-variant-numeric: tabular-nums;
}
.cd-lbl { font-size: 16px; letter-spacing: 0.28em; font-weight: bold; color: rgba(255,255,255,0.4); }
.cd-sep { font-size: clamp(31px, 3.6vw, 50px); color: rgba(255,255,255,0.25); line-height: 1; margin-top: 2px; }
.cd-date { font-size: 18px; letter-spacing: 0.32em; font-weight: bold; color: rgba(255,255,255,0.35); margin-top: 2px; }
.cd-title { font-size: clamp(19px, 2.28vw, 29px); letter-spacing: 0.3em; font-weight: bold; color: rgba(255,255,255,0.7); margin-bottom: 4px; }

/* ── Page reveal ── */
body { opacity: 0; transition: opacity 1s ease; }

/* ── Mobile ── */
@media (max-width: 600px) {
  nav { padding: 18px 20px; }
  .nav-back { display: none; }
  #panels { flex-direction: column; }
  .model-gif { width: min(80vw, 280px); height: min(80vw, 280px); }
  #panel-brain .label  { bottom: auto; left: auto; top: 20px; right: 24px; }
  #panel-friend .label { bottom: 20px; right: 24px; }
}

.nav-back-mobile {
  display: none;
}
@media (max-width: 600px) {
  .nav-back-mobile {
    display: block;
    position: fixed; bottom: 18px; left: 20px; z-index: 20;
    font-family: 'RuneScape', monospace;
    font-size: 22px; letter-spacing: 0.14em;
    font-weight: bold;
    text-transform: lowercase;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    pointer-events: all;
    transition: color 0.3s;
    cursor: url('../../images/cursor/cursor-hover.png') 16 16, pointer;
  }
  .nav-back-mobile:hover { color: rgba(255,255,255,0.9); }
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="grain"></div>

<nav>
  <a href="../../index.html" class="nav-brand">inigo365</a>
  <a href="../../index.html" class="nav-back">← back</a>
</nav>
<a href="../../index.html" class="nav-back-mobile">← back</a>

<div class="centre">
  <!--
  <div class="countdown">
    <div class="cd-unit"><span class="cd-num" id="cd-h">0000</span><span class="cd-lbl">hours</span></div>
    <span class="cd-sep">·</span>
    <div class="cd-unit"><span class="cd-num" id="cd-m">00</span><span class="cd-lbl">mins</span></div>
    <span class="cd-sep">·</span>
    <div class="cd-unit"><span class="cd-num" id="cd-s">00</span><span class="cd-lbl">secs</span></div>
  </div>
  -->
  <div class="cd-title">? ? ? ? ?</div>
</div>

<div id="panels">
  <div class="panel" id="panel-brain">
    <img src="brain-spin.gif" class="model-gif" alt="">
  </div>
  <div class="panel" id="panel-friend">
    <img src="friend-spin.gif" class="model-gif" alt="">
  </div>
</div>

<script>
(function () {
  var TARGET = new Date('2026-07-12T00:00:00');
  function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }
  function tick() {
    var diff = TARGET - Date.now();
    if (diff <= 0) {
      document.getElementById('cd-h').textContent =
      document.getElementById('cd-m').textContent =
      document.getElementById('cd-s').textContent = '00';
      return;
    }
    var s = diff / 1000, m = s / 60, h = m / 60;
    document.getElementById('cd-h').textContent = String(Math.floor(h)).padStart(4, '0');
    document.getElementById('cd-m').textContent = pad(m % 60);
    document.getElementById('cd-s').textContent = pad(s % 60);
  }
  if (document.getElementById('cd-h')) { tick(); setInterval(tick, 1000); }

  var panels = document.querySelectorAll('.panel');
  panels.forEach(function (active) {
    active.addEventListener('mouseenter', function () {
      panels.forEach(function (p) {
        if (p === active) { p.classList.add('active'); p.classList.remove('dimmed'); }
        else              { p.classList.add('dimmed'); p.classList.remove('active'); }
      });
    });
    active.addEventListener('mouseleave', function () {
      panels.forEach(function (p) { p.classList.remove('active', 'dimmed'); });
    });
  });

  requestAnimationFrame(function () { document.body.style.opacity = '1'; });
}());
</script>
</body>
</html>
