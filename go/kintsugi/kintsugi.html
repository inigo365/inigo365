* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; overflow-x:hidden; }
body { background:#f5f2ec; font-family:'RuneScape',monospace; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; justify-content:space-between; align-items:center;
  padding:24px 40px; pointer-events:none;
}
.nav-brand { font-size:12px; letter-spacing:0.12em; color:#aaa; pointer-events:all; }
.nav-links { display:flex; gap:24px; list-style:none; pointer-events:all; }
.nav-links a { font-size:12px; color:#bbb; text-decoration:none; transition:color 0.3s; }
.nav-links a:hover { color:#333; }

#brain-panel {
  position:relative; width:100vw; height:100vh;
  background:#f5f2ec; overflow:hidden;
}
#brain-canvas { position:absolute; inset:0; width:100% !important; height:100% !important; }

.brain-caption {
  position:absolute; bottom:44px; left:44px;
  z-index:10; pointer-events:none;
}
.caption-num { font-size:11px; color:#bbb; letter-spacing:0.15em; margin-bottom:6px; }
.caption-title { font-size:clamp(28px,3.5vw,52px); color:#222; line-height:1.2; letter-spacing:0.02em; }

.scroll-hint {
  position:absolute; bottom:44px; right:44px; z-index:10;
  font-size:11px; letter-spacing:0.15em; color:#ccc; pointer-events:none;
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

#friend-panel {
  position:relative; width:100vw; height:100vh;
  background:#f5f2ec; overflow:hidden;
  display:grid; grid-template-columns:58% 42%;
}
#friend-stage { position:relative; width:100%; height:100%; cursor:grab; }
#friend-stage:active { cursor:grabbing; }
#friend-canvas { width:100% !important; height:100% !important; }

.friend-text {
  display:flex; flex-direction:column; justify-content:center;
  padding:0 56px 0 0; z-index:10;
}
.friend-num { font-size:11px; color:#bbb; letter-spacing:0.15em; margin-bottom:18px; }
.friend-title { font-size:clamp(28px,3.5vw,52px); color:#222; line-height:1.2; letter-spacing:0.02em; }

.loading-msg {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:11px; letter-spacing:0.2em; color:#ccc;
  z-index:5; pointer-events:none; transition:opacity 1s;
}

@media (max-width:768px) {
  nav { padding:18px 20px; }
  .nav-links { display:none; }
  .brain-caption { left:20px; bottom:28px; }
  .scroll-hint { right:20px; bottom:28px; }
  #friend-panel {
    grid-template-columns:1fr;
    grid-template-rows:58vh 42vh;
    height:100vh;
  }
  #friend-stage { height:58vh; width:100vw; }
  .friend-text { padding:20px 24px 32px; justify-content:flex-start; }
  .friend-title { font-size:26px; }
  .caption-title { font-size:26px; }
  .friend-num { margin-bottom:10px; }
}
</style>
</head>

<script>
// (1) Simple UA-only iOS detection as specified
const IS_IOS    = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const IS_MOBILE = IS_IOS || window.innerWidth <= 768;
const FRAME_MS  = IS_IOS ? 34 : 0;  // ~30fps on iOS, uncapped on desktop

const rIC = window.requestIdleCallback
  ? fn => window.requestIdleCallback(fn, {timeout: 4000})
  : fn => setTimeout(fn, 1);

let pageHidden = false;
document.addEventListener('visibilitychange', () => { pageHidden = document.hidden; });

// (5) iOS WebGL context settings — all four flags
function makeRenderer(canvas, bgCol) {
  const r = new THREE.WebGLRenderer({
    canvas,
    alpha:                false,
    antialias:            !IS_IOS,
    powerPreference:      IS_IOS ? 'low-power' : 'default',
    preserveDrawingBuffer: false
  });
  r.setPixelRatio(IS_IOS ? 1 : Math.min(devicePixelRatio, IS_MOBILE ? 1.5 : 2));
  r.outputEncoding = THREE.sRGBEncoding;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.3;
  r.setClearColor(bgCol, 1);
  return r;
}

function addLights(scene) {
  scene.add(new THREE.AmbientLight(0xffffff, 2.0));
  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(-2,4,3); scene.add(key);
  const fill = new THREE.DirectionalLight(0xdde8ff, 1.0);
  fill.position.set(3,0,2); scene.add(fill);
  const top = new THREE.DirectionalLight(0xffffff, 0.8);
  top.position.set(0,5,0); scene.add(top);
}

function calcDist(camera, maxDim, fillAmt) {
  const fovRad = camera.fov * Math.PI / 180;
  return (maxDim / 2) / (Math.tan(fovRad / 2) * fillAmt);
}

// Fetch → defer parse via rIC → null buf immediately after parse
function loadGLB(url, onLoad, onError) {
  fetch(url)
    .then(r => r.arrayBuffer())
    .then(rawBuf => {
      rIC(() => {
        let buf = rawBuf;
        new THREE.GLTFLoader().parse(buf, '',
          gltf => { buf = null; onLoad(gltf); },
          err  => { buf = null; onError(err); }
        );
      });
    })
    .catch(onError);
}

// (7) Graceful fallback — hides canvas, hides loading overlay;
//     the panel's existing caption markup remains visible on the background colour
function showFallback(canvasId, loadingId) {
  const c = document.getElementById(canvasId);
  const l = document.getElementById(loadingId);
  if (c) c.style.display = 'none';
  if (l) l.style.display = 'none';
}

// Sequential gate — friend fetch never starts until brain parse is complete
let brainDone    = false;
let friendLoader = null;
function tryStartFriend() {
  if (brainDone && friendLoader) {
    const fn = friendLoader;
    friendLoader = null;
    fn();
  }
}

// (6) Brain rAF pause controls (iOS only — stops scheduling, not just skipping render)
let brainPaused = false;
let resumeBrain = null;   // assigned inside brain block, called by observers

// ── BRAIN ──
let brainVisible = true;

try {
  const canvas   = document.getElementById('brain-canvas');
  const panel    = document.getElementById('brain-panel');
  const bgCol    = new THREE.Color(0xf5f2ec);
  const renderer = makeRenderer(canvas, bgCol);
  const scene    = new THREE.Scene();
  scene.background = bgCol;
  const camera   = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
  addLights(scene);

  const pivot = new THREE.Group();
  pivot.rotation.x = 0.15;
  scene.add(pivot);

  let modelSize = new THREE.Vector3();

  function updateBrainCamera() {
    const W = panel.clientWidth, H = panel.clientHeight;
    camera.aspect = W / H;
    const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
    if (maxDim > 0) camera.position.set(0, 0, calcDist(camera, maxDim, IS_MOBILE ? 0.45 : 0.65));
    camera.updateProjectionMatrix();
  }

  // On iOS: resume brain rAF when user scrolls back to this panel
  new IntersectionObserver(entries => {
    brainVisible = entries[0].isIntersecting;
    if (IS_IOS && brainVisible && brainPaused) {
      brainPaused = false;
      resumeBrain && resumeBrain();
    }
  }, {threshold: 0}).observe(panel);

  loadGLB('brain.glb', gltf => {
    const model  = gltf.scene;
    const box    = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    box.getSize(modelSize);
    model.position.sub(centre);
    pivot.add(model);
    // (4) Touch geometry attributes to prime GPU upload on next render,
    //     then release — raw ArrayBuffer already nulled inside loadGLB
    scene.traverse(obj => { if (obj.isMesh) void obj.geometry.attributes; });
    updateBrainCamera();
    document.getElementById('brain-loading').style.opacity = '0';
    brainDone = true;
    tryStartFriend();
  }, err => {
    console.error('brain', err);
    showFallback('brain-canvas', 'brain-loading');
    brainDone = true;
    tryStartFriend();
  });

  let angle = 0, lastBrainT = 0;

  // (6) Hard-stop pattern: when brainPaused, return WITHOUT scheduling next rAF
  function loopBrain(ts) {
    if (brainPaused) return;
    requestAnimationFrame(loopBrain);
    if (pageHidden || !brainVisible) return;
    if (FRAME_MS && ts - lastBrainT < FRAME_MS) return;
    lastBrainT = ts;
    angle += 0.003;
    pivot.rotation.y = angle;
    renderer.render(scene, camera);
  }
  resumeBrain = () => requestAnimationFrame(loopBrain);

  function resizeBrain() {
    renderer.setSize(panel.clientWidth, panel.clientHeight);
    updateBrainCamera();
  }
  requestAnimationFrame(loopBrain);
  resizeBrain();
  window.addEventListener('resize', resizeBrain);
} catch(e) {
  console.error('brain init', e);
  showFallback('brain-canvas', 'brain-loading');
  brainDone = true;
  tryStartFriend();
}

// ── FRIEND — WebGL context created lazily on first intersection ──
let friendVisible = false;
let friendInited  = false;

function initFriend() {
  if (friendInited) return;
  friendInited = true;

  try {
    const canvas   = document.getElementById('friend-canvas');
    const stage    = document.getElementById('friend-stage');
    const bgCol    = new THREE.Color(0xf5f2ec);
    const renderer = makeRenderer(canvas, bgCol);
    const scene    = new THREE.Scene();
    scene.background = bgCol;
    const camera   = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
    addLights(scene);

    const pivot = new THREE.Group();
    scene.add(pivot);

    let modelSize = new THREE.Vector3();

    function updateFriendCamera() {
      const W = stage.clientWidth, H = stage.clientHeight;
      camera.aspect = W / H;
      const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
      if (maxDim > 0) camera.position.set(0, 0, calcDist(camera, maxDim, IS_MOBILE ? 0.62 : 0.60));
      camera.updateProjectionMatrix();
    }

    function doFriendLoad() {
      loadGLB('friend.glb', gltf => {
        const model  = gltf.scene;
        const box    = new THREE.Box3().setFromObject(model);
        const centre = box.getCenter(new THREE.Vector3());
        box.getSize(modelSize);
        model.position.sub(centre);
        pivot.add(model);
        scene.traverse(obj => { if (obj.isMesh) void obj.geometry.attributes; });
        updateFriendCamera();
        document.getElementById('friend-loading').style.opacity = '0';
      }, err => {
        console.error('friend', err);
        showFallback('friend-canvas', 'friend-loading');
      });
    }

    friendLoader = doFriendLoad;
    tryStartFriend();

    let lastFriendT = 0;

    if (IS_IOS) {
      // (2) iOS: Y-axis auto-spin only — no drag, no touch listeners, identical
      //     loop structure to brain so there is no extra interaction overhead
      let angle = 0;
      (function loopFriendIOS(ts) {
        requestAnimationFrame(loopFriendIOS);
        if (!friendVisible || pageHidden) return;
        if (ts - lastFriendT < FRAME_MS) return;
        lastFriendT = ts;
        angle += 0.003;
        pivot.rotation.y = angle;
        renderer.render(scene, camera);
      })(0);

    } else {
      // (3) Desktop: full drag + inertia interaction, unchanged
      let rotY=0, rotX=0, drag=false, px=0, py=0, velY=0, velX=0;
      const MAX_X = Math.PI * 0.38;
      const F=0.88, MIN=0.0001;

      function dn(x,y) { drag=true; px=x; py=y; velY=0; velX=0; }
      function mv(x,y) {
        if (!drag) return;
        const dx=x-px, dy=y-py;
        velY=dx*0.009; velX=dy*0.009;
        rotY+=velY;
        rotX=Math.max(-MAX_X, Math.min(MAX_X, rotX+velX));
        pivot.rotation.set(rotX, rotY, 0);
        px=x; py=y;
      }
      function up() { drag=false; }

      stage.addEventListener('mousedown',  e => dn(e.clientX, e.clientY));
      window.addEventListener('mousemove', e => mv(e.clientX, e.clientY));
      window.addEventListener('mouseup',   up);
      stage.addEventListener('touchstart', e => { e.preventDefault(); dn(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
      stage.addEventListener('touchmove',  e => { e.preventDefault(); mv(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
      stage.addEventListener('touchend',   up);

      (function loopFriend(ts) {
        requestAnimationFrame(loopFriend);
        if (pageHidden || !friendVisible) return;
        if (!drag) {
          if (Math.abs(velY)>MIN) { velY*=F; rotY+=velY; }
          if (Math.abs(velX)>MIN) { velX*=F; rotX=Math.max(-MAX_X,Math.min(MAX_X,rotX+velX)); }
          pivot.rotation.set(rotX,rotY,0);
        }
        renderer.render(scene, camera);
      })(0);
    }

    function resizeFriend() {
      renderer.setSize(stage.clientWidth, stage.clientHeight);
      updateFriendCamera();
    }
    resizeFriend();
    window.addEventListener('resize', resizeFriend);
  } catch(e) {
    console.error('friend init', e);
    showFallback('friend-canvas', 'friend-loading');
  }
}

// Single observer drives visibility flag, lazy init, AND iOS brain-pause
new IntersectionObserver(entries => {
  friendVisible = entries[0].isIntersecting;
  if (friendVisible) {
    // (6) On iOS: pause brain rAF BEFORE creating the second WebGL context
    if (IS_IOS) brainPaused = true;
    initFriend();
  }
}, {threshold: 0}).observe(document.getElementById('friend-panel'));
</script>
</body>
</html>
