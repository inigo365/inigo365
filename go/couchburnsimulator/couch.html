<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>couch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="/images/icon.png" />

<style>
@font-face {
  font-family: "RuneScape UF";
  src: url("../../fonts/RuneScape-UF.woff2") format("woff2"),
       url("../../fonts/RuneScape-UF.woff") format("woff");
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: white;
  font-family: "RuneScape UF", Arial, sans-serif;

  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;

  cursor: url("../../images/cursor/cursor.png"), auto;
}

/* reduces double-tap zoom behavior */
html, body {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

/* STOP MOBILE LONG-PRESS CALLOUTS / BLACK BOX + PREVENT ZOOM/GESTURES ON THE INTERACTIVE AREA */
.stage, .stage * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  touch-action: none;
}

.back-button {
  position: fixed;
  top: 8px;
  left: 8px;
  font-size: 28px;
  background: transparent;
  border: none;
  color: #2d93ea;
  font-family: "RuneScape UF", Arial, sans-serif;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  text-transform: lowercase;
  padding: 0;
  z-index: 10;
}

.wrapper {
  height: 100%;
  width: 100%;
  display: grid;
  place-items: center;
}

.stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.stage {
  position: relative;
  width: min(70vw, 360px);
  aspect-ratio: 1 / 1;
}

.stage img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;

  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.couch { z-index: 1; }

.fire {
  z-index: 2;
  opacity: 0;
  transition: opacity 80ms;
  will-change: transform;
}

.smoke {
  z-index: 3;
  opacity: 0;
  transition: opacity 140ms;
  will-change: transform;
}

.status {
  font-size: 22px;
  color: #2d93ea;
  text-transform: lowercase;
  line-height: 1;
}
</style>
</head>

<body>
<button class="back-button" onclick="goBack()">← back</button>

<div class="wrapper">
  <div class="stack">
    <div class="stage" id="stage">
      <img class="couch" src="couch.png" alt="couch" draggable="false" />
      <img class="fire"  id="fire"  src="fire_1.png"  alt="fire"  draggable="false" />
      <img class="smoke" id="smoke" src="smoke_1.png" alt="smoke" draggable="false" />
    </div>

    <div class="status" id="status">click / tap to ignite</div>
  </div>
</div>

<script>
/* -------------------------------------------------------
   VISUALS
------------------------------------------------------- */
const stageEl  = document.getElementById("stage");
const fireEl   = document.getElementById("fire");
const smokeEl  = document.getElementById("smoke");
const statusEl = document.getElementById("status");

// iOS: prevent double-tap to zoom (without disabling pinch zoom)
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

const fireFrames = [
  "fire_1.png","fire_2.png","fire_3.png","fire_4.png","fire_5.png","fire_6.png","fire_7.png"
];
const smokeFrames = ["smoke_1.png","smoke_2.png","smoke_3.png"];

// Preload all sprite frames so first cycle doesn't flash white
fireFrames.concat(smokeFrames).forEach(src => { new Image().src = src; });

const FIRE_MS  = 110;
const SMOKE_MS = 220;

let holding = false;

let fireTimer = null;
let fireIndex = 0;

let smokeTimer = null;
let smokeIndex = 0;
let smokeY = 0;
let smokeX = 0;
let smokeScale = 1;

let stopSmokeTimeout = null;

function startFire() {
  if (fireTimer) return;

  statusEl.textContent = "burning...";
  fireEl.style.opacity = "1";

  fireIndex = Math.floor(Math.random() * fireFrames.length);
  fireEl.src = fireFrames[fireIndex];

  fireTimer = setInterval(() => {
    fireIndex = (fireIndex + 1) % fireFrames.length;
    fireEl.src = fireFrames[fireIndex];

    // Scale jitter to ~0.5% of stage width so it's visible on retina
    const j = Math.max(1, stageEl.offsetWidth * 0.005);
    const jx = (Math.random() < 0.35) ? (Math.random() - 0.5) * 2 * j : 0;
    const jy = (Math.random() < 0.25) ? (Math.random() - 0.5) * 2 * j : 0;
    fireEl.style.transform = `translate(${jx}px, ${jy}px)`;
  }, FIRE_MS);
}

function stopFire() {
  statusEl.textContent = "click / tap to ignite";
  fireEl.style.opacity = "0";
  fireEl.style.transform = "translate(0px, 0px)";

  clearInterval(fireTimer);
  fireTimer = null;
}

function startSmoke() {
  if (stopSmokeTimeout) {
    clearTimeout(stopSmokeTimeout);
    stopSmokeTimeout = null;
  }
  if (smokeTimer) return;

  smokeEl.style.opacity = "1";
  smokeY = 0;
  smokeX = 0;
  smokeScale = 1;

  smokeIndex = Math.floor(Math.random() * smokeFrames.length);
  smokeEl.src = smokeFrames[smokeIndex];

  smokeTimer = setInterval(() => {
    smokeIndex = (smokeIndex + 1) % smokeFrames.length;
    smokeEl.src = smokeFrames[smokeIndex];

    // Rise upward
    if (Math.random() < 0.75) smokeY -= 1.2;

    // Drift sideways (gentle wander)
    smokeX += (Math.random() - 0.5) * 1.5;

    // Spread wider as it rises
    smokeScale += 0.008;

    // Fade out as it rises
    const progress = Math.min(1, Math.abs(smokeY) / 20);
    const opacity = 1 - progress * 0.7;
    smokeEl.style.opacity = String(Math.max(0.15, opacity));

    // Reset when fully risen (seamless loop)
    if (smokeY < -22) {
      smokeY = 0;
      smokeX = 0;
      smokeScale = 1;
      smokeEl.style.opacity = "1";
    }

    smokeEl.style.transform = `translate(${smokeX}px, ${smokeY}px) scale(${smokeScale})`;
  }, SMOKE_MS);
}

function stopSmokeWithLinger() {
  if (stopSmokeTimeout) clearTimeout(stopSmokeTimeout);

  stopSmokeTimeout = setTimeout(() => {
    smokeEl.style.opacity = "0";
    smokeEl.style.transform = "translate(0px, 0px) scale(1)";

    clearInterval(smokeTimer);
    smokeTimer = null;
    stopSmokeTimeout = null;
    smokeY = 0;
    smokeX = 0;
    smokeScale = 1;
  }, 300);
}

/* -------------------------------------------------------
   AUDIO — Hybrid WebAudio approach

   KEY iOS FINDINGS (from WebKit spec, Howler.js, PixiJS, Tone.js):
   1. touchstart does NOT grant user activation on iOS Safari
   2. touchend DOES grant activation (primary unlock event for touch)
   3. pointerdown from touch does NOT grant activation
   4. mousedown DOES grant activation (desktop/trackpad)
   5. Create AudioContext at page load, resume() in gesture handler
   6. Keep-alive oscillator at ~0 gain prevents "interrupted" state
   7. Resume on EVERY interaction (WKWebView re-suspends aggressively)
------------------------------------------------------- */
const CRACKLE_VOL_ON = 0.70;

// Step 1: Create AudioContext eagerly at page load
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const ctx = AudioCtx ? new AudioCtx({ latencyHint: "interactive" }) : null;

// Step 2: Keep-alive oscillator (Tone.js pattern) — prevents Safari "interrupted" state
if (ctx) {
  const keepAlive = ctx.createOscillator();
  const keepAliveGain = ctx.createGain();
  keepAliveGain.gain.value = 1e-37; // inaudible but keeps context alive
  keepAlive.connect(keepAliveGain);
  keepAliveGain.connect(ctx.destination);
  keepAlive.start();
}

let igniteBuffer  = null;
let crackleBuffer = null;
let crackleGain   = null;
let crackleSource = null;
let audioReady    = false;
let loadPromise   = null;
let unlocked      = false;

/*
  unlockAudio() — called from activation-granting events.
  Resumes context + plays empty buffer to fully warm the audio graph.
  Safe to call repeatedly (no-ops if already running).
  If called while holding (first-tap touchend), starts audio immediately.
*/
function unlockAudio() {
  if (!ctx) return;

  // Always try to resume (handles re-suspension after backgrounding)
  if (ctx.state !== "running") {
    ctx.resume();
  }

  if (!unlocked) {
    // Play an empty buffer through the graph (PixiJS Sound pattern)
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch (_) {}

    if (ctx.state === "running") unlocked = true;
  }

  // If user is currently holding the couch and audio is ready,
  // start sounds now (catches the first-tap case where touchend
  // unlocks the context AFTER pointerdown already tried to play)
  if (holding && audioReady) {
    playIgnite();
    crackleOn();
  }
}

// Step 3: Listen on activation-granting events (capture phase for reliability)
// touchend = iOS touch, mousedown = desktop, click = fallback
document.addEventListener("touchend", unlockAudio, true);
document.addEventListener("mousedown", unlockAudio, true);
document.addEventListener("click", unlockAudio, true);

// Step 4: Re-resume after tab switch / phone call / screen lock
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && ctx && ctx.state !== "running") {
    ctx.resume();
  }
});

/*
  loadBuffers() — async, decodes audio files. Safe to call anytime after ctx exists.
  Only runs once; subsequent calls return the same promise.
*/
async function loadBuffers() {
  if (audioReady) return true;
  if (loadPromise) return loadPromise;
  if (!ctx) return false;

  loadPromise = (async () => {
    try {
      // Fetch and decode both audio files (works even on suspended context)
      if (!igniteBuffer || !crackleBuffer) {
        const [igBuf, crBuf] = await Promise.all([
          fetch("ignite.mp3").then(r => r.arrayBuffer()).then(ab => ctx.decodeAudioData(ab)),
          fetch("crackle.mp3").then(r => r.arrayBuffer()).then(ab => ctx.decodeAudioData(ab))
        ]);
        igniteBuffer  = igBuf;
        crackleBuffer = crBuf;
      }

      audioReady = true;
      return true;
    } catch (e) {
      return false;
    } finally {
      loadPromise = null;
    }
  })();

  return loadPromise;
}

// Start loading buffers eagerly at page load
loadBuffers();

/* — Lazy-init crackle loop (only when first needed, after context is unlocked) — */
function ensureCrackleLoop() {
  if (crackleGain) return; // already set up
  if (!ctx || !crackleBuffer) return;

  crackleGain = ctx.createGain();
  crackleGain.gain.value = 0.0;
  crackleGain.connect(ctx.destination);

  crackleSource = ctx.createBufferSource();
  crackleSource.buffer = crackleBuffer;
  crackleSource.loop = true;
  crackleSource.connect(crackleGain);
  crackleSource.start(0);
}

/* — Ignite: fire-and-forget one-shot buffer — */
function playIgnite() {
  if (!audioReady || !ctx || !igniteBuffer) return;
  try {
    const src = ctx.createBufferSource();
    src.buffer = igniteBuffer;
    src.connect(ctx.destination);
    src.start(0);
  } catch (_) {}
}

/* — Crackle on/off via gain ramp — */
function crackleOn() {
  if (!audioReady || !ctx) return;
  ensureCrackleLoop();
  if (!crackleGain) return;
  const t = ctx.currentTime;
  crackleGain.gain.cancelScheduledValues(t);
  crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
  crackleGain.gain.linearRampToValueAtTime(CRACKLE_VOL_ON, t + 0.02);
}

function crackleOff() {
  if (!audioReady || !ctx || !crackleGain) return;
  const t = ctx.currentTime;
  crackleGain.gain.cancelScheduledValues(t);
  crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
  crackleGain.gain.linearRampToValueAtTime(0.0, t + 0.08);
}

/* -------------------------------------------------------
   INPUT
   - touchstart on stage: preventDefault only (stops scroll/zoom)
   - pointerdown: visuals + audio playback
   - Audio unlock happens via touchend/mousedown/click on document
------------------------------------------------------- */
document.addEventListener("contextmenu", (e) => e.preventDefault());

// Prevent scroll/zoom on stage touch — but do NOT try to unlock audio here
stageEl.addEventListener("touchstart", (e) => {
  e.preventDefault();
}, { passive: false });

async function onDown(e) {
  e.preventDefault();
  holding = true;

  // Visuals start instantly
  startFire();
  setTimeout(() => { if (holding) startSmoke(); }, 120);

  // Ensure buffers are loaded (usually already done eagerly)
  await loadBuffers();

  // If user released while loading, bail
  if (!holding) return;

  // Resume context in case it was suspended (belt + suspenders)
  if (ctx && ctx.state !== "running") ctx.resume();

  playIgnite();
  crackleOn();
}

function onUp(e) {
  if (e) e.preventDefault();
  holding = false;

  stopFire();
  stopSmokeWithLinger();
  crackleOff();
}

stageEl.addEventListener("pointerdown", onDown, { passive: false });
window.addEventListener("pointerup", onUp, { passive: false });
window.addEventListener("pointercancel", onUp, { passive: false });
window.addEventListener("pointerleave", onUp, { passive: false });

function goBack() {
  const params = new URLSearchParams(window.location.search);
  window.location.href = params.get('from') === 'game'
    ? '../game/boom.html'
    : '../index.html';
}
</script>
</body>
</html>
