<style>
@font-face {
  font-family: "RuneScape UF";
  src: url("../../fonts/RuneScape-UF.woff2") format("woff2"),
       url("../../fonts/RuneScape-UF.woff") format("woff");
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* Pixelated background scene — rendered with crisp-edges via CSS */
  background-image: url("background.png");
  background-size: max(100vw, 187.5vh) auto; /* fills full viewport width AND preserves full image height — 187.5vh = image aspect ratio (1250÷667) × 100vh */
  background-position: left bottom;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  font-family: "RuneScape UF", Arial, sans-serif;

  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;

  cursor: url("../../images/cursor/cursor.png"), auto;
}

/* reduces double-tap zoom behavior */
html, body {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

/* STOP MOBILE LONG-PRESS CALLOUTS / BLACK BOX + PREVENT ZOOM/GESTURES ON THE INTERACTIVE AREA */
.stage, .stage * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  touch-action: none;
}

.back-button {
  position: fixed;
  top: 8px;
  left: 8px;
  font-size: 28px;
  background: transparent;
  border: none;
  color: #ffffff;
  font-family: "RuneScape UF", Arial, sans-serif;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  text-transform: lowercase;
  padding: 0;
  z-index: 60; /* above start screen (z-index 50) */
  text-shadow:
     1px  1px 0 rgba(0,0,0,0.85),
    -1px -1px 0 rgba(0,0,0,0.85),
     1px -1px 0 rgba(0,0,0,0.85),
    -1px  1px 0 rgba(0,0,0,0.85);
}

/* Full-screen container — stage and status sit inside this */
.wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Transparent to layout — children (.stage, .status) position themselves */
.stack {
  display: contents;
}

/* Stage: positioned to match the couch in background.png (1000×667 image).
   Background couch center ≈ 50% horizontal, bottom ≈ 93% from top.
   With cover sizing this maps to roughly bottom: 5% of viewport. */
.stage {
  position: absolute;
  left: 25%;              /* ← DESKTOP couch horizontal position (mobile overrides below) */
  bottom: 1%;             /* ← DESKTOP couch vertical position (mobile overrides below) */
  transform: translateX(-50%);
  width: 52vh;            /* ← DESKTOP couch size (mobile overrides below) */
  aspect-ratio: 1 / 1;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}

.stage img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;

  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* Floating splash phrases that pop up over the couch */
@keyframes splashFloat {
  0%   { opacity: 0;    transform: translateX(-50%) translateY(0);     }
  12%  { opacity: 1;    transform: translateX(-50%) translateY(-8px);  }
  65%  { opacity: 1;    transform: translateX(-50%) translateY(-28px); }
  100% { opacity: 0;    transform: translateX(-50%) translateY(-80px); }
}

/* Ghostly variant for pre-interaction hints — same float but much fainter */
@keyframes splashHintFloat {
  0%   { opacity: 0;    transform: translateX(-50%) translateY(0);     }
  15%  { opacity: 0.38; transform: translateX(-50%) translateY(-8px);  }
  65%  { opacity: 0.32; transform: translateX(-50%) translateY(-28px); }
  100% { opacity: 0;    transform: translateX(-50%) translateY(-80px); }
}
.splash-hint {
  animation: splashHintFloat 3.6s ease-out forwards;
  font-size: 19px;
  color: #e8e8e8;
  text-shadow:
     1px  1px 0 rgba(0,0,0,0.4),
    -1px -1px 0 rgba(0,0,0,0.4),
     1px -1px 0 rgba(0,0,0,0.4),
    -1px  1px 0 rgba(0,0,0,0.4);
}

.splash {
  position: fixed;
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  color: #ffffff;
  text-transform: lowercase;
  white-space: nowrap;
  pointer-events: none;
  z-index: 20;
  animation: splashFloat 2.8s ease-out forwards;
  text-shadow:
     1px  1px 0 rgba(0,0,0,0.9),
    -1px -1px 0 rgba(0,0,0,0.9),
     1px -1px 0 rgba(0,0,0,0.9),
    -1px  1px 0 rgba(0,0,0,0.9);
}

.couch { z-index: 1; }

.fire {
  z-index: 2;
  opacity: 0;
  transition: opacity 80ms;
  will-change: transform;
}

.smoke {
  z-index: 3;
  opacity: 0;
  transition: opacity 140ms;
  will-change: transform;
}

/* Status text — white with dark outline, centred horizontally.
   Desktop sits at 40% from top; mobile overrides to 50% (true centre). */
.status {
  position: fixed;
  top: 40%;                /* ← DESKTOP vertical position (mobile overrides below) */
  left: 15%;               /* ← horizontal position (50% = centre, lower = further left) */
  transform: translate(-50%, -50%);
  font-size: 22px;
  color: #ffffff;
  text-transform: lowercase;
  line-height: 1;
  white-space: nowrap;
  text-shadow:
     1px  1px 0 rgba(0,0,0,0.85),
    -1px -1px 0 rgba(0,0,0,0.85),
     1px -1px 0 rgba(0,0,0,0.85),
    -1px  1px 0 rgba(0,0,0,0.85);
}

/* ─── START SCREEN ──────────────────────────────────────────────────────────
   Fullscreen transparent overlay — intercepts the very first gesture so that
   AudioContext creation happens in a clean, isolated user-gesture context with
   no competing preventDefault chains or capture-phase complications.           */
#start-screen {
  position: fixed;
  inset: 0;
  z-index: 50;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
}
#start-prompt {
  position: fixed;
  top: 50%;            /* desktop: perfectly centred (mobile overrides below) */
  left: 50%;           /* desktop: perfectly centred (mobile overrides below) */
  transform: translate(-50%, -50%);
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 22px;
  color: #ffffff;
  text-transform: lowercase;
  white-space: nowrap;
  pointer-events: none;
  text-shadow:
     1px  1px 0 rgba(0,0,0,0.85),
    -1px -1px 0 rgba(0,0,0,0.85),
     1px -1px 0 rgba(0,0,0,0.85),
    -1px  1px 0 rgba(0,0,0,0.85);
  animation: startPulse 1.2s ease-in-out infinite;
}
@keyframes startPulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}

/* ─── MOBILE OVERRIDES ──────────────────────────────────────────────────────
   Background: cover scales by height on portrait phones so the image always
   fills the full viewport with no gap at the top.
   ─────────────────────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  html, body {
    background-size: cover;
    background-position: -200px bottom; /* offset 150px left to compensate for 150px added to left side of image */
  }

  /* ↓ COUCH SIZE / POSITION ON MOBILE — tweak these three values to reposition.
       Desktop width is 57vh. Desktop bottom is 17%. Desktop left is 50%.     */
  .stage {
    width: 42vh;          /* fallback for older browsers */
    width: 42svh;         /* ← adjust couch scale here — svh = viewport minus Safari browser chrome, matches DevTools exactly */
    bottom: 1%;           /* ← adjust couch vertical position here */
    left: 54%;            /* ← adjust couch horizontal position here (50% = centre) */
  }

  /* ↓ STATUS TEXT VERTICAL POSITION ON MOBILE                                */
  .status {
    top: 50%;
    left: 40%;             /* ← adjust status text horizontal position here (desktop is 15%) */
  }

  #start-prompt {
    top: 50%;
    left: 30%;
  }

}
</style>
</head>

<body>
<button class="back-button" onclick="goBack()">← back</button>

<!-- Start screen: intercepts the very first gesture to unlock AudioContext cleanly -->
<div id="start-screen">
  <div id="start-prompt">tap anywhere to start</div>
</div>

<div class="wrapper">
  <div class="stack">
    <div class="stage" id="stage">
      <img class="couch" src="couch.png" alt="couch" draggable="false" />
      <img class="fire"  id="fire"  src="fire_1.png"  alt="fire"  draggable="false" />
      <img class="smoke" id="smoke" src="smoke_1.png" alt="smoke" draggable="false" />
    </div>

    <div class="status" id="status" style="visibility:hidden"></div>
  </div>
</div>

<script>
/* -------------------------------------------------------
   VISUALS
------------------------------------------------------- */
const stageEl  = document.getElementById("stage");
const fireEl   = document.getElementById("fire");
const smokeEl  = document.getElementById("smoke");
const statusEl = document.getElementById("status");

// iOS: prevent double-tap to zoom (without disabling pinch zoom)
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

const fireFrames = [
  "fire_1.png","fire_2.png","fire_3.png","fire_4.png","fire_5.png","fire_6.png","fire_7.png"
];
const smokeFrames = ["smoke_1.png","smoke_2.png","smoke_3.png"];

// Preload all sprite frames so first cycle doesn't flash white
fireFrames.concat(smokeFrames).forEach(src => { new Image().src = src; });

const FIRE_MS  = 110;
const SMOKE_MS = 220;

let holding = false;

let fireTimer = null;
let fireIndex = 0;

let smokeTimer = null;
let smokeIndex = 0;
let smokeY = 0;
let smokeX = 0;
let smokeScale = 1;

let stopSmokeTimeout = null;

/* -------------------------------------------------------
   STATUS TEXT — rotating NZ slang while burning
------------------------------------------------------- */
const NZ_PHRASES = [
  "insane couch",
  "so cooked g",
  "good cunt",
  "sick cunt",
  "oh yeah nah yeah nah yea",
  "sweet bro",
  "munted fuckwit",
  "ka pai",
  "whadyatalkinabeet",
  "boom ting",
  "oi oi oi",
  "six pack of diesels",
  "5 million billy mavs later",
  "i love scrumpy",
  "g he just funnelled a goldfish",
  "pube sandwich",
  "paint the eisel",
  "lets play hide the shit",
  "any cones showley",
  "g ne rax",
  "wna sco",
  "gt tbz msg",
  "bring back discord"
];

let statusTimer = null;
let phraseIndex = 0;

/* Spawn a phrase as a floating label above the couch, drifting upward then fading */
function showSplash(text, hint = false) {
  const rect = stageEl.getBoundingClientRect();
  const x = rect.left + rect.width  * 0.5 + (Math.random() - 0.5) * rect.width * 0.3;
  const y = rect.top  + rect.height * 0.25;

  const el = document.createElement("div");
  el.className   = hint ? "splash splash-hint" : "splash";
  el.textContent = text;
  el.style.left  = x + "px";
  el.style.top   = y + "px";
  document.body.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

/* Hint splashes — appear over the couch after the start screen is dismissed,
   nudging the user to interact. Stops as soon as they press the couch.       */
const HINTS = ["tap & hold", "hold it...", "tap the couch"];
let hintIdx   = 0;
let hintTimer = null;
let hintsDone = false; // set true once fire is confirmed — never show hints again

function startHintCycle() {
  if (hintsDone || hintTimer) return;
  function showNext() {
    showSplash(HINTS[hintIdx % HINTS.length], true); // true = ghostly hint style
    hintIdx++;
    hintTimer = setTimeout(showNext, 4000);
  }
  showNext(); // first hint immediately, then every 4s
}

function stopHintCycle(permanent = false) {
  clearTimeout(hintTimer);
  hintTimer = null;
  if (permanent) hintsDone = true;
}

function startStatusCycle() {
  if (statusTimer) return;
  stopHintCycle(true); // fire is going — hints no longer needed, ever

  // Spawn a floating phrase over the couch — ← adjust interval (ms) to change frequency
  statusTimer = setInterval(() => {
    let next;
    do { next = Math.floor(Math.random() * NZ_PHRASES.length); }
    while (next === phraseIndex && NZ_PHRASES.length > 1); // never repeat the last one
    phraseIndex = next;
    showSplash(NZ_PHRASES[phraseIndex]);
  }, 2000); /* ← splash frequency in ms (lower = more frequent) */
}

function stopStatusCycle() {
  clearInterval(statusTimer);
  statusTimer = null;
  statusEl.textContent = "";
}

function startFire() {
  if (fireTimer) return;

  startStatusCycle();
  fireEl.style.opacity = "1";

  fireIndex = Math.floor(Math.random() * fireFrames.length);
  fireEl.src = fireFrames[fireIndex];

  fireTimer = setInterval(() => {
    fireIndex = (fireIndex + 1) % fireFrames.length;
    fireEl.src = fireFrames[fireIndex];

    // Scale jitter to ~0.5% of stage width so it's visible on retina
    const j = Math.max(1, stageEl.offsetWidth * 0.005);
    const jx = (Math.random() < 0.35) ? (Math.random() - 0.5) * 2 * j : 0;
    const jy = (Math.random() < 0.25) ? (Math.random() - 0.5) * 2 * j : 0;
    fireEl.style.transform = `translate(${jx}px, ${jy}px)`;
  }, FIRE_MS);
}

function stopFire() {
  stopStatusCycle();
  fireEl.style.opacity = "0";
  fireEl.style.transform = "translate(0px, 0px)";

  clearInterval(fireTimer);
  fireTimer = null;
}

function startSmoke() {
  if (stopSmokeTimeout) {
    clearTimeout(stopSmokeTimeout);
    stopSmokeTimeout = null;
  }
  if (smokeTimer) return;

  smokeEl.style.opacity = "1";
  smokeY = 0;
  smokeX = 0;
  smokeScale = 1;

  smokeIndex = Math.floor(Math.random() * smokeFrames.length);
  smokeEl.src = smokeFrames[smokeIndex];

  smokeTimer = setInterval(() => {
    smokeIndex = (smokeIndex + 1) % smokeFrames.length;
    smokeEl.src = smokeFrames[smokeIndex];

    // Rise upward
    if (Math.random() < 0.75) smokeY -= 1.2;

    // Drift sideways (gentle wander)
    smokeX += (Math.random() - 0.5) * 1.5;

    // Spread wider as it rises
    smokeScale += 0.008;

    // Fade out as it rises
    const progress = Math.min(1, Math.abs(smokeY) / 20);
    const opacity = 1 - progress * 0.7;
    smokeEl.style.opacity = String(Math.max(0.15, opacity));

    // Reset when fully risen (seamless loop)
    if (smokeY < -22) {
      smokeY = 0;
      smokeX = 0;
      smokeScale = 1;
      smokeEl.style.opacity = "1";
    }

    smokeEl.style.transform = `translate(${smokeX}px, ${smokeY}px) scale(${smokeScale})`;
  }, SMOKE_MS);
}

function stopSmokeWithLinger() {
  if (stopSmokeTimeout) clearTimeout(stopSmokeTimeout);

  stopSmokeTimeout = setTimeout(() => {
    smokeEl.style.opacity = "0";
    smokeEl.style.transform = "translate(0px, 0px) scale(1)";

    clearInterval(smokeTimer);
    smokeTimer = null;
    stopSmokeTimeout = null;
    smokeY = 0;
    smokeX = 0;
    smokeScale = 1;
  }, 300);
}

/* -------------------------------------------------------
   AUDIO — Lazy WebAudio + HTMLAudio pool fallback
   (same pattern as index.html — context created inside first gesture)
------------------------------------------------------- */

const SOUNDS  = { crackle: "crackle.mp3" }; // ignite is now procedural WebAudio
const VOLUMES = { ignite: 0.65, crackle: 0.45 };

// HTMLAudio pools — created immediately, no gesture needed (fallback path)
const pools = {};
function ensurePool(name) {
  if (pools[name]) return pools[name];
  const a = new Audio(SOUNDS[name]);
  a.volume = VOLUMES[name] || 1;
  if (name === "crackle") a.loop = true;
  pools[name] = a;
  return a;
}
Object.keys(SOUNDS).forEach(ensurePool);

// Fetch raw bytes for WebAudio decoding (cached, no gesture needed)
const fetched = new Map();
(async () => {
  await Promise.all(Object.keys(SOUNDS).map(async (name) => {
    try {
      const res = await fetch(SOUNDS[name], { cache: "force-cache" });
      fetched.set(name, await res.arrayBuffer());
    } catch (_) {}
  }));
  // If the user gestured before fetch finished, kick off decode now
  if (actx && !audioReady) decodeAndReady();
})();

// WebAudio state — all lazy, created inside first gesture
let actx        = null;
let master      = null;
let audioReady  = false;
const buffers   = new Map();
let crackleGain = null;
let crackleNode = null;

// Decodes fetched byte arrays into AudioBuffers, then fires audio if holding.
// Runs async but does NOT need to be inside a gesture handler.
async function decodeAndReady() {
  for (const [name, arr] of fetched) {
    if (!buffers.has(name)) {
      try {
        buffers.set(name, await actx.decodeAudioData(arr.slice(0)));
      } catch (_) {}
    }
  }
  if (buffers.size >= Object.keys(SOUNDS).length) {
    audioReady = true;
    if (holding) crackleOn(); // ignite already fired in onDown; just start the loop
  }
}

// SYNCHRONOUS unlock — context creation and resume() MUST stay synchronous
// within the gesture handler so the browser never sees us exit the gesture
// context before the AudioContext is started. Any async work (decode) is
// delegated to decodeAndReady() which runs outside the gesture context.
function unlockNow() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx   = new AC({ latencyHint: "interactive" });
    master = actx.createGain();
    master.connect(actx.destination);
  }

  // resume() called synchronously — no await, so we never yield the gesture context
  actx.resume().catch(() => {});

  // Warm-up blip (unlocks iOS audio hardware while still inside gesture)
  try {
    const osc = actx.createOscillator();
    const g   = actx.createGain();
    g.gain.value = 0.0001;
    osc.connect(g);
    g.connect(master);
    osc.start();
    osc.stop(actx.currentTime + 0.01);
  } catch (_) {}

  // Kick off decode (async, safe to run outside gesture context)
  if (!audioReady && !unlockNow._decoding) {
    unlockNow._decoding = true;
    decodeAndReady();
  }

  // Heartbeat — keeps iOS from suspending the context in the background
  if (!unlockNow._hb) {
    unlockNow._hb = setInterval(() => {
      if (actx && actx.state === "running") {
        try {
          const s = actx.createBufferSource();
          s.buffer = actx.createBuffer(1, 1, actx.sampleRate);
          s.connect(master);
          s.start(0);
        } catch (_) {}
      }
    }, 25000);
  }
}

// Start screen — the ONLY entry point for first-gesture audio unlock.
// Calling unlockNow() here gives the browser a clean, unambiguous user-gesture
// context: no capture-phase complications, no preventDefault chains.
const startScreenEl = document.getElementById("start-screen");

function dismissStartScreen() {
  unlockNow();
  startScreenEl.remove();
  statusEl.style.visibility = "";
  startHintCycle(); // begin subtle couch-hint splashes
}

startScreenEl.addEventListener("pointerdown", dismissStartScreen, { once: true });
document.addEventListener("keydown", dismissStartScreen,           { once: true });

// Re-resume after tab switch / phone call / screen lock
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && actx && actx.state === "suspended") actx.resume().catch(() => {});
});

/* — Ignite: procedural two-layer fire-catch sound (no audio file needed) —
   Layer 1 "whoosh"  — low-pass noise sweeping 3500 Hz → 300 Hz over 0.7s
   Layer 2 "whumph"  — low-pass thump at ~180 Hz, decays in 0.35s
   Tweak VOLUMES.ignite (0–1) above to change overall loudness.            */
function playIgnite() {
  if (!actx || !master) return;
  if (actx.state === "suspended") actx.resume().catch(() => {});
  try {
    const t      = actx.currentTime;
    const dur    = 0.7;
    const frames = Math.ceil(actx.sampleRate * dur);

    // Shared white-noise buffer
    const noiseBuf = actx.createBuffer(1, frames, actx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < frames; i++) ch[i] = Math.random() * 2 - 1;

    // Layer 1 — bright-to-dark frequency sweep (the "whoosh")
    const src1 = actx.createBufferSource(); src1.buffer = noiseBuf;
    const lpf1 = actx.createBiquadFilter(); lpf1.type = "lowpass"; lpf1.Q.value = 0.7;
    lpf1.frequency.setValueAtTime(3500, t);
    lpf1.frequency.exponentialRampToValueAtTime(300, t + dur);
    const g1 = actx.createGain();
    g1.gain.setValueAtTime(0, t);
    g1.gain.linearRampToValueAtTime(VOLUMES.ignite * 0.8, t + 0.03);
    g1.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src1.connect(lpf1); lpf1.connect(g1); g1.connect(master);

    // Layer 2 — low-frequency thump (the "whumph" as it catches)
    const src2 = actx.createBufferSource(); src2.buffer = noiseBuf;
    const lpf2 = actx.createBiquadFilter(); lpf2.type = "lowpass";
    lpf2.frequency.value = 180; lpf2.Q.value = 1.5;
    const g2 = actx.createGain();
    g2.gain.setValueAtTime(0, t);
    g2.gain.linearRampToValueAtTime(VOLUMES.ignite * 0.9, t + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    src2.connect(lpf2); lpf2.connect(g2); g2.connect(master);

    src1.start(t); src1.stop(t + dur);
    src2.start(t); src2.stop(t + dur);
  } catch (_) {}
}

/* — Crackle loop: WebAudio gain ramp, HTMLAudio fallback —
   Assumes crackle.mp3 is a properly prepared seamless loop (no encoder-padding
   gap), so we loop the full buffer from 0 → duration with no trim needed.    */
function ensureCrackleLoop() {
  if (crackleGain || !actx || !master || !buffers.has("crackle")) return;
  crackleGain = actx.createGain();
  crackleGain.gain.value = 0;
  crackleGain.connect(master);

  const buf = buffers.get("crackle");
  crackleNode = actx.createBufferSource();
  crackleNode.buffer    = buf;
  crackleNode.loop      = true;
  crackleNode.loopStart = 0;
  crackleNode.loopEnd   = buf.duration;
  crackleNode.connect(crackleGain);
  crackleNode.start(0);
}

function crackleOn() {
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
  if (audioReady && actx) {
    ensureCrackleLoop();
    if (crackleGain) {
      const t = actx.currentTime;
      crackleGain.gain.cancelScheduledValues(t);
      crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
      crackleGain.gain.linearRampToValueAtTime(VOLUMES.crackle, t + 0.02);
      return;
    }
  }
  // HTMLAudio fallback
  try { pools["crackle"].play().catch(() => {}); } catch (_) {}
}

function crackleOff() {
  if (actx && crackleGain) {
    const t = actx.currentTime;
    crackleGain.gain.cancelScheduledValues(t);
    crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
    crackleGain.gain.linearRampToValueAtTime(0, t + 0.08);
    return;
  }
  // HTMLAudio fallback
  try { const a = pools["crackle"]; a.pause(); a.currentTime = 0; } catch (_) {}
}

/* -------------------------------------------------------
   INPUT
   - touchstart on stage: preventDefault only (stops scroll/zoom)
   - pointerdown: visuals + audio playback
   - Audio unlock: context created on first touchstart/pointerdown/keydown
------------------------------------------------------- */
document.addEventListener("contextmenu", (e) => e.preventDefault());

// Prevent scroll/zoom on stage touch — but do NOT try to unlock audio here
stageEl.addEventListener("touchstart", (e) => {
  e.preventDefault();
}, { passive: false });

function onDown(e) {
  e.preventDefault();
  holding = true;

  stopHintCycle(); // pause hints while pressing (resumes on release if fire didn't start)
  startFire();
  setTimeout(() => { if (holding) startSmoke(); }, 120);

  // playIgnite is fully procedural — only needs actx to exist, no decoded buffers.
  // unlockNow (capture phase, same gesture) creates actx synchronously before
  // onDown fires, so this works on the very first tap.
  if (actx) playIgnite();

  // crackleOn needs the decoded buffer — fires immediately on taps after the
  // first, or via decodeAndReady() callback on the first tap once decode finishes.
  if (audioReady) crackleOn();
}

function onUp(e) {
  if (e) e.preventDefault();
  holding = false;

  stopFire();
  stopSmokeWithLinger();
  crackleOff();
  startHintCycle(); // resume hints if fire never got going (no-ops if hintsDone)
}

stageEl.addEventListener("pointerdown", onDown, { passive: false });
window.addEventListener("pointerup", onUp, { passive: false });
window.addEventListener("pointercancel", onUp, { passive: false });
window.addEventListener("pointerleave", onUp, { passive: false });

function goBack() {
  const params = new URLSearchParams(window.location.search);
  window.location.href = params.get('from') === 'game'
    ? '../game/boom.html'
    : '../index.html';
}
</script>
</body>
