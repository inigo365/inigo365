<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>couch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="/images/icon.png" />

<style>
@font-face {
  font-family: "RuneScape UF";
  src: url("../../fonts/RuneScape-UF.woff2") format("woff2"),
       url("../../fonts/RuneScape-UF.woff") format("woff");
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: white;
  font-family: "RuneScape UF", Arial, sans-serif;

  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;

  cursor: url("../../images/cursor/cursor.png"), auto;
}

/* reduces double-tap zoom behavior */
html, body {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

/* STOP MOBILE LONG-PRESS CALLOUTS / BLACK BOX + PREVENT ZOOM/GESTURES ON THE INTERACTIVE AREA */
.stage, .stage * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  touch-action: none;
}

.back-button {
  position: fixed;
  top: 8px;
  left: 8px;
  font-size: 28px;
  background: transparent;
  border: none;
  color: #2d93ea;
  font-family: "RuneScape UF", Arial, sans-serif;
  cursor: url("../../images/cursor/cursor-hover.png"), pointer;
  text-transform: lowercase;
  padding: 0;
  z-index: 10;
}

.wrapper {
  height: 100%;
  width: 100%;
  display: grid;
  place-items: center;
}

.stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.stage {
  position: relative;
  width: min(70vw, 360px);
  aspect-ratio: 1 / 1;
}

.stage img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;

  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.couch { z-index: 1; }

.fire {
  z-index: 2;
  opacity: 0;
  transition: opacity 80ms;
  will-change: transform;
}

.smoke {
  z-index: 3;
  opacity: 0;
  transition: opacity 140ms;
  will-change: transform;
}

.status {
  font-size: 22px;
  color: #2d93ea;
  text-transform: lowercase;
  line-height: 1;
}
</style>
</head>

<body>
<button class="back-button" onclick="goBack()">← back</button>

<div class="wrapper">
  <div class="stack">
    <div class="stage" id="stage">
      <img class="couch" src="couch.png" alt="couch" draggable="false" />
      <img class="fire"  id="fire"  src="fire_1.png"  alt="fire"  draggable="false" />
      <img class="smoke" id="smoke" src="smoke_1.png" alt="smoke" draggable="false" />
    </div>

    <div class="status" id="status">click / tap to ignite</div>
  </div>
</div>

<!-- Audio: ignite preload helper only; crackle loaded via WebAudio -->
<audio id="igniteEl" src="ignite.mp3" preload="auto" playsinline></audio>

<script>
/* -------------------------------------------------------
   VISUALS
------------------------------------------------------- */
const stageEl  = document.getElementById("stage");
const fireEl   = document.getElementById("fire");
const smokeEl  = document.getElementById("smoke");
const statusEl = document.getElementById("status");

// iOS: prevent double-tap to zoom (without disabling pinch zoom)
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

const fireFrames = [
  "fire_1.png","fire_2.png","fire_3.png","fire_4.png","fire_5.png","fire_6.png","fire_7.png"
];
const smokeFrames = ["smoke_1.png","smoke_2.png","smoke_3.png"];

const FIRE_MS  = 110;
const SMOKE_MS = 220;

let holding = false;

let fireTimer = null;
let fireIndex = 0;

let smokeTimer = null;
let smokeIndex = 0;
let smokeY = 0;

let stopSmokeTimeout = null;

function startFire() {
  if (fireTimer) return;

  statusEl.textContent = "burning...";
  fireEl.style.opacity = "1";

  fireIndex = Math.floor(Math.random() * fireFrames.length);
  fireEl.src = fireFrames[fireIndex];

  fireTimer = setInterval(() => {
    fireIndex = (fireIndex + 1) % fireFrames.length;
    fireEl.src = fireFrames[fireIndex];

    const jx = (Math.random() < 0.35) ? (Math.random() < 0.5 ? -1 : 1) : 0;
    const jy = (Math.random() < 0.25) ? (Math.random() < 0.5 ? -1 : 1) : 0;
    fireEl.style.transform = `translate(${jx}px, ${jy}px)`;
  }, FIRE_MS);
}

function stopFire() {
  statusEl.textContent = "click / tap to ignite";
  fireEl.style.opacity = "0";
  fireEl.style.transform = "translate(0px, 0px)";

  clearInterval(fireTimer);
  fireTimer = null;
}

function startSmoke() {
  if (stopSmokeTimeout) {
    clearTimeout(stopSmokeTimeout);
    stopSmokeTimeout = null;
  }
  if (smokeTimer) return;

  smokeEl.style.opacity = "1";
  smokeY = 0;

  smokeIndex = Math.floor(Math.random() * smokeFrames.length);
  smokeEl.src = smokeFrames[smokeIndex];

  smokeTimer = setInterval(() => {
    smokeIndex = (smokeIndex + 1) % smokeFrames.length;
    smokeEl.src = smokeFrames[smokeIndex];

    if (Math.random() < 0.75) smokeY -= 1;
    if (smokeY < -10) smokeY = 0;

    const sx = (Math.random() < 0.15) ? (Math.random() < 0.5 ? -1 : 1) : 0;
    smokeEl.style.transform = `translate(${sx}px, ${smokeY}px)`;
  }, SMOKE_MS);
}

function stopSmokeWithLinger() {
  if (stopSmokeTimeout) clearTimeout(stopSmokeTimeout);

  stopSmokeTimeout = setTimeout(() => {
    smokeEl.style.opacity = "0";
    smokeEl.style.transform = "translate(0px, 0px)";

    clearInterval(smokeTimer);
    smokeTimer = null;
    stopSmokeTimeout = null;
  }, 300);
}

/* -------------------------------------------------------
   AUDIO — All WebAudio, single AudioContext
   - Both ignite and crackle use decoded buffers
   - No HTMLAudio pool (unreliable on iOS/Android)
   - Context created + resumed on first gesture
   - Re-resumes on every gesture (handles iOS suspension)
------------------------------------------------------- */
const igniteEl = document.getElementById("igniteEl"); // preload hint only

const CRACKLE_VOL_ON = 0.70;

let ctx = null;
let igniteBuffer  = null;
let crackleBuffer = null;
let crackleGain   = null;
let crackleSource = null;
let audioReady    = false;
let initPromise   = null;

/* — Init: create context, decode both buffers, start silent crackle loop — */
async function initAudio() {
  if (audioReady) return true;
  if (initPromise) return initPromise;

  initPromise = (async () => {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return false;

      if (!ctx) {
        ctx = new AudioCtx({ latencyHint: "interactive" });
      }

      // Always try to resume (handles iOS re-suspension)
      if (ctx.state === "suspended") {
        await ctx.resume();
      }

      // Silent blip to fully unlock iOS AudioContext
      const osc = ctx.createOscillator();
      const silentGain = ctx.createGain();
      silentGain.gain.value = 0.00001;
      osc.connect(silentGain);
      silentGain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.01);

      // Decode both buffers in parallel (only on first init)
      if (!igniteBuffer || !crackleBuffer) {
        const [igBuf, crBuf] = await Promise.all([
          fetch("ignite.mp3").then(r => r.arrayBuffer()).then(ab => ctx.decodeAudioData(ab)),
          fetch("crackle.mp3").then(r => r.arrayBuffer()).then(ab => ctx.decodeAudioData(ab))
        ]);
        igniteBuffer  = igBuf;
        crackleBuffer = crBuf;
      }

      // Set up crackle gain node (once)
      if (!crackleGain) {
        crackleGain = ctx.createGain();
        crackleGain.gain.value = 0.0;
        crackleGain.connect(ctx.destination);
      }

      // Start the crackle loop silently (once)
      if (!crackleSource) {
        crackleSource = ctx.createBufferSource();
        crackleSource.buffer = crackleBuffer;
        crackleSource.loop = true;
        crackleSource.connect(crackleGain);
        crackleSource.start(0);
      }

      audioReady = true;
      return true;
    } catch (e) {
      return false;
    } finally {
      initPromise = null;
    }
  })();

  return initPromise;
}

/* — Ensure context is alive (call on every gesture) — */
async function ensureContext() {
  if (ctx && ctx.state === "suspended") {
    try { await ctx.resume(); } catch (_) {}
  }
}

/* — Ignite: fire-and-forget one-shot buffer — */
function playIgnite() {
  if (!audioReady || !ctx || !igniteBuffer) return;
  try {
    const src = ctx.createBufferSource();
    src.buffer = igniteBuffer;
    src.connect(ctx.destination);
    src.start(0);
  } catch (_) {}
}

/* — Crackle on/off via gain ramp — */
function crackleOn() {
  if (!audioReady || !ctx || !crackleGain) return;
  const t = ctx.currentTime;
  crackleGain.gain.cancelScheduledValues(t);
  crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
  crackleGain.gain.linearRampToValueAtTime(CRACKLE_VOL_ON, t + 0.02);
}

function crackleOff() {
  if (!audioReady || !ctx || !crackleGain) return;
  const t = ctx.currentTime;
  crackleGain.gain.cancelScheduledValues(t);
  crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
  crackleGain.gain.linearRampToValueAtTime(0.0, t + 0.08);
}

/* -------------------------------------------------------
   INPUT (Pointer Events)
------------------------------------------------------- */
document.addEventListener("contextmenu", (e) => e.preventDefault());

async function onDown(e) {
  e.preventDefault();
  holding = true;

  // Visuals start instantly — no waiting on audio
  startFire();
  setTimeout(() => { if (holding) startSmoke(); }, 120);

  // Init or re-resume audio from this gesture
  await initAudio();
  await ensureContext();

  // If user released while we were initing, bail on audio
  if (!holding) return;

  playIgnite();
  crackleOn();
}

function onUp(e) {
  if (e) e.preventDefault();
  holding = false;

  stopFire();
  stopSmokeWithLinger();
  crackleOff();
}

stageEl.addEventListener("pointerdown", onDown, { passive: false });
window.addEventListener("pointerup", onUp, { passive: false });
window.addEventListener("pointercancel", onUp, { passive: false });
window.addEventListener("pointerleave", onUp, { passive: false });

function goBack() {
  window.location.href = "../index.html";
}
</script>
</body>
</html>
