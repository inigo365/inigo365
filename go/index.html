<meta charset="UTF-8">

<!-- iOS: stop zoom/double-tap zoom -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" href="../images/icon.png">
<link rel="preload" href="../fonts/RuneScape-UF.woff2" as="font" type="font/woff2" crossorigin>

<meta name="apple-mobile-web-app-status-bar-style" content="default">


<style>
@font-face {
  font-family: "RuneScape UF";
  src: url("../fonts/RuneScape-UF.woff2") format("woff2"),
       url("../fonts/RuneScape-UF.woff") format("woff");
  font-display: swap;
}


html { height: 100%; }
body { min-height: 100%; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  overflow-x: hidden;
  overflow: hidden;          /* no scrollbars */
  overscroll-behavior: none;

  font-family: "RuneScape UF", Arial, sans-serif;

  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;

  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

html, body { cursor: url("../images/cursor/cursor.png"), auto; }
button, input { cursor: url("../images/cursor/cursor-hover.png"), pointer; }
label { cursor: url("../images/cursor/cursor.png"), auto; }
/* never allow sideways scroll/pan */
html, body {
  overflow-x: hidden;
  max-width: 100%;
}

*, *::before, *::after {
  box-sizing: border-box;
}

/* safety: any child cannot exceed viewport width */
.password-screen, .password-row, .password-box, #passwordForm {
  max-width: 100%;
}

button {
  -webkit-appearance: none;
  appearance: none;
  color: inherit;
}

:root{
  --accent: #2d93ea;  /* blue for nav/play/back */
  --btn: #000000;     /* black for UI buttons */
}
/* input + always-visible help button (does NOT affect centering) */
.input-wrap {
  position: relative;
  display: inline-block; /* keeps same centering behavior as before */
}

.help-side {
  position: absolute;
  left: calc(100% + 12px); /* sits to the right of the input */
  top: 50%;
  transform: translateY(-50%);
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--btn);
  line-height: 1;
  cursor: url("../images/cursor/cursor-hover.png"), pointer;
  z-index: 5;
}
.help-side:hover { text-decoration: underline; }

.password-screen{
  width: 100%;
  min-height: 100vh;
  background: transparent;
  position: relative;

  /* Hidden by default from the very first paint — this is a static rule in
     <head>, so the element is already invisible before any content paints
     (nothing to flash). Deliberately NO transition here, so the hidden state
     snaps instantly and the accidental pre-ready flip can never animate. */
  opacity: 0;

  display: flex;
  justify-content: center;

  /* DESKTOP DEFAULT: vertically centered like your photoshop */
  align-items: center;

  padding: 24px 16px 110px;
  box-sizing: border-box;
  overflow-y: auto;
}

/* The ONLY place opacity ever becomes 1, and the ONLY transition. Added by JS
   exactly once — after fonts.ready + banner image load + initial
   renderPortalDock() have all completed — for a single clean fade-in. */
.password-screen.ready{
  opacity: 1;
  transition: opacity 180ms ease;
}

/* If screen is small, top-align so it feels like an app and doesn't look cramped */
@media (max-width: 768px){
  .password-screen{
    align-items: flex-start;
    padding-top: 44px;
  }
}

/* optional iOS safe area */
@supports (padding: max(0px)) {
  .password-screen {
    padding-top: max(24px, calc(16px + env(safe-area-inset-top)));
    padding-bottom: max(110px, calc(90px + env(safe-area-inset-bottom)));
  }
  @media (max-width: 768px){
    .password-screen{
      padding-top: max(44px, calc(16px + env(safe-area-inset-top)));
    }
  }
}

/* row becomes just a centered container */
.password-row {
  width: 100%;
  display: flex;
  justify-content: center;
}

/* single centered column with a max width */
.password-box {
  width: min(980px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;

  gap: 14px; /* consistent vertical rhythm */
}

.password-box input {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;
  padding: 8px 12px;
  border: 2px solid black;
  background: white;
  outline: none;
  text-align: center;

  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;

  /* Fixed height so Safari's injected credentials-autofill icon can't
     inflate the input's box and grow .password-box (see icon rule below). */
  height: 44px;
  box-sizing: border-box; /* already global via *, but explicit here too */
  line-height: 1.2;
}

/* Pull Safari's injected password-autofill icon out of the input's normal
   flow so its intrinsic size can never affect the input's rendered height —
   it only overlays the existing box. */
.password-box input::-webkit-credentials-auto-fill-button,
#codeEntry::-webkit-credentials-auto-fill-button {
  position: absolute;
  right: 8px;
  margin: 0;
}
/* =========================
   TOP BANNER (title screen)
   ========================= */
.site-banner{
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;

  /* space between banner and tiles */
  margin: 8px 0 14px;

  /* prevents the banner from stretching too tall */
  flex: 0 0 auto;
}

.site-banner img{
  width: min(980px, 100%);   /* match your content max width */
  height: auto;

  /* keep it from becoming comically huge on wide screens */
  max-height: clamp(96px, 18vw, 200px);

  /* pixel crisp */
  image-rendering: pixelated;
  image-rendering: crisp-edges;

  /* no layout weirdness */
  display: block;
}

/* Optional: a touch more breathing room on mobile */
@media (max-width: 768px){
  .site-banner{
    margin-top: 6px;
    margin-bottom: 12px;
  }
  .site-banner img{
    max-height: clamp(110px, 18vw, 180px);
  }
}

/* fixed slot so nothing shifts */
.action-row {
  width: 140px;
  height: 28px;
  line-height: 28px;
  text-align: center;
  position: relative;
}

/* ===== SMOOTH SWITCHING BASE ===== */
.switch-btn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 24px;

  width: 140px;
  height: 28px;
  line-height: 28px;
  text-align: center;

  padding: 0;
  border: 0;
  background: transparent;
  text-transform: lowercase;
  color: var(--btn);

  position: absolute;
  inset: 0;

  /* smoother on iOS */
  will-change: opacity, transform;
  transform: translate3d(0, 2px, 0);
  opacity: 0;
  pointer-events: none;

  transition:
    opacity 120ms ease,
    transform 180ms cubic-bezier(.2,.9,.2,1);
}

.switch-btn.show {
  opacity: 1;
  pointer-events: auto;
  transform: translate3d(0, 0, 0);
}

.switch-btn:hover { text-decoration: underline; }
/* help button that lives in the action-row slot */
.help-under { z-index: 1; }

/* ENTER button (ONLY submits, never opens cheats) */
.enter-button { z-index: 2; }

/* Crisp "nope" flash */
.enter-button.flash {
  opacity: 1;
  transform: translate3d(0, 0, 0);
  animation: nopePulse 260ms ease both;
}

@keyframes nopePulse {
  0%   { opacity: 1; }
  45%  { opacity: .22; }
  100% { opacity: 1; }
}

/* add to home page button (mobile only) */
.add-home-btn{
  display: none;
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 18px;
  padding: 10px 14px;
  border: 0px solid black;
  background: rgba(255,255,255,0.0);
  color: var(--btn);
  text-transform: lowercase;
  align-self: center;
  margin-top: 10px;
}

@media (max-width: 768px){
  .add-home-btn{ display: inline-block; }
}

.add-home-btn:hover{ text-decoration: underline; }


/* ===== overlays ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.panel {
  width: min(640px, calc(100vw - 24px));
  border: 2px solid black;
  padding: 16px;
  background: rgba(255,255,255,0.85);
  text-align: center;
  position: relative;
}

.panel-title {
  font-size: 30px;
  margin-bottom: 10px;
  text-transform: lowercase;
}

.panel-sub {
  font-size: 18px;
  margin-bottom: 12px;
}

/* footer row */
.panel-footer {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.linkish {
  font-family: "RuneScape UF", Arial, sans-serif;
  background: transparent;
  border: none;
  color: var(--btn);
  font-size: 22px;
  padding: 0;
  text-transform: lowercase;
  cursor: url("../images/cursor/cursor-hover.png"), pointer;
}
.linkish:hover { text-decoration: underline; }

.footer-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* boxed buttons */
.boxbtn {
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 20px;
  padding: 8px 14px;
  border: 2px solid black;
  background: white;
  text-transform: lowercase;
  color: var(--btn);
  cursor: url("../images/cursor/cursor-hover.png"), pointer;
}

/* cheat entry UI */
.cheat-seq {
  font-size: 18px;
  border: 2px solid black;
  padding: 10px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.cheat-grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  justify-items: center;
}

.cheat-btn {
  width: 100%;
  font-family: "RuneScape UF", Arial, sans-serif;
  font-size: 22px;
  padding: 10px 0;
  border: 2px solid black;
  background: white;
  text-transform: lowercase;
  color: var(--btn);
}

.cheat-actions {
  margin-top: 12px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

/* centered "?" info button under submit row */
.cheat-info-wrap {
  margin-top: 10px;
  display: flex;
  justify-content: center;
}

.cheat-info-q {
  font-family: "RuneScape UF", Arial, sans-serif;
  background: transparent;
  border: none;
  color: var(--btn);
  font-size: 24px;
  padding: 0;
  line-height: 1;
  cursor: url("../images/cursor/cursor-hover.png"), pointer;
}
.cheat-info-q:hover { text-decoration: underline; }

/* unlocked feedback */
.unlock-flash {
  font-size: 20px;
  margin-top: 10px;
  min-height: 22px;
  opacity: 0;
  transition: opacity 0.15s ease;
  text-transform: lowercase;
  color: var(--btn);
}
.unlock-flash.show { opacity: 1; }

/* vault list spaced evenly */
.vault-list {
  border: 2px solid black;
  padding: 18px 14px;
  min-height: 96px;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  font-size: 28px;
  text-transform: lowercase;
  gap: 28px;
}

/* clickable vault items */
.vault-item {
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
  color: var(--btn);
  text-transform: lowercase;
}
button.vault-item:hover { text-decoration: underline; }

/* MINI POPUP */
.mini-overlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}

.mini-panel {
  width: min(520px, calc(100vw - 24px));
  border: 2px solid black;
  padding: 14px;
  background: white;
  text-align: center;
}

.mini-title {
  font-size: 26px;
  margin-bottom: 8px;
  text-transform: lowercase;
}

.mini-body {
  font-size: 18px;
  line-height: 1.35;
  text-transform: lowercase;
  margin-bottom: 12px;
}

.mini-body .code-line {
  display: block;
  margin: 6px 0;
}

/* Add-to-home panel visuals */
.home-steps {
  font-size: 18px;
  text-transform: lowercase;
  line-height: 1.4;
}
.home-step {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 8px 0;
  flex-wrap: wrap;
}
.share-icon {
  width: 22px;
  height: 22px;
  display: inline-block;
  vertical-align: middle;
}

/* CONTENT PAGE */
.content-page {
  display: none;
  width: 100%;
  height: 100vh;
  height: 100svh;
  height: 100dvh;
  background: transparent;
}

.content-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* VIDEO */
.video-wrapper {
  position: relative;
  width: 100%;
  max-width: 854px;
  aspect-ratio: 854 / 480;
  background: transparent;
  opacity: 0;
  transition: opacity 1s ease;
  display: none;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

@media (min-width: 1200px) {
  .video-wrapper { max-width: 1000px; }
}

/* MOBILE SCALE OVERRIDE */
@media (max-width: 768px) {
  .video-wrapper.mobile-fill {
    width: 100vw;
    max-width: none;
    height: calc(100vh - 56px);
    aspect-ratio: auto;
  }
}

/* PLAY BUTTON */
.play-button {
  position: absolute;
  top: 43%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 52px;
  color: var(--accent);
  background: transparent;
  border: none;
  text-transform: lowercase;
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 10;
  font-family: "RuneScape UF", Arial, sans-serif;
  pointer-events: none;
}

.play-button.show {
  opacity: 1;
  pointer-events: auto;
}

/* BACK BUTTON (darker + readable on blue bg) */
.back-button{
  position: fixed;
  top: 8px;
  left: 8px;
  font-size: 28px;
  background: transparent !important;
  border: 0 !important;
  padding: 0 !important;

  color: #000;
  font-family: "RuneScape UF", Arial, sans-serif;
  text-transform: lowercase;

  z-index: 10;
}
.back-button:hover{ text-decoration: underline; }


.portal-dock{
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}

@media (max-width: 520px){
  .portal-dock{ grid-template-columns: 1fr; }
}

.portal-tile{
  border: 2px solid black;
  background: white;
  padding: 16px 14px;
  min-height: 76px;

  text-transform: lowercase;
  font-family: "RuneScape UF", Arial, sans-serif;
  color: var(--btn);

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}


.portal-tile:hover{ text-decoration: underline; }

.portal-tile--bg{
  border-color: transparent !important;
  background-color: transparent !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
.portal-tile--bg:hover{
  text-decoration: none !important;
}
.portal-tile--bg:hover .portal-title,
.portal-tile--bg:hover .portal-sub{
  text-decoration: underline;
  text-decoration-color: gold;
}
@media (max-width: 768px){
  .portal-tile--bg:hover .portal-title,
  .portal-tile--bg:hover .portal-sub{
    text-decoration: none;
  }
}
/* .portal-title, .portal-sub { display: none; } */

/* shared typography for all bg buttons */
.portal-tile--bg .portal-title,
.portal-tile--bg .portal-sub{
  font-weight: bold;
  letter-spacing: 0.06em;
  line-height: 1.1;
}

/* =============================================
   MAIN VIEW — BUTTON 1  (creative portfolio)
   ============================================= */
[data-key="home"] .portal-title  { color: #ffcf7a;              /* ← M1 MAIN TEXT COLOUR  */ }
[data-key="home"] .portal-sub    { color: #ffcf7a;              /* ← M1 SUB TEXT COLOUR   */ }
[data-key="home"] .portal-title,
[data-key="home"] .portal-sub    { text-shadow: 1px 1px 0 #7a3800; /* ← M1 SHADOW COLOUR  */ }
/* two-line title — same technique as bag, height stays identical */
[data-key="home"] .portal-left   { gap: 0; }
[data-key="home"] .portal-sub    { font-size: 24px; line-height: 0.9; }

/* =============================================
   MAIN VIEW — BUTTON 2  (games)
   ============================================= */
[data-key="games"] .portal-title { color: rgb(118, 255, 212);                /* ← M2 MAIN TEXT COLOUR  */ }
[data-key="games"] .portal-sub   { color: rgb(118, 255, 212);               /* ← M2 SUB TEXT COLOUR   */ }
[data-key="games"] .portal-title,
[data-key="games"] .portal-sub   { text-shadow: 1px 1px 0 #003d3d; /* ← M2 SHADOW COLOUR  */ }

/* =============================================
   MAIN VIEW — BUTTON 3  (kintsugi)
   ============================================= */
[data-key="mediaplayer"] .portal-title { color: #ffd700;        /* ← M3 MAIN TEXT COLOUR  */ }
[data-key="mediaplayer"] .portal-sub   { color: #ffd700;        /* ← M3 SUB TEXT COLOUR   */ }
[data-key="mediaplayer"] .portal-title,
[data-key="mediaplayer"] .portal-sub   { text-shadow: 1px 1px 0 #5c3800; /* ← M3 SHADOW COLOUR */ }

/* =============================================
   B-SIDES VIEW — BUTTON 2  (games — purple 50.png bg)
   ============================================= */
[data-key="bsides-games"] .portal-title { color: #d4a0ff; }
[data-key="bsides-games"] .portal-sub   { color: #d4a0ff; }
[data-key="bsides-games"] .portal-title,
[data-key="bsides-games"] .portal-sub   { text-shadow: 1px 1px 0 #3d0080; }

/* =============================================
   B-SIDES VIEW — BUTTON 3  (kintsugi — pink 100.png bg)
   ============================================= */
[data-key="bsides-kintsugi"] .portal-title { color: #ffb3d9; }
[data-key="bsides-kintsugi"] .portal-sub   { color: #ffb3d9; }
[data-key="bsides-kintsugi"] .portal-title,
[data-key="bsides-kintsugi"] .portal-sub   { text-shadow: 1px 1px 0 #7a0038; }

/* =============================================
   MAIN VIEW — BUTTON 3  (games/music) — matches main menu palette
   ============================================= */
[data-key="kintsugi"] .portal-title { color: #b4ff6e; }
[data-key="kintsugi"] .portal-sub   { color: #b4ff6e; }
[data-key="kintsugi"] .portal-title,
[data-key="kintsugi"] .portal-sub   { text-shadow: 1px 1px 0 #1a5c00; }

/* =============================================
   GAMES VIEW — BUTTON 1  (put the bag in the bag)
   ============================================= */
[data-key="bag"] .portal-title  { color: #ffb3d9;              /* ← G1 MAIN TEXT COLOUR  */ }
[data-key="bag"] .portal-sub    { color: #ffb3d9;              /* ← G1 SUB TEXT COLOUR   */ }
[data-key="bag"] .portal-title,
[data-key="bag"] .portal-sub    { text-shadow: 1px 1px 0 #7a0038; /* ← G1 SHADOW COLOUR   */ }
/* sub row at title size — gap:0 + line-height:0.9 keeps total height identical */
[data-key="bag"] .portal-left   { gap: 0; }
[data-key="bag"] .portal-sub    { font-size: 24px; line-height: 0.9; }

/* =============================================
   GAMES VIEW — BUTTON 2  (1millionfrogs)
   ============================================= */
[data-key="1millionfrogs"] .portal-title { color: #d4a0ff;                  /* ← G2 MAIN TEXT COLOUR  */ }
[data-key="1millionfrogs"] .portal-sub   { color: #d4a0ff;                  /* ← G2 SUB TEXT COLOUR   */ }
[data-key="1millionfrogs"] .portal-title,
[data-key="1millionfrogs"] .portal-sub   { text-shadow: 1px 1px 0 #3d0080; /* ← G2 SHADOW COLOUR */ }

/* =============================================
   GAMES VIEW — BUTTON 3  (main menu)
   ============================================= */
[data-key="mainmenu"] .portal-title { color: #b4ff6e;            /* ← G3 MAIN TEXT COLOUR  */ }
[data-key="mainmenu"] .portal-sub   { color: #b4ff6e;            /* ← G3 SUB TEXT COLOUR   */ }
[data-key="mainmenu"] .portal-title,
[data-key="mainmenu"] .portal-sub   { text-shadow: 1px 1px 0 #1a5c00; /* ← G3 SHADOW COLOUR */ }


.portal-left{
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.portal-title{
  font-size: 24px;
  line-height: 1;
  white-space: nowrap;
  overflow: visible;
}

.portal-sub{
  font-size: 16px;
  opacity: 0.85;
  line-height: 1.1;
}

.portal-right{
  font-size: 22px;
  opacity: 0.9;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  position: relative;
  z-index: 0;
}

.portal-sprite{
  width: 36px;
  height: 36px;
  object-fit: contain;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.portal-sprite-gif{
  width: 36px;
  height: 36px;
  object-fit: contain;
  filter: brightness(1.4) saturate(1.4);
  transform: translateX(-6px) scale(1.8);
}

.portal-sprite-gif-brain{
  transform: translateX(-4px) scale(1.65);
}

/* =========================================================
   HOMEPAGE TEASER PLAYER  (additive + isolated — ts- prefix)
   - play/pause button = FIRST child of .hint-row.
   - DESKTOP: button + hint text sit centred together on one line,
     button immediately LEFT of the word "hint:". (.portal-hint is
     nudged to width:auto only so the pair centres as a group — the
     hint is a single non-wrapping line on desktop, so its text is
     unchanged.)
   - MOBILE: the hint text is left completely untouched (byte-for-
     byte the backup → its exact original 2-line wrap). The button
     is lifted OUT of flow with position:absolute into the empty
     space to the RIGHT of the hint text, vertically centred and
     clickable (z-index + pointer-events explicit).
   - fixed glass mini-player bar (desktop + mobile)
   ========================================================= */

.ts-hint-play{
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  border: 0;
  padding: 0;
  line-height: 0;
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;                 /* never compress the button */
  margin: 0;
  cursor: url("../images/cursor/cursor-hover.png"), pointer;
}
.ts-hint-play img{
  width: 22px;
  height: 22px;
  display: block;
  object-fit: contain;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.ts-hint-play:hover{ opacity: 0.6; }

/* Deterministic line break after "passwords" (via <br class="ts-hint-br">):
   hidden on desktop so the hint stays the approved single line; active on
   mobile so it ALWAYS breaks "hint: find hidden passwords" / "around the
   site..." regardless of screen width. */
@media (min-width: 769px){ .ts-hint-br{ display: none; } }

/* DESKTOP: centre button + hint together, button just left of "hint:" */
@media (min-width: 769px){
  #passwordForm .hint-row{ align-items: center; }
  /* width:auto lets the single-line hint shrink to its text so the pair
     centres as a group; text content/one-line wrapping is unchanged */
  #passwordForm .hint-row .portal-hint{ width: auto; }
  #passwordForm .hint-row .ts-hint-play{ margin-right: 14px; }
}

/* MOBILE: hint spans the FULL row width so "hint: find hidden passwords" fits
   on line 1 (the <br> then forces the break). The row is click-through so the
   enter/secret controls sharing the bottom row stay tappable; only the play
   button is interactive. The button sits fixed in the open space to the right. */
@media (max-width: 768px){
  #passwordForm .hint-row{
    position: relative;
    grid-column: 1 / -1;          /* full width instead of stopping at the action column */
    pointer-events: none;
  }
  #passwordForm .hint-row .portal-hint{ pointer-events: none; }
  #passwordForm .hint-row .ts-hint-play{
    position: absolute;
    right: 9%;                    /* in the open space to the right of the text */
    top: 50%;
    transform: translateY(-50%);
    margin: 0;
    padding: 6px;                 /* comfortable tap target */
    z-index: 3;
    pointer-events: auto;
  }
}

/* ===== MINI PLAYER BAR (shown on desktop AND mobile when playing) ===== */
.ts-miniplayer{
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translate(-50%, 160%);   /* parked below the fold until shown */
  z-index: 9000;
  width: min(560px, calc(100vw - 32px));
  opacity: 0;
  pointer-events: none;
  transition:
    transform 320ms cubic-bezier(.2,.9,.2,1),
    opacity 260ms ease;
}
.ts-miniplayer.show{
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
}

/* mobile: keep the whole row inside the bar — every flex item may shrink
   (min-width:0), the scrubber absorbs the slack, and the time no longer holds
   a wide floor, so nothing spills past the pixel border. */
@media (max-width: 768px){
  .ts-miniplayer{ bottom: 12px; width: min(560px, calc(100vw - 24px)); }
  .ts-mini-panel{

/* pixel/glass box — stepped 8-bit corners (from lifemaxxing.html) */
.ts-pixel-box{
  position: relative;
  isolation: isolate;
  border-radius: 0;
}
.ts-pixel-box::before,
.ts-pixel-box::after{
  content: "";
  position: absolute;
  pointer-events: none;
  clip-path: polygon(
    10px 0, calc(100% - 10px) 0,
    calc(100% - 10px) 5px, calc(100% - 5px) 5px, calc(100% - 5px) 10px, 100% 10px,
    100% calc(100% - 10px), calc(100% - 5px) calc(100% - 10px),
    calc(100% - 5px) calc(100% - 5px), calc(100% - 10px) calc(100% - 5px), calc(100% - 10px) 100%,
    10px 100%, 10px calc(100% - 5px), 5px calc(100% - 5px), 5px calc(100% - 10px), 0 calc(100% - 10px),
    0 10px, 5px 10px, 5px 5px, 10px 5px
  );
}
.ts-pixel-box::before{
  inset: -2px;
  background: rgba(0, 0, 0, 0.42);
  z-index: -2;
}
.ts-pixel-box::after{
  inset: 0;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
  z-index: -1;
}

/* ===========================
   SFX (more iOS-proof + lower latency)
   - WebAudio when possible
   - pooled <audio> fallback (important for iOS latency)
   - primes/unlocks on first gesture
=========================== */
const SFX = (() => {
  const paths = {
    click:   "sounds/click.mp3",
    password:"sounds/password.mp3",
    correct: "sounds/correct.mp3"
  };

  const volumes = { click: 0.55, password: 0.75, correct: 0.75 };

  let ctx = null;
  let master = null;
  let unlocked = false;
  let heartbeatTimer = null;

  const fetched = new Map();   // name -> ArrayBuffer
  const buffers = new Map();   // name -> AudioBuffer

  // pooled HTMLAudio fallback
  const pools = new Map();     // name -> { els: HTMLAudioElement[], i: number }
  const POOL_SIZES = { click: 8, password: 3, correct: 3 };

  function ensurePool(name) {
    if (pools.has(name)) return pools.get(name);

    const n = POOL_SIZES[name] ?? 3;
    const els = Array.from({ length: n }, () => {
      const a = new Audio(paths[name]);
      a.preload = "auto";
      a.volume = volumes[name] ?? 1;
      return a;
    });

    const obj = { els, i: 0 };
    pools.set(name, obj);
    return obj;
  }

  // Pre-build all pools immediately — no gesture needed.
  // This lets iOS start buffering the audio files right away.
  for (const n of Object.keys(paths)) ensurePool(n);

  function playFromPool(name) {
    const pool = ensurePool(name);
    const a = pool.els[pool.i];
    pool.i = (pool.i + 1) % pool.els.length;

    try {
      a.pause();
      a.currentTime = 0;
      const p = a.play();
      if (p && typeof p.catch === "function") p.catch(() => {});
    } catch {}
  }

  async function fetchAll() {
    await Promise.all(Object.keys(paths).map(async (name) => {
      try {
        const res = await fetch(paths[name], { cache: "force-cache" });
        const arr = await res.arrayBuffer();
        fetched.set(name, arr);
      } catch {
        ensurePool(name);
      }
    }));
  }

  function ensureContext() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 1;
    master.connect(ctx.destination);
    return ctx;
  }

  // Plays a silent node every 25 s to stop iOS suspending the context.
  function startHeartbeat() {
    if (heartbeatTimer) return;
    heartbeatTimer = setInterval(() => {
      if (!ctx || !master || ctx.state !== "running") return;
      try {
        const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(master);
        src.start(0);
      } catch {}
    }, 25000);
  }

  async function decodeAllIfPossible() {
    if (!ctx) return;

    if (ctx.state === "suspended") {
      try { await ctx.resume(); } catch {}
    }

    for (const name of Object.keys(paths)) {
      if (buffers.has(name)) continue;
      const arr = fetched.get(name);
      if (!arr) continue;

      try {
        const buf = await ctx.decodeAudioData(arr.slice(0));
        buffers.set(name, buf);
      } catch {
        ensurePool(name);
      }
    }
  }

  // call inside a user gesture
  async function unlockNow() {
    if (unlocked) return;
    unlocked = true;

    ensureContext();

    await decodeAllIfPossible();

    // iOS warm-up blip
    if (ctx && master && ctx.state === "running") {
      try {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        g.gain.value = 0.0001;
        osc.connect(g);
        g.connect(master);
        osc.start();
        osc.stop(ctx.currentTime + 0.01);
      } catch {}
    }

    startHeartbeat();
  }

  function playWebAudio(name) {
    if (!ctx || !master) return false;
    const buf = buffers.get(name);
    if (!buf) return false;

    try {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = volumes[name] ?? 1;
      src.connect(g);
      g.connect(master);
      src.start(0);
      return true;
    } catch {
      return false;
    }
  }

  function play(name) {
    // If the context got suspended (e.g. iOS backgrounded the page),
    // kick a synchronous resume before attempting to play.
    if (ctx && ctx.state === "suspended") {
      ctx.resume().catch(() => {});
    }
    const ok = playWebAudio(name);
    if (!ok) playFromPool(name);
  }

  // Returns the duration of a decoded sound in ms, or a fallback.
  function getDuration(name, fallback = 400) {
    const buf = buffers.get(name);
    return buf ? Math.ceil(buf.duration * 1000) : fallback;
  }

  // Resume context the instant the page becomes visible again.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && ctx && ctx.state === "suspended") {
      ctx.resume().catch(() => {});
    }
  });

  // start fetching early
  fetchAll();

  const primeHandler = () => { unlockNow(); };
  window.addEventListener("touchstart", primeHandler, { capture: true, once: true });
  window.addEventListener("pointerdown", primeHandler, { capture: true, once: true });
  window.addEventListener("keydown", primeHandler, { capture: true, once: true });

  return { play, getDuration, unlockNow };
})();

/* ===========================
   GLOBAL CLICK SFX
   - add to home button, home overlay close
   - cheat/vault/mini overlay buttons EXCEPT .cheat-btn (dpad + a/b)
   - vault-item passwords keep their own password.mp3 (excluded here)
   - secret button handled separately (uses pointerdown)
   - portal tiles are silent
=========================== */
(function setupClickSfx() {
  let lastAt = 0;

  function shouldPlayClick(btn) {
    if (!btn || btn.disabled) return false;

    // add to home button
    if (btn.id === "addHomeBtn") return true;

    // home overlay close button
    if (btn.id === "homeClose") return true;

    // cheat overlay buttons — EXCEPT the d-pad/a/b entry buttons
    if (btn.closest("#cheatOverlay")) {
      if (btn.classList.contains("cheat-btn")) return false; // arrows + a + b = silent
      return true; // clear, submit, cheatcodes, code vault, close
    }

    // vault overlay — EXCEPT vault-item passwords (those play password.mp3)
    if (btn.closest("#vaultOverlay")) {
      if (btn.classList.contains("vault-item")) return false;
      return true; // back, close
    }

    // mini overlay (cheatcodes list close)
    if (btn.closest("#miniOverlay")) return true;

    return false;
  }

  function handler(e) {
    const btn = e.target.closest("button");
    if (!shouldPlayClick(btn)) return;

    const now = performance.now();
    if (now - lastAt < 120) return;
    lastAt = now;

    SFX.unlockNow();
    SFX.play("click");
  }

  document.addEventListener("click", handler, true);
})();

/* Preload every unique tile bgImage/sprite across all views so switching
   between main / games / bsides paints from cache with no pop-in. Runs once,
   in the background, and never throws or blocks if an image fails to load. */
let _dockImagesPreloaded = false;
function preloadDockImages() {
  if (_dockImagesPreloaded) return;
  _dockImagesPreloaded = true;
  try {
    const urls = new Set();
    for (const view of Object.values(DOCK_VIEWS)) {
      for (const item of view) {
        if (item.bgImage) urls.add(item.bgImage);
        if (item.sprite)  urls.add(item.sprite);

    }
    for (const url of urls) {
      const img = new Image();
      img.decoding = "async";
      img.src = url; // fetch into cache; failures are ignored
    }
  } catch {}
}

/* =========================================================
   REVEAL GATING — hold .password-screen invisible until the
   webfont, the banner image and the portal tiles are all
   ready, then fade the fully-sized box in once (no reflow).
   ========================================================= */
function whenPasswordReady(done) {
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    clearTimeout(safety);
    done();
  };

  // Safety net so the UI never hangs forever if a font/image never resolves,
  // and the fallback path for browsers without the Font Loading API.
  const safety = setTimeout(finish, 800);

  // 1) Webfont loaded (feature-detected; falls back to the safety timeout).
  const fontsReady = (document.fonts && document.fonts.ready)
    ? document.fonts.ready.catch(() => {})
    : Promise.resolve();

  // 2) Banner image has loaded (or errored) — no fixed timeout.
  const bannerImg = passwordScreen.querySelector(".site-banner img");
  const imgReady = new Promise((resolve) => {
    if (!bannerImg || bannerImg.complete) return resolve();
    const onDone = () => {
      bannerImg.removeEventListener("load", onDone);
      bannerImg.removeEventListener("error", onDone);
      resolve();
    };
    bannerImg.addEventListener("load", onDone);
    bannerImg.addEventListener("error", onDone);
  });

  // 3) renderPortalDock() has already run synchronously above, so the tiles
  //    are attached before we wait on the async conditions.
  Promise.all([fontsReady, imgReady]).then(finish);
}

function revealPasswordScreen() {
  // The single, canonical "become visible" step: base state is opacity:0 with
  // no transition, so adding .ready fades the fully-sized layout in exactly
  // once. Any inline opacity from the content-view fade is cleared so the
  // class governs. This is the ONLY code that makes the screen visible.
  passwordScreen.style.opacity = "";
  passwordScreen.classList.add("ready");
  requestAnimationFrame(() => {
    // Only after the first view is visible, warm the cache for the other
    // views' tile images so viewSwitch clicks paint instantly.
    preloadDockImages();
    passwordInput.focus();
  });
  // Lock the box's rendered size AFTER it has settled at its final size —
  // the delay also gives Safari's autofill-icon injection time to happen
  // first, so we lock the size after the icon appears, not before.
  setTimeout(lockBoxSize, 250);
}

whenPasswordReady(revealPasswordScreen);

// ── Lock .password-box outer size (immovable after first reveal) ────────────
// Once revealed, measure the box's real rendered size and pin it as inline
// width/height with overflow:hidden, so nothing inside it (Safari's autofill
// icon, etc.) can ever grow the outer boundary. Only recalculated on a genuine
// window resize, so responsive breakpoints still work.
let resizeTimer = null;
let allowResize = false;
let lockedW = 0, lockedH = 0;

function lockBoxSize() {
  const box = document.querySelector('.password-box');
  if (!box) return;
  // Clear any existing lock first so we measure natural content size.
  box.style.width  = '';
  box.style.height = '';
  // Force a layout read to get the true natural size at this viewport.
  const rect = box.getBoundingClientRect();
  lockedW = rect.width;
  lockedH = rect.height;
  box.style.width    = lockedW + 'px';
  box.style.height   = lockedH + 'px';
  box.style.overflow = 'hidden'; // contain anything that would push past the lock
}

// Hard backstop: if the box is ever caught rendering at a size other than the
// lock (outside of a genuine, allowed window resize), immediately re-clamp it.
const boxObserver = new ResizeObserver(function () {
  if (allowResize) return;
  // Nothing to clamp to until the first lock has established a size.
  if (!lockedW && !lockedH) return;
  const box = document.querySelector('.password-box');
  if (!box) return;
  const rect = box.getBoundingClientRect();
  if (Math.abs(rect.width - lockedW) > 0.5 || Math.abs(rect.height - lockedH) > 0.5) {
    box.style.width  = lockedW + 'px';
    box.style.height = lockedH + 'px';
  }
});

// Watch from the start (set up once at page init, not inside reveal-gating).
const boxEl = document.querySelector('.password-box');
if (boxEl) boxObserver.observe(boxEl);

// Re-lock on genuine window resize (debounced) so breakpoints still work; the
// allowResize flag lets that one legitimate resize through the observer.
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  allowResize = true;
  resizeTimer = setTimeout(function () {
    lockBoxSize();
    allowResize = false;
  }, 200);
});

/**
 * Cheat sequences -> unlocks.
 * Tokens: U D L R A B
 */
const cheatUnlocks = {
  "U U D D L R L R B A": ["heavychest"],
  "U D U D A B": ["wasted"],
  "B A L D": ["gambosi"]
};

// ===== unlock storage =====
const UNLOCK_KEY = "portal_unlocked_codes_v1";

function loadUnlockedSet() {
  try {
    const raw = localStorage.getItem(UNLOCK_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(arr) ? arr : []);
  } catch {
    return new Set();
  }
}

function saveUnlockedSet(set) {
  try { localStorage.setItem(UNLOCK_KEY, JSON.stringify([...set])); } catch {}
}

let unlocked = loadUnlockedSet();

// ===== state for showing cheat access =====
let hasWrongAttempt = false;

// ===== overlays =====
function hideUnlockFlash() {
  unlockFlash.textContent = "";
  unlockFlash.classList.remove("show");
  clearTimeout(hideUnlockFlash._t);
}
function showUnlockFlash(text) {

  unlockFlash.classList.add("show");

// close when clicking outside panels
cheatOverlay.addEventListener("pointerdown", (e) => { if (e.target === cheatOverlay) closeAllOverlays(); });
vaultOverlay.addEventListener("pointerdown", (e) => { if (e.target === vaultOverlay) closeAllOverlays(); });
miniOverlay.addEventListener("pointerdown", (e) => { if (e.target === miniOverlay) closeMini(); });
homeOverlay.addEventListener("pointerdown", (e) => { if (e.target === homeOverlay) closeAllOverlays(); });

// ===== shared action runner =====
function runActionByKey(keyRaw) {
  const key = (keyRaw || "").toLowerCase().trim();
  const action = actions[key];
  // ===== STRAIGHT REDIRECT (no play screen) =====
if (action.redirect && action.useGate === false) {
  const sameTab = action.sameTab !== false;

  if (sameTab) {
    document.body.style.transition = 'opacity 0.4s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = action.redirect; }, 400);
  } else {
    window.open(action.redirect, "_blank");
  }
  return;
}

  if (!action) return;

  passwordInput.disabled = true;
  closeAllOverlays();

  currentAction = action;

  // fade out password screen (same as videos)
  passwordScreen.style.opacity = 0;
  setTimeout(() => (passwordScreen.style.display = "none"), 400);

  // show experience page for ALL actions
  contentPage.style.display = "block";
  backButton.classList.add("show");

  // for redirects, we don't need the video UI
  videoWrapper.style.display = "none";
  videoWrapper.style.opacity = 0;
  videoWrapper.classList.remove("mobile-fill");

  playButton.classList.add("show");
  playButton.onclick = () => {
    playButton.classList.remove("show");

    // === REDIRECT ACTION ===
    if (currentAction.redirect) {
      const sameTab = currentAction.sameTab !== false;

      if (sameTab) {
        // same-tab navigation AFTER play
        window.location.href = currentAction.redirect;
      } else {
        // new tab, then return to password UI
        window.open(currentAction.redirect, "_blank");
        resetToPassword();
      }
      return;
    }

    // === VIDEO ACTION (existing behavior) ===
    videoWrapper.style.display = "block";
    videoWrapper.style.opacity = 0;

    if (currentAction.mobileFill) videoWrapper.classList.add("mobile-fill");
    else videoWrapper.classList.remove("mobile-fill");

    video.src = currentAction.src + "?v=" + Date.now();
    video.currentTime = 0;

    requestAnimationFrame(() => {
      videoWrapper.style.opacity = 1;
      video.play().catch(() => {});
    });

    endedListener = resetToPassword;
    video.addEventListener("ended", endedListener, { once: true });
  };
}


// ===== vault render (clickable) =====
function renderVault() {
  const unlockables = ["gambosi", "wasted", "heavychest"];
  const unlockedNow = unlockables.filter(c => unlocked.has(c));

  if (unlockedNow.length === 0) {
    vaultSub.textContent = "nothing unlocked";
    vaultList.textContent = "—";
    return;
  }

  vaultSub.textContent = "unlocked passcodes:";
  vaultList.innerHTML = "";

  for (const code of unlockedNow) {
    const btn = document.createElement("button");
    btn.className = "vault-item";
    btn.type = "button";
    btn.textContent = code;
    btn.addEventListener("click", () => {
      SFX.play("correct");
      runActionByKey(code);
    });
    vaultList.appendChild(btn);
  }
}

// ===== password flow =====
function resetToPassword() {
  if (endedListener) video.removeEventListener("ended", endedListener);
  video.pause();
  video.removeAttribute("src");
  video.load();

  backButton.classList.remove("show");

  contentPage.style.display = "none";
  passwordScreen.style.display = "flex";
  // Don't set opacity here — the .ready class (still present) is the single
  // authority for visibility. Just clear the inline opacity the content-view
  // fade set, so .ready fades it back in.
  passwordScreen.style.opacity = "";

  videoWrapper.style.display = "none";
  videoWrapper.style.opacity = 0;
  videoWrapper.classList.remove("mobile-fill");

  playButton.classList.remove("show");
  playButton.onclick = null;

  passwordInput.disabled = false;
  passwordInput.value = "";

  hasWrongAttempt = false;
  closeAllOverlays();
  if (portalHint) portalHint.innerHTML = 'hint: find hidden passwords <br class="ts-hint-br">around the site...';

  renderPortalDock((function(){ try { return sessionStorage.getItem("portal_view") || "main"; } catch { return "main"; } })());
  setButtonsForInputState();
  passwordInput.focus();
}

/* BFCache restore */
function hardResetPasswordUI() {
  if (endedListener) video.removeEventListener("ended", endedListener);

  video.pause();
  video.removeAttribute("src");
  video.load();

  currentAction = null;
  endedListener = null;

  contentPage.style.display = "none";
  passwordScreen.style.display = "flex";

  // Re-hide instantly: removing .ready snaps back to the base opacity:0 state,
  // which has NO transition, so there is no visible fade-out. Clear any inline
  // opacity so the base rule governs. The screen becomes visible again only
  // through revealPasswordScreen() once the ready-gate passes.
  passwordScreen.classList.remove("ready");
  passwordScreen.style.opacity = "";

  videoWrapper.style.display = "none";
  videoWrapper.style.opacity = 0;
  videoWrapper.classList.remove("mobile-fill");

  playButton.classList.remove("show");
  playButton.onclick = null;
  backButton.classList.remove("show");

  passwordInput.disabled = false;
  passwordInput.value = "";
  passwordInput.setAttribute("value", "");

  hasWrongAttempt = false;
  closeAllOverlays();

  renderPortalDock((function(){ try { return sessionStorage.getItem("portal_view") || "main"; } catch { return "main"; } })());
  setButtonsForInputState();
  // Same single gate as first load: become visible only when ready.
  // (revealPasswordScreen() also handles focus.)
  whenPasswordReady(revealPasswordScreen);
}

window.addEventListener("pageshow", (e) => {
  // Only re-run the reset + ready-gate on a genuine BFCache restore. On the
  // first (non-persisted) load, the inline ready-gate already handled the
  // single reveal — running it again here would hide-then-reveal and flash.
  if (e.persisted) {
    hardResetPasswordUI();
    // BFCache restore — body opacity may have been faded out before navigating away
    document.body.style.transition = 'none';
    document.body.style.opacity = '1';
  }
});
window.addEventListener("pagehide", () => { passwordInput.disabled = false; });

backButton.onclick = () => { SFX.play("click"); resetToPassword(); };

function setButtonsForInputState() {
  const hasText = passwordInput.value.length > 0;

  if (hasText && !enterLock) enterButton.classList.add("show");
  else enterButton.classList.remove("show");

  // Show cheat "?" ONLY after first wrong attempt and only when input is empty
  const cheatShouldShow = !hasText && !enterLock && hasWrongAttempt;

  if (hintHelp) {
    if (cheatShouldShow) hintHelp.classList.add("show");
    else hintHelp.classList.remove("show");
  }
}

if (hintHelp) {
  hintHelp.addEventListener("pointerdown", (e) => {
    if (!hintHelp.classList.contains("show")) return;
    e.preventDefault();
    SFX.unlockNow();
    SFX.play("click");

    openCheatOverlay();

  hintHelp.addEventListener("click", (e) => {
    if (!hintHelp.classList.contains("show")) return;
    e.preventDefault();
    try { passwordInput.blur(); } catch {}
    openCheatOverlay();
  });
}


// ===== enter flash ("nope") =====
let enterFlashTimer = null;
let enterLock = false;

function flashNope(ms = 520) {
  clearTimeout(enterFlashTimer);
  enterLock = true;

  enterButton.textContent = "nope";
  enterButton.classList.add("show");
  enterButton.classList.add("flash");

  enterFlashTimer = setTimeout(() => {
    enterButton.classList.remove("flash");
    enterButton.textContent = "enter ↵";
    enterLock = false;
    setButtonsForInputState();
  }, ms);
}
function shouldPlayCorrectForAction(action) {
  return !!action; // always allow; navigation happens after Play now
}


function tryPassword() {
  const key = passwordInput.value.toLowerCase().trim();
  const action = actions[key];

  if (!action) {
    SFX.play("password");
    hasWrongAttempt = true;
    passwordInput.value = "";
    flashNope(520);
    if (portalHint) portalHint.innerHTML = 'hint: find hidden passwords <br class="ts-hint-br">around the site...';
    return;
  }

  // noSound: true — skip the correct sfx and redirect immediately
  if (action.noSound) {
    runActionByKey(key);
    return;
  }

  SFX.play("correct");

  // For same-tab direct redirects: fade the page and navigate after exactly
  // as long as the sound lasts — feels instant while the full sound plays out.
  const isSameTabRedirect = action.redirect && action.useGate === false && action.sameTab !== false;
  if (isSameTabRedirect) {
    const delay = SFX.getDuration("correct");
    document.body.style.transition = `opacity ${delay}ms ease`;
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = action.redirect; }, delay);
  } else {
    runActionByKey(key);
  }
}

passwordInput.addEventListener("input", () => { if (!enterLock) setButtonsForInputState(); });
passwordInput.addEventListener("keyup", () => { if (!enterLock) setButtonsForInputState(); });
passwordInput.addEventListener("change", () => { if (!enterLock) setButtonsForInputState(); });
passwordInput.addEventListener("focus", () => { if (!enterLock) setButtonsForInputState(); });

/* SUBMIT: handled via Enter key and button listeners below */

/* Enter key works */
passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (!passwordInput.disabled && passwordInput.value.trim().length > 0) tryPassword();
  }
});

/* iOS: make tapping ENTER always submit before blur */
enterButton.addEventListener("pointerdown", (e) => {
  if (passwordInput.disabled) return;
  if (passwordInput.value.trim().length === 0) return;
  e.preventDefault();
  e.stopPropagation();
  SFX.unlockNow(); // keep within gesture
  tryPassword();
});

passwordScreen.addEventListener("pointerdown", (e) => {
  if (
    e.target === passwordInput ||
    e.target === enterButton ||
    e.target === hintHelp ||
    e.target === addHomeBtn
  ) return;

  if (!passwordInput.disabled && passwordInput.value.trim().length > 0) {
    tryPassword();
  }
});


// ===== navigation =====
cheatToVault.addEventListener("click", () => {
  cheatOverlay.style.display = "none";
  cheatOverlay.setAttribute("aria-hidden", "true");
  openVaultOverlay();
});

cheatClose.addEventListener("click", () => closeAllOverlays());

cheatInfo.addEventListener("click", () => openMini());
miniClose.addEventListener("click", () => closeMini());

vaultBack.addEventListener("click", () => {
  vaultOverlay.style.display = "none";
  vaultOverlay.setAttribute("aria-hidden", "true");
  openCheatOverlay();
});

vaultClose.addEventListener("click", () => closeAllOverlays());

// add-to-home wiring
addHomeBtn.addEventListener("click", () => openHomeOverlay());
homeClose.addEventListener("click", () => closeAllOverlays());

// ===== cheat entry mechanics =====
let cheatTokens = [];

function renderCheatSequence() {
  cheatSequenceEl.textContent = cheatTokens.join(" ");
}

function pushCheatToken(tok) {
  cheatTokens.push(tok);
  if (cheatTokens.length > 16) cheatTokens.shift();
  renderCheatSequence();
}

function clearCheat() {
  cheatTokens = [];
  renderCheatSequence();
}

function submitCheat() {
  const seq = cheatTokens.join(" ").trim();
  const unlockList = cheatUnlocks[seq];

  if (!unlockList || unlockList.length === 0) {
    clearCheat();
    SFX.play("password"); // wrong cheatcode => password.mp3
    showUnlockFlash("nope");
    return;
  }

  // correct cheatcode (even if already unlocked) => correct.mp3
  SFX.play("correct");

  const beforeSize = unlocked.size;

  for (const code of unlockList) {
    if (code === "gambosi" || code === "wasted" || code === "heavychest") unlocked.add(code);
  }
  saveUnlockedSet(unlocked);

  clearCheat();

  if (unlocked.size > beforeSize) showUnlockFlash("unlocked");
  else showUnlockFlash("already unlocked");
}

cheatClear.addEventListener("click", () => clearCheat());
cheatSubmit.addEventListener("click", () => submitCheat());

// tap tokens
cheatOverlay.addEventListener("click", (e) => {
  const btn = e.target.closest(".cheat-btn");
  if (!btn) return;
  pushCheatToken(btn.dataset.token);
});

// keyboard support: arrows + a + b + enter/backspace/escape
document.addEventListener("keydown", (e) => {
  if (miniOverlay.style.display === "flex") {
    if (e.key === "Escape") { e.preventDefault(); closeMini(); }
    return;
  }

  if (cheatOverlay.style.display !== "flex") return;

  if (e.key === "Escape") {
    e.preventDefault();
    closeAllOverlays();
    return;
  }

  if (e.key === "Backspace") {
    e.preventDefault();
    cheatTokens.pop();
    renderCheatSequence();
    return;
  }

  if (e.key === "Enter") {
    e.preventDefault();
    submitCheat();
    return;
  }

  let tok = null;
  if (e.key === "ArrowUp") tok = "U";
  else if (e.key === "ArrowDown") tok = "D";
  else if (e.key === "ArrowLeft") tok = "L";
  else if (e.key === "ArrowRight") tok = "R";
  else if (e.key.toLowerCase() === "a") tok = "A";
  else if (e.key.toLowerCase() === "b") tok = "B";

  if (tok) {
    e.preventDefault();
    pushCheatToken(tok);
  }
});

document.addEventListener("contextmenu", e => e.preventDefault());

// init
setButtonsForInputState();
</script>

     HOMEPAGE TEASER PLAYER  (additive + isolated)
     ========================================================= -->
<div class="ts-miniplayer" id="tsMiniplayer">
  <div class="ts-mini-panel ts-pixel-box" id="tsMiniPanel" role="button" tabindex="0" aria-label="open lifemaxxing">
    <img class="ts-mini-spinner" id="tsMiniSpinner" src="images/chess-spin.gif" alt="">
    <span class="ts-mini-title">lifemaxxing</span>
    <div class="ts-scrub-row">
      <input type="range" id="tsScrub" min="0" max="1" value="0" step="0.001" aria-label="seek">
      <span class="ts-mini-time" id="tsMiniTime">0:00 / 0:00</span>
    </div>
  </div>
</div>

<audio id="tsAudio" src="lifemaxxing/lifemaxxing.mp3" preload="metadata"></audio>

<script>
/* =====================================================================
   HOMEPAGE TEASER PLAYER — self-contained, touches nothing else.
   Inline play/pause button beside the hint + desktop mini bar +
   Media Session (both platforms) + mobile 15s auto-redirect.
   ===================================================================== */
(function(){
  const audio    = document.getElementById("tsAudio");
  const hintBtn  = document.getElementById("tsHintPlay");
  const hintIcon = document.getElementById("tsHintIcon");
  const mini     = document.getElementById("tsMiniplayer");
  const panel    = document.getElementById("tsMiniPanel");
  const scrub    = document.getElementById("tsScrub");
  const timeEl   = document.getElementById("tsMiniTime");
  if (!audio || !hintBtn) return;

  const PLAY_ICON  = "lifemaxxing/play.png";
  const PAUSE_ICON = "lifemaxxing/pause.png";
  const DEST       = "lifemaxxing/lifemaxxing.html";
  const TRACK_TITLE  = "lifemaxxing";
  const TRACK_ARTIST = "inigo365";

  let scrubbing = false;
  let mediaBound = false;

  function fmt(s){
    if (!isFinite(s) || isNaN(s)) return "0:00";
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  function updateTime(){
    timeEl.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
    if (!scrubbing && isFinite(audio.duration) && audio.duration > 0){
      scrub.value = audio.currentTime / audio.duration;
    }
    if ("mediaSession" in navigator && isFinite(audio.duration) && audio.duration > 0){
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate || 1,
          position: audio.currentTime
        });
      } catch (e) {}
    }
  }

  // Media Session on BOTH desktop and mobile (lock-screen controls).
  function bindMedia(){
    if (mediaBound || !("mediaSession" in navigator)) return;
    mediaBound = true;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: TRACK_TITLE, artist: TRACK_ARTIST, album: TRACK_TITLE,
        artwork: [
          { src: "lifemaxxing/lifemaxxing.png", sizes: "96x96",   type: "image/png" },
          { src: "lifemaxxing/lifemaxxing.png", sizes: "192x192", type: "image/png" },
          { src: "lifemaxxing/lifemaxxing.png", sizes: "256x256", type: "image/png" },
          { src: "lifemaxxing/lifemaxxing.png", sizes: "384x384", type: "image/png" },
          { src: "lifemaxxing/lifemaxxing.png", sizes: "512x512", type: "image/png" },
          { src: "lifemaxxing/lifemaxxing.png", sizes: "600x600", type: "image/png" }
        ]
      });
      navigator.mediaSession.setActionHandler("play",  () => audio.play().catch(() => {}));
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("seekto", (d) => {
        if (d.seekTime != null && isFinite(audio.duration)){
          audio.currentTime = Math.min(d.seekTime, audio.duration - 0.1);
          updateTime();
        }
      });
      navigator.mediaSession.setActionHandler("seekbackward", (d) => {
        audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10));
      });
      navigator.mediaSession.setActionHandler("seekforward", (d) => {
        audio.currentTime = Math.min(audio.duration - 0.1, audio.currentTime + (d.seekOffset || 10));
      });
    } catch (e) {}
  }

  function navigateToLife(){
    document.body.style.transition = "opacity 0.4s ease";
    document.body.style.opacity = "0";
    setTimeout(() => { window.location.href = DEST; }, 400);
  }

  function toggle(){
    bindMedia();
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  }

  // Don't let the play button bubble into the password-screen submit handler.
  hintBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  hintBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggle(); });

  audio.addEventListener("play", () => {
    hintIcon.src = PAUSE_ICON;
    hintBtn.setAttribute("aria-label", "pause lifemaxxing");
    mini.classList.add("show");   // shown on desktop AND mobile
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  });
  audio.addEventListener("pause", () => {
    hintIcon.src = PLAY_ICON;
    hintBtn.setAttribute("aria-label", "play lifemaxxing");
    mini.classList.remove("show");
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  });
  audio.addEventListener("ended", () => {
    hintIcon.src = PLAY_ICON;
    hintBtn.setAttribute("aria-label", "play lifemaxxing");
    scrub.value = 0;
    mini.classList.remove("show");
    updateTime();
  });

  audio.addEventListener("loadedmetadata", updateTime);
  audio.addEventListener("timeupdate", updateTime);

  // scrubber — mirrors lifemaxxing.html; stops propagation so seeking on the
  // bar doesn't trigger the navigate-on-click below.
  scrub.addEventListener("pointerdown", (e) => e.stopPropagation());
  scrub.addEventListener("click", (e) => e.stopPropagation());
  scrub.addEventListener("mousedown",  () => { scrubbing = true; });
  scrub.addEventListener("touchstart", () => { scrubbing = true; }, { passive: true });
  scrub.addEventListener("input", () => {
    if (isFinite(audio.duration)){
      audio.currentTime = scrub.value * audio.duration;
      updateTime();
    }
  });
  scrub.addEventListener("mouseup",  () => { scrubbing = false; });
  scrub.addEventListener("touchend", () => { scrubbing = false; }, { passive: true });
  scrub.addEventListener("change",   () => { scrubbing = false; });

  // Clicking the mini bar (desktop) opens the full lifemaxxing player.
  panel.addEventListener("click", navigateToLife);
  panel.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); navigateToLife(); }
  });
})();
</script>

<!-- =========================================================
     BACKGROUND AMBIENCE (additive + isolated)
     Plain <audio>, NOT routed through the SFX Web Audio context,
     so it plays alongside the click/password/correct SFX with no
     conflict. Native loop for a seamless, gap-free loop point.
     ========================================================= -->
<audio id="ambience" loop preload="auto">
  <source src="../sfx/rainforest-loop.mp3" type="audio/mpeg">
  <source src="../sfx/rainforest-loop.ogg" type="audio/ogg">
</audio>

<script>
/* =====================================================================
   BACKGROUND AMBIENCE — self-contained, touches nothing else.
   - starts on the FIRST user gesture (pointerdown / touchstart / keydown),
     listener removed after a single fire
   - fades 0 -> modest ceiling over ~2.5s via native .volume stepping
   - mute toggle persisted in localStorage; if muted, never fades in
     (this visit or future visits) until unmuted
   ===================================================================== */
(function(){
  const amb = document.getElementById("ambience");
  const btn = document.getElementById("ambienceToggle");
  if (!amb || !btn) return;

  const KEY        = "ambience_muted_v1";
  const CEILING    = 0.17;   // background texture, deliberately below the SFX
  const FADE_MS    = 2500;   // gentle initial fade-in
  const DUCK_LEVEL = 0.05;   // faintly audible while something else plays
  const DUCK_MS    = 650;    // quick duck / un-duck ramp

  let muted = false;
  try { muted = localStorage.getItem(KEY) === "1"; } catch (e) {}

  amb.volume = 0;
  let fadeTimer = null;

  function stopFade(){ if (fadeTimer){ clearInterval(fadeTimer); fadeTimer = null; } }

  // Shared volume ramp (setInterval .volume stepping). duration is optional.
  function fadeTo(target, duration){
    stopFade();
    const dur = duration || FADE_MS;
    const start = amb.volume;
    const stepMs = 30;
    const steps = Math.max(1, Math.round(dur / stepMs));
    let i = 0;
    fadeTimer = setInterval(() => {
      i++;
      const t = Math.min(1, i / steps);
      amb.volume = Math.max(0, Math.min(1, start + (target - start) * t));
      if (t >= 1) stopFade();
    }, stepMs);
  }

  // ---- ducking: one set of "reasons"; ambience ducks while ANY is active,
  //      returns to CEILING only when they all clear. Both triggers share it,
  //      so they can't fight or double-apply. ----
  const duckReasons = new Set();
  function targetVolume(){ return duckReasons.size ? DUCK_LEVEL : CEILING; }
  function applyDuck(duration){
    // nothing to ramp if muted or not yet playing (the fade-in will pick the
    // right target when it eventually starts, via startAmbience()).
    if (muted || amb.paused) return;
    fadeTo(targetVolume(), duration || DUCK_MS);
  }
  function setDuck(reason, on){
    if (on) duckReasons.add(reason); else duckReasons.delete(reason);
    applyDuck();
  }

  function startAmbience(){
    if (muted) return;
    if (amb.paused){
      amb.volume = 0;
      const p = amb.play();
      if (p && typeof p.catch === "function") p.catch(() => {}); // silent on block
    }
    // fade in to whatever the current state calls for (full, or ducked if
    // something is already playing / a screen is already open)
    fadeTo(targetVolume(), FADE_MS);
  }

  // Label reflects what you can actually HEAR: "off" until playback truly
  // starts (which can't happen before the first user gesture), "on" once it is.
  function updateBtn(){
    const on = !amb.paused;
    btn.textContent = on ? "♪ on" : "♪ off";
    btn.setAttribute("aria-label", on ? "mute ambience" : "unmute ambience");
    btn.setAttribute("aria-pressed", on ? "false" : "true");
  }
  amb.addEventListener("play",  updateBtn);
  amb.addEventListener("pause", updateBtn);
  updateBtn(); // paused on load -> shows "off"

  // ---- first-gesture gate (single fire, all three listeners removed) ----
  let started = false;
  function removeGesture(){
    document.removeEventListener("pointerdown", onFirstGesture, true);
    document.removeEventListener("touchstart",  onFirstGesture, true);
    document.removeEventListener("keydown",     onFirstGesture, true);
  }
  function onFirstGesture(){
    if (started) return;
    started = true;
    removeGesture();
    startAmbience(); // no-op if muted -> stays "off"
  }
  document.addEventListener("pointerdown", onFirstGesture, true);
  document.addEventListener("touchstart",  onFirstGesture, true);
  document.addEventListener("keydown",     onFirstGesture, true);

  // ---- toggle: acts on the CURRENT audible state, persists the choice ----
  btn.addEventListener("pointerdown", (e) => e.stopPropagation()); // don't trigger password submit
  btn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (!amb.paused){
      // currently playing -> turn OFF
      muted = true;
      stopFade();
      amb.pause();               // fires "pause" -> updateBtn -> "off"
    } else {
      // currently silent -> turn ON (this click is itself a user gesture)
      muted = false;
      started = true;
      removeGesture();
      startAmbience();           // fires "play" -> updateBtn -> "on"
    }
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (e2) {}
    updateBtn();
  });

  // ---- DUCK TRIGGER 1: the lifemaxxing teaser audio (independent element) ----
  const life = document.getElementById("tsAudio");
  if (life){
    life.addEventListener("play",  () => setDuck("life", true));
    life.addEventListener("pause", () => setDuck("life", false));
    life.addEventListener("ended", () => setDuck("life", false));
  }

  // ---- DUCK TRIGGER 2: in-page screen change. runActionByKey() reveals
  //      #contentPage (display:block) on a correct entry; resetToPassword()
  //      hides it again on the way back — watch that inline style flip.
  //      (Passwords that navigate to another URL just unload this page, so
  //      there's nothing to duck for those.) ----
  const contentPage = document.getElementById("contentPage");
  if (contentPage){
    const syncScreenDuck = () => {
      const shown = getComputedStyle(contentPage).display !== "none";
      setDuck("screen", shown);   // duck while the content screen is up; lift on return
    };
    new MutationObserver(syncScreenDuck)
      .observe(contentPage, { attributes: true, attributeFilter: ["style"] });
  }
})();
</script>

</body>
</html>
