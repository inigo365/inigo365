<style>

/* ===================== FONTS ===================== */
@font-face {
  font-family: 'RuneScape';
  src: url('../../fonts/RuneScape-UF.woff2') format('woff2'),
       url('../../fonts/RuneScape-UF.woff') format('woff'),
       url('../../fonts/runescape.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

/* ===================== PAGE TRANSITIONS ===================== */
body { opacity: 0; }

/* ===================== BASE ===================== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: url('assets/background.png') center center / cover no-repeat fixed;
  background-color: #1a1a1a;
  cursor: url('../../images/cursor/cursor.png'), auto;
  /* Prevent iOS callout / blue text-selection highlight during drag */
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  user-select: none;
  /* Prevent all browser-native touch gestures (pan, zoom) at root level */
  touch-action: none;
}

/* Hover cursor on all interactive elements (incl. dynamically-created puzzle pieces) */
button, a, .nokia-key, #nokiaScreen, .pz-piece {
  cursor: url('../../images/cursor/cursor-hover.png'), pointer;
}

/* ===================== PHONE WRAP ===================== */
/* position:fixed creates the containing block for all absolute children.
   width:fit-content shrink-wraps to the #nokiaFrame image size. */
#nokiaPhoneWrap {
  position: fixed;
  top: 53%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: fit-content;
  z-index: 10;
  touch-action: none; /* prevent iOS pinch-zoom on the phone container */
}

/* Phone body image — defines the wrapper's intrinsic size.
   Image is 1364 × 2048 (portrait). On narrow viewports, width is the
   binding constraint: max height = 95vw × (2048/1364) ≈ 95vw × 1.502 */
#nokiaFrame {
  display: block;
  height: min(99vh, 860px, calc(95vw * 1.502));
  width: auto;
  pointer-events: none;
  user-select: none;
}

/* Button label overlay — identical pixel dimensions to nokia3310.png.
   Covers the frame exactly so the printed button graphics align. */
#nokiaButtonOverlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  user-select: none;
}

/* ===================== LCD SCREEN ===================== */
/* Pixel-sampled boundaries from nokia3310.png (1364 × 2048):
     left edge  x ≈ 270 px  →  19.8%
     top edge   y ≈ 390 px  →  19.0%
     right edge x ≈ 1115 px →  81.7%  (width 61.9%)
     bot edge   y ≈ 856 px  →  41.8%  (height 22.8%)         */
#nokiaScreen {
  position: absolute;
  left:   19.8%;
  top:    19.0%;
  width:  61.9%;
  height: 22.8%;
  overflow: hidden;
  z-index: 1;
  box-sizing: border-box;

  /* Classic Nokia LCD — dark base, content sets the look */
  background: #0d0d0d;
  color: #4dff91;
  font-family: 'RuneScape', monospace;
  /* Scale with viewport width so text stays readable on mobile.
     Phone screen width ≈ 61.9% of phone frame ≈ 58.8vw on mobile. */
  font-size: clamp(11px, 3.8vw, 16px);
  letter-spacing: 0.04em;
  line-height: 1.35;
  image-rendering: pixelated;
  touch-action: none;
}

/* ===================== KEYPAD — transparent hit areas ===================== */
/* The keypad div covers the full phone image.
   Each .nokia-key is absolutely positioned over its physical button.
   Coordinates are % of the wrapper (= % of the phone image). */
#nokiaKeypad {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;   /* only the child buttons receive events */
  z-index: 3;
}

.nokia-key {
  position: absolute;
  background: transparent;
  border: none;
  box-shadow: none;
  cursor: url('../../images/cursor/cursor-hover.png'), pointer;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  user-select: none;
  touch-action: manipulation;
  transition: background 0.06s ease;
  outline: none;
}

.nokia-key:active {
  background: rgba(255, 255, 255, 0.10);
}

.nokia-key.deco {
  cursor: url('../../images/cursor/cursor.png'), auto;
  pointer-events: none;
}

/* ===================== NAV AREA ===================== */
/* Pixel-sampled from nokia3310.png — two softkey ovals and round D-pad ring.
   Softkeys:  dark button mass at y ≈ 940–1050 / 2048  (45.9 – 51.3 %)
   D-pad:     dark blue ring  at y ≈ 1080–1235 / 2048  (52.7 – 60.3 %)
              x ≈ 480–880 / 1364                       (35.2 – 64.5 %) */

/* Left softkey — "back / menu" */
.nokia-key[data-action="lsoft"] {
  left: 14.8%;  top: 45.5%;
  width: 14.0%; height: 5.9%;
  border-radius: 40%;
}

/* Right softkey — "select / forward" */
.nokia-key[data-action="rsoft"] {
  left: 71.4%;  top: 45.5%;
  width: 14.0%; height: 5.9%;
  border-radius: 40%;
}

/* D-pad up */
.nokia-key[data-action="up"] {
  left: 37.2%;  top: 52.7%;
  width: 25.0%; height: 2.5%;
  border-radius: 30% 30% 0 0;
}

/* D-pad left */
.nokia-key[data-action="left"] {
  left: 35.2%;  top: 55.0%;
  width:  7.5%; height: 2.9%;
  border-radius: 0;
}

/* Centre / OK button */
.nokia-key[data-action="ok"] {
  left: 42.2%;  top: 54.4%;
  width: 15.2%; height: 3.8%;
  border-radius: 50%;
}

/* D-pad right */
.nokia-key[data-action="right"] {
  left: 57.4%;  top: 55.0%;
  width:  7.5%; height: 2.9%;
  border-radius: 0;
}

/* D-pad down */
.nokia-key[data-action="down"] {
  left: 37.2%;  top: 57.5%;
  width: 25.0%; height: 2.5%;
  border-radius: 0 0 30% 30%;
}

/* ===================== NUMPAD ===================== */
/* Exact same % coordinates as boom2-nokia-backup.html, semantically renamed.
   Source image: nokia3310buttons.png 1364 × 2048 px               */

/* Row 1 — 1 / 2 / 3 */
.nokia-key[data-action="key1"] { left: 16.35%; top: 59.81%; width: 17.96%; height: 5.37%; border-radius: 50%; }
.nokia-key[data-action="key2"] { left: 41.28%; top: 61.08%; width: 19.57%; height: 5.37%; border-radius: 50%; }
.nokia-key[data-action="key3"] { left: 68.18%; top: 59.81%; width: 17.96%; height: 5.37%; border-radius: 50%; }

/* Row 2 — 4 / 5 / 6 */
.nokia-key[data-action="key4"] { left: 17.01%; top: 66.06%; width: 17.96%; height: 5.42%; border-radius: 50%; }
.nokia-key[data-action="key5"] { left: 41.86%; top: 67.92%; width: 18.91%; height: 4.69%; border-radius: 50%; }
.nokia-key[data-action="key6"] { left: 67.52%; top: 66.06%; width: 17.96%; height: 5.42%; border-radius: 50%; }

/* Row 3 — 7 / 8 / 9 */
.nokia-key[data-action="key7"] { left: 17.96%; top: 72.41%; width: 17.96%; height: 5.42%; border-radius: 50%; }
.nokia-key[data-action="key8"] { left: 41.57%; top: 74.27%; width: 19.79%; height: 4.64%; border-radius: 50%; }
.nokia-key[data-action="key9"] { left: 66.57%; top: 72.41%; width: 17.96%; height: 5.42%; border-radius: 50%; }

/* Row 4 — * / 0 / # */
.nokia-key[data-action="star"] { left: 18.70%; top: 78.71%; width: 17.96%; height: 5.42%; border-radius: 50%; }
.nokia-key[data-action="key0"] { left: 41.86%; top: 80.52%; width: 19.43%; height: 4.64%; border-radius: 50%; }
.nokia-key[data-action="hash"] { left: 65.84%; top: 78.71%; width: 17.96%; height: 5.42%; border-radius: 50%; }

/* ===================== RESPONSIVE ===================== */
@media (max-width: 768px) {
  /* slightly smaller than desktop to ensure no clipping on mobile */
  #nokiaFrame { height: min(90vh, 780px, calc(97vw * 1.502)); }
  /* ~20% larger text to stay readable at the reduced size */
  #nokiaScreen { font-size: clamp(11px, 3.8vw, 16px) !important; }
}

#siteBackBtn {

#siteBackBtn:hover { text-decoration: underline; }

<script>
// =====================================================================
//  NOKIA 3310 — SCREEN LOGIC  (Step 3)
// =====================================================================

// ── CONFIG ────────────────────────────────────────────────────────────
const CONFIG = {
  UNLOCK_PIN: "1021",          // CHANGE THIS before going live
  HINT_TEXT: "ENTER PINCODE 2 UNLOCK",            // IDLE SCREEN CRYPTIC HINT
  PIN_HINT:  "",                                              // HINT SHOWN ON PIN SCREEN — edit this
  REVEAL_MESSAGE: "song unlocked!",       // MESSAGE SHOWN AFTER PUZZLE COMPLETE
  ARTIST_NAME: "inigo365",          // YOUR ARTIST NAME
  TRACKS: [
    {
      title: "man of the match",
      audioSrc: "assets/music/man%20of%20the%20match.mp3",
      unlockDate: new Date("2025-01-01"), // SET REAL DATE
      unlockedByPuzzle: true
    }
    // Add future tracks here
  ]
};

// ── DOM refs ──────────────────────────────────────────────────────────
const nokiaKeypad = document.getElementById('nokiaKeypad');
const nokiaScreen = document.getElementById('nokiaScreen');

// ── App state ─────────────────────────────────────────────────────────
let STATE       = 'idle';
let pinBuffer   = '';
const PIN_LENGTH = 4;
let menuIndex   = 0;
let puzzleComplete = false;
let pinUnlocked = false; // true once correct PIN entered this session — resets on page refresh
let audioEl     = null;
let isPlaying   = false;
let revealTimer = null;

// ── Persistence ───────────────────────────────────────────────────────
function loadProgress() {
  puzzleComplete = localStorage.getItem('puzzleComplete') === 'true';
}
function saveProgress() {
  localStorage.setItem('puzzleComplete', 'true');
  puzzleComplete = true;
}

// ── Screen base styles ────────────────────────────────────────────────
function screenBase() {
  nokiaScreen.style.cssText =
    'position:absolute;left:19.8%;top:19.0%;width:61.9%;height:22.8%;' +
    'background:#0d0d0d;color:#4dff91;' +
    'font-family:\'RuneScape\',monospace;' +
    'font-size:clamp(11px,3.8vw,16px);letter-spacing:0.04em;line-height:1.35;' +
    'overflow:hidden;z-index:1;box-sizing:border-box;padding:3% 4%;' +
    'display:flex;flex-direction:column;align-items:center;' +
    'justify-content:center;text-align:center;';
}

// ── Cleanup helpers ───────────────────────────────────────────────────
function clearTimers() {
  if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
}
function stopAudio() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  isPlaying = false;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'none';
    // Clear action handlers so the lock-screen controls vanish cleanly
    ['play','pause','stop'].forEach(a => {
      try { navigator.mediaSession.setActionHandler(a, null); } catch(e) {}
    });
  }
}

// ── CSS animations injected once ──────────────────────────────────────
const _anim = document.createElement('style');
_anim.textContent =
  '@keyframes nokiaShake{' +
    '0%,100%{transform:translateX(0)}' +
    '15%{transform:translateX(-5px)}' +
    '30%{transform:translateX(5px)}' +
    '45%{transform:translateX(-4px)}' +
    '60%{transform:translateX(4px)}' +
    '75%{transform:translateX(-2px)}' +
    '90%{transform:translateX(2px)}' +
  '}' +
  '.nokia-shake{animation:nokiaShake 0.35s ease;}' +
  '@keyframes nokiaProgress{' +
    '0%{left:-35%}100%{left:100%}' +
  '}';
document.head.appendChild(_anim);

// =====================================================================
//  STATE 1 — IDLE / LOCK SCREEN
// =====================================================================
function renderIdle() {
  clearTimers();
  stopAudio();
  STATE = 'idle';
  screenBase();
  nokiaScreen.innerHTML =
    '<div style="opacity:0.9;font-size:0.9em;line-height:1.55;padding:0 4px;white-space:nowrap">' +
      CONFIG.HINT_TEXT +
    '</div>' +
    '<div style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);' +
      'opacity:0.45;font-size:0.65em;white-space:nowrap">[* back]</div>';
}

// =====================================================================
//  STATE 2 — PIN ENTRY
// =====================================================================
function renderPin(shake) {
  STATE = 'pin';
  screenBase();
  const dots = Array.from({ length: PIN_LENGTH }, (_, i) =>
    i < pinBuffer.length ? '●' : '○'
  ).join(' ');
  nokiaScreen.innerHTML =
    '<div style="opacity:0.45;font-size:0.75em;margin-bottom:6px">ENTER PIN</div>' +
    '<div style="font-size:1.2em;letter-spacing:0.18em">' + dots + '</div>';
  if (shake) {
    nokiaScreen.classList.remove('nokia-shake');
    void nokiaScreen.offsetWidth; // force reflow
    nokiaScreen.classList.add('nokia-shake');
    setTimeout(() => nokiaScreen.classList.remove('nokia-shake'), 400);
  }
}

function handlePin(action) {
  if (action === 'lsoft') { pinBuffer = ''; renderIdle(); return; }
  const NUM = {
    key0:'0',key1:'1',key2:'2',key3:'3',key4:'4',
    key5:'5',key6:'6',key7:'7',key8:'8',key9:'9'
  };
  const n = NUM[action];
  if (n === undefined || pinBuffer.length >= PIN_LENGTH) return;
  pinBuffer += n;
  renderPin(false);
  if (pinBuffer.length === PIN_LENGTH) {
    setTimeout(() => {
      if (pinBuffer === CONFIG.UNLOCK_PIN) {
        pinBuffer = '';
        pinUnlocked = true;
        sfxPlay('ringtone');
        renderMenu();
      } else {
        pinBuffer = '';
        sfxPlay('password');
        renderPin(true);
      }
    }, 200);
  }
}

// =====================================================================
//  STATE 3 — MAIN MENU
// =====================================================================
function renderMenu() {
  clearTimers();
  STATE = 'menu';
  screenBase();
  const items = [
    { label: 'PUZZLE', enabled: true }
  ];
  let html =
    '<div style="opacity:0.4;font-size:0.7em;margin-bottom:5px">MENU</div>';
  items.forEach((item, i) => {
    const sel    = i === menuIndex;
    const dimmed = !item.enabled;
    html +=
      '<div class="m-item" data-mi="' + i + '" style="' +
        'align-self:flex-start;width:100%;' +
        'cursor:' + (item.enabled ? 'pointer' : 'default') + ';' +
        (dimmed ? 'opacity:0.3;' : '') +
        (sel    ? 'font-weight:bold;' : '') +
        'margin:1px 0">' +
        (sel ? '► ' : '  ') + item.label +
      '</div>';
  });
  html += '<div style="opacity:0.35;font-size:0.6em;margin-top:5px">[0] SELECT  [*] BACK</div>';
  html += '<div style="opacity:0.35;font-size:0.6em;margin-top:3px">album coming soon</div>';
  nokiaScreen.innerHTML = html;
  // Direct item clicks (stopPropagation prevents screen handler)
  nokiaScreen.querySelectorAll('.m-item').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      menuIndex = +el.dataset.mi;
      selectMenuItem();
    });
  });
}

function handleMenu(action) {
  if (action === 'up')   { menuIndex = Math.max(0, menuIndex - 1); renderMenu(); return; }
  if (action === 'down') { menuIndex = 0; renderMenu(); return; }  // wraps so # cycles
  if (action === 'ok' || action === 'rsoft' || action === 'screen') { selectMenuItem(); return; }
  if (action === 'lsoft') { if (!pinUnlocked) { menuIndex = 0; renderIdle(); } return; }
}

function selectMenuItem() {
  if (menuIndex === 0) { renderPuzzleIntro(); return; }
}

// =====================================================================
//  STATE 4a — PUZZLE INTRO (typewriter before puzzle starts)
// =====================================================================
function renderPuzzleIntro() {
  clearTimers();
  STATE = 'puzzleintro';
  screenBase();
  nokiaScreen.innerHTML =
    '<div id="piTxt" style="font-size:0.9em;line-height:1.45;padding:0 2px;white-space:nowrap"></div>';
  const el  = nokiaScreen.querySelector('#piTxt');
  const msg = 'drag the pieces into place...';
  let i = 0;
  (function tick() {
    if (i <= msg.length) {
      el.textContent = msg.slice(0, i++);
      revealTimer = setTimeout(tick, 38); // ← TYPING SPEED in ms per character (lower = faster)
    } else {
      revealTimer = setTimeout(renderPuzzle, 900);
    }
  })();
}

// =====================================================================
//  STATE 4 — PUZZLE  (brain fragment drag-and-drop)
// =====================================================================

let _pzDrag  = null; // { piece, origLeft, origTop, startX, startY }
let _pzZTop  = 20;   // monotonically increasing z-index — ensures last-touched piece is always topmost
let _pzMasks = new Array(6).fill(null); // per-piece alpha masks for pixel-accurate hit testing

function renderPuzzle() {
  clearTimers();
  STATE = 'puzzle';
  _pzDrag = null;
  _pzZTop = 20;

  const sw = nokiaScreen.offsetWidth;
  const sh = nokiaScreen.offsetHeight;
  const scale = Math.min(sw / 600, sh / 400) * 0.9;
  const cw    = 600 * scale;
  const ch    = 400 * scale;
  const offX  = Math.round((sw - cw) / 2);
  const offY  = Math.round((sh - ch) / 2);

  // Screen edges expressed in canvas-coordinate space
  const edgeL = -offX / scale;
  const edgeR = (sw - offX) / scale;
  const edgeT = -offY / scale;
  const edgeB = (sh - offY) / scale;

  // Use the image bounding-box centre (300, 200) for every piece — guarantees
  // identical scatter positions on file://, HTTP and mobile (no pixel sampling).
  var imgData = [0,1,2,3,4,5].map(function() { return { cx: 300, cy: 200 }; });
  _pzFinishBuild(imgData, sw, sh, offX, offY, scale, edgeL, edgeR, edgeT, edgeB);
}

// Loads per-piece alpha masks for pixel-accurate click detection.
// Uses crossOrigin="anonymous" so it works on HTTP/HTTPS (e.g. GitHub Pages).
// Silently falls back to bounding-box selection on file:// (canvas taint) — no user impact.
function _pzLoadMasks() {
  _pzMasks = new Array(6).fill(null);
  for (var _mi = 0; _mi < 6; _mi++) {
    (function(idx) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        try {
          var cv  = document.createElement('canvas');
          cv.width = 600; cv.height = 400;
          var c2d = cv.getContext('2d');
          c2d.drawImage(img, 0, 0, 600, 400);
          var data  = c2d.getImageData(0, 0, 600, 400).data;
          var alpha = new Uint8Array(600 * 400);
          for (var p = 0; p < 600 * 400; p++) alpha[p] = data[p * 4 + 3];
          _pzMasks[idx] = alpha;
        } catch(err) { /* file:// / CORS — leave null, use bounding-box fallback */ }
      };
      img.src = 'assets/brain/piece' + (idx + 1) + '.png';
    })(_mi);
  }
}

// Builds the puzzle DOM synchronously.
// Each piece is positioned so canvas point (cx,cy) lands at the target screen location,
// and per-piece drag clamp bounds are stored in dataset so no fragment can leave the screen.
function _pzFinishBuild(imgData, sw, sh, offX, offY, scale, edgeL, edgeR, edgeT, edgeB) {
  if (STATE !== 'puzzle') return;

  // Reset screen to proper block layout (clears the loading-indicator cssText)
  nokiaScreen.style.cssText =
    'position:absolute;left:19.8%;top:19.0%;width:61.9%;height:22.8%;' +
    'background:#0d0d0d;overflow:hidden;z-index:1;box-sizing:border-box;' +
    'display:block;padding:0;';

  // ─── SCATTER TARGETS ─────────────────────────────────────────────────────────
  // Desired screen position (fraction 0–1) for each piece's opaque content centre.
  // To reposition a piece, edit its x/y values below — 0 = screen edge, 1 = opposite edge.
  // Pieces are assigned in order: [0]=left-top [1]=left-mid [2]=left-bot
  //                               [3]=right-top [4]=right-mid [5]=right-bot
  // pad = extra hit-test radius in image pixels (useful for small fragments).
  // At scale ≈ 0.2, pad:20 = ~4 screen pixels of extra tap tolerance.
  var targets = [
    { x: 0.30, y: 0.35, pad: 10 },  // piece1.png
    { x: 0.30, y: 0.60, pad: 20 },  // piece2.png — small fragment; slightly wider hit zone
    { x: 0.25, y: 0.85, pad:  0 },  // piece3.png
    { x: 0.72, y: 0.20, pad:  0 },  // piece4.png
    { x: 0.70, y: 0.50, pad: 10 },  // piece5.png
    { x: 0.60, y: 0.60, pad:  5 },  // piece6.png
  ];

  const GF = 'grayscale(1) brightness(1.8) sepia(1) hue-rotate(85deg) saturate(4)';
  var piecesHTML = '';

  for (var i = 0; i < 6; i++) {
    var d   = imgData[i];
    var t   = targets[i];
    var tsx = sw * t.x;   // convert fraction → screen pixels
    var tsy = sh * t.y;
    // canvas left/top so that this fragment's measured centre lands at target screen position
    var L   = Math.round((tsx - offX) / scale - d.cx);
    var T   = Math.round((tsy - offY) / scale - d.cy);
    // Per-piece drag bounds: keep this fragment's centre within screen
    var lMin = Math.ceil(edgeL  - d.cx);
    var lMax = Math.floor(edgeR - d.cx);
    var tMin = Math.ceil(edgeT  - d.cy);
    var tMax = Math.floor(edgeB - d.cy);
    // Clamp initial scatter position to its own bounds
    L = Math.max(lMin, Math.min(lMax, L));
    T = Math.max(tMin, Math.min(tMax, T));

    // pointer-events:none on pieces — pzCanvas handles all events; pixel-mask
    // logic in _pzPointerDown selects the correct piece.
    // filter on <svg> container (not <image> child) for reliable iOS/WebKit support.
    piecesHTML +=
      '<svg class="pz-piece" data-piece="' + (i+1) + '" data-snapped="false"' +
      ' data-lmin="' + lMin + '" data-lmax="' + lMax + '"' +
      ' data-tmin="' + tMin + '" data-tmax="' + tMax + '"' +
      ' data-pad="' + (t.pad || 0) + '"' +
      ' style="position:absolute;left:' + L + 'px;top:' + T + 'px;' +
      'width:600px;height:400px;z-index:' + (10 + i + 1) + ';overflow:visible;' +
      'pointer-events:none;filter:' + GF + ';">' +
      '<image href="assets/brain/piece' + (i+1) + '.png"' +
      ' x="0" y="0" width="600" height="400"/>' +
      '</svg>';
  }

  nokiaScreen.innerHTML =
    '<div id="pzCanvas"' +
      ' data-scale="' + scale + '" data-snap="100"' +
      ' style="position:absolute;' +
        'left:' + offX + 'px;top:' + offY + 'px;' +
        'width:600px;height:400px;' +
        'transform:scale(' + scale + ');transform-origin:top left;' +
        'touch-action:none;">' +
      '<img id="pzOutline" src="assets/brain/brain_outline.png" draggable="false"' +
        ' style="position:absolute;left:0;top:0;width:600px;height:400px;' +
        'opacity:0.22;pointer-events:none;filter:' + GF + ';">' +
      piecesHTML +
    '</div>' +
    '<div style="position:absolute;bottom:2px;right:4px;' +
      'font-family:\'RuneScape\',monospace;font-size:0.55em;' +
      'color:#4dff91;opacity:0.35;pointer-events:none;">[*] BACK</div>';

  // Transparent full-screen overlay on nokiaScreen — captures every pointer event
  // across the whole LCD area.  This is necessary because pieces are positioned in
  // pzCanvas coordinate space and can overflow pzCanvas's own hit-test boundary;
  // attaching events to pzCanvas alone misses pieces that visually sit to its left.
  var pzOverlay = document.createElement('div');
  pzOverlay.id = 'pzOverlay';
  pzOverlay.style.cssText =
    'position:absolute;left:0;top:0;width:100%;height:100%;' +
    'z-index:50;touch-action:none;';
  pzOverlay.addEventListener('pointerdown',   _pzPointerDown,   { passive: false });
  pzOverlay.addEventListener('pointermove',   _pzPointerMove,   { passive: false });
  pzOverlay.addEventListener('pointerup',     _pzPointerUp,     { passive: false });
  pzOverlay.addEventListener('pointercancel', _pzPointerCancel, { passive: false });
  nokiaScreen.appendChild(pzOverlay);
  // Kick off async mask loading (succeeds on HTTP/HTTPS; silently skipped on file://)
  _pzLoadMasks();
}

function _pzPointerDown(e) {
  if (STATE !== 'puzzle') return;

  // Sort pieces highest-z first — visually topmost piece wins the hit test.
  var pieces = Array.prototype.slice.call(nokiaScreen.querySelectorAll('.pz-piece'));
  pieces.sort(function(a, b) {
    return (parseInt(b.style.zIndex, 10) || 0) - (parseInt(a.style.zIndex, 10) || 0);
  });

  var targetPiece = null;
  for (var _pi = 0; _pi < pieces.length; _pi++) {
    var _p    = pieces[_pi];
    if (_p.dataset.snapped === 'true') continue;
    var _idx  = parseInt(_p.dataset.piece, 10) - 1;
    var _mask = _pzMasks[_idx];
    var _r    = _p.getBoundingClientRect();
    // Convert viewport click → piece image coordinates (0–600, 0–400)
    var _px   = Math.round((e.clientX - _r.left) * (600 / _r.width));
    var _py   = Math.round((e.clientY - _r.top)  * (400 / _r.height));
    var _inBox = (_px >= 0 && _px < 600 && _py >= 0 && _py < 400);
    if (!_inBox) continue;
    var _pad = parseInt(_p.dataset.pad, 10) || 0;
    if (_mask) {
      // Check the exact pixel first; if pad > 0 also scan a neighbourhood box.
      var _hit = false;
      outerLoop: for (var _dy = -_pad; _dy <= _pad; _dy++) {
        for (var _dx = -_pad; _dx <= _pad; _dx++) {
          var _sy = _py + _dy, _sx = _px + _dx;
          if (_sy >= 0 && _sy < 400 && _sx >= 0 && _sx < 600 &&
              _mask[_sy * 600 + _sx] >= 32) { _hit = true; break outerLoop; }
        }
      }
      if (_hit) { targetPiece = _p; break; }
    } else {
      // No mask loaded yet (file:// / CORS) — bounding-box fallback
      targetPiece = _p; break;
    }
  }

  if (!targetPiece) return;

  e.stopPropagation();
  e.preventDefault();
  _pzDrag = {
    piece:    targetPiece,
    origLeft: parseFloat(targetPiece.style.left) || 0,
    origTop:  parseFloat(targetPiece.style.top)  || 0,
    startX:   e.clientX,
    startY:   e.clientY
  };
  e.currentTarget.setPointerCapture(e.pointerId); // capture on pzCanvas
  targetPiece.style.zIndex = ++_pzZTop;           // bring touched piece to front
}

function _pzPointerMove(e) {
  if (!_pzDrag) return;
  e.preventDefault();
  var piece    = _pzDrag.piece;
  var canvas   = document.getElementById('pzCanvas');
  var scale    = canvas ? (parseFloat(canvas.dataset.scale) || 1) : 1;
  // Per-piece bounds keep this fragment's centre within the screen
  var leftMin  = parseFloat(piece.dataset.lmin);
  var leftMax  = parseFloat(piece.dataset.lmax);
  var topMin   = parseFloat(piece.dataset.tmin);
  var topMax   = parseFloat(piece.dataset.tmax);
  var dx   = (e.clientX - _pzDrag.startX) / scale;
  var dy   = (e.clientY - _pzDrag.startY) / scale;
  var newL = _pzDrag.origLeft + dx;
  var newT = _pzDrag.origTop  + dy;
  piece.style.left = Math.max(leftMin, Math.min(leftMax, newL)) + 'px';
  piece.style.top  = Math.max(topMin,  Math.min(topMax,  newT)) + 'px';
}

function _pzPointerUp(e) {
  if (!_pzDrag) return;
  e.currentTarget.releasePointerCapture(e.pointerId); // release from pzCanvas
  e.stopPropagation();

  var piece      = _pzDrag.piece;
  var canvas     = document.getElementById('pzCanvas');
  var snapRadius = canvas ? (parseFloat(canvas.dataset.snap) || 100) : 100;
  var curL = parseFloat(piece.style.left) || 0;
  var curT = parseFloat(piece.style.top)  || 0;
  var dist = Math.sqrt(curL * curL + curT * curT);

  if (dist < snapRadius) {
    sfxPlay('click'); // audible confirmation of snap
    piece.style.transition = 'left 0.18s ease, top 0.18s ease';
    piece.style.left = '0px';
    piece.style.top  = '0px';
    piece.dataset.snapped = 'true';
    piece.style.zIndex = 2;
    setTimeout(function() { if (piece.style) piece.style.transition = ''; }, 220);
    _pzCheckComplete();
  }
  // Leave z-index as-is — last-touched ordering preserved
  _pzDrag = null;
}

function _pzPointerCancel(e) {
  if (!_pzDrag) return;
  e.currentTarget.releasePointerCapture(e.pointerId);
  _pzDrag = null;
}

function _pzCheckComplete() {
  if (STATE !== 'puzzle') return;
  var pieces = nokiaScreen.querySelectorAll('.pz-piece');
  if (!pieces.length) return;
  var allDone = Array.prototype.every.call(pieces, function(p) {
    return p.dataset.snapped === 'true';
  });
  if (allDone) {
    sfxPlay('ringtone');
    // Hold the completed brain on screen for 2.5 s before transitioning to reveal
    revealTimer = setTimeout(function() {
      saveProgress();
      window.parent.postMessage({ type: 'nokia-puzzle-complete' }, '*');
      renderReveal();
    }, 2500);
  }
}

function handlePuzzle(action) {
  if (action === 'lsoft') { _pzDrag = null; renderMenu(); return; }
  // All other input is consumed by the drag system
}

// =====================================================================
//  STATE 5 — REVEAL (letter-by-letter typewriter)
// =====================================================================
function renderReveal() {
  clearTimers();
  STATE = 'reveal';
  screenBase();
  nokiaScreen.innerHTML =
    '<div id="rvTxt" style="font-size:0.9em;line-height:1.45;padding:0 2px;white-space:nowrap"></div>';
  const el  = nokiaScreen.querySelector('#rvTxt');
  const msg = CONFIG.REVEAL_MESSAGE;
  let i = 0;
  (function tick() {
    if (i <= msg.length) {
      el.textContent = msg.slice(0, i++);
      revealTimer = setTimeout(tick, 52); // ← REVEAL TYPEWRITER SPEED ms/char
    } else {
      revealTimer = setTimeout(function() {
        window.parent.postMessage({ type: 'nokia-return' }, '*');
      }, 1800);
    }
  })();
}


// =====================================================================
//  SFX ENGINE  (Web Audio API + pooled <audio> fallback)
// =====================================================================
// Mirrors the system used in go/index.html for consistent behaviour.
//
// Key improvements over the old engine:
//  • MP3s are fetched immediately on page load (no gesture required for fetch)
//  • AudioContext + decode happen on first gesture, so buffers are always
//    ready before the user can trigger a sound
//  • Pooled <audio> fallback fires if Web Audio isn't ready yet
//  • Per-sound gain nodes for independent volume control
//  • Silent heartbeat every 25 s keeps iOS from suspending the context
//  • visibilitychange resume when the page comes back into focus
;(function() {
  var SOUNDS  = { click: 0.6, ringtone: 0.9, password: 0.75 };
  var POOL_SZ = { click: 6,   ringtone: 2,   password: 3    };

  var ctx            = null;
  var master         = null;
  var unlocked       = false;
  var heartbeatTimer = null;
  var fetched        = {};   // name -> ArrayBuffer
  var buffers        = {};   // name -> AudioBuffer
  var pools          = {};   // name -> { els: [], i: 0 }

  // ── HTMLAudio pool (fallback) ───────────────────────────────────────
  function ensurePool(name) {
    if (pools[name]) return pools[name];
    var n = POOL_SZ[name] || 3;
    var els = [];
    for (var i = 0; i < n; i++) {
      var a = new Audio('assets/' + name + '.mp3');
      a.preload = 'auto';
      a.volume  = SOUNDS[name] || 1;
      els.push(a);
    }
    pools[name] = { els: els, i: 0 };
    return pools[name];
  }
  // Pre-build all pools immediately — iOS starts buffering right away
  Object.keys(SOUNDS).forEach(function(n) { ensurePool(n); });

  function playFromPool(name) {
    var pool = ensurePool(name);
    var a = pool.els[pool.i];
    pool.i = (pool.i + 1) % pool.els.length;
    try {
      a.pause();
      a.currentTime = 0;
      var p = a.play();
      if (p && typeof p.catch === 'function') p.catch(function() {});
    } catch(e) {}
  }

  // ── Web Audio ───────────────────────────────────────────────────────
  function fetchAll() {
    Object.keys(SOUNDS).forEach(function(name) {
      fetch('assets/' + name + '.mp3', { cache: 'force-cache' })
        .then(function(r) { return r.arrayBuffer(); })
        .then(function(ab) { fetched[name] = ab; })
        .catch(function() {});
    });
  }

  function ensureContext() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 1;
    master.connect(ctx.destination);
    return ctx;
  }

  function startHeartbeat() {
    if (heartbeatTimer) return;
    heartbeatTimer = setInterval(function() {
      if (!ctx || !master || ctx.state !== 'running') return;
      try {
        var buf = ctx.createBuffer(1, 1, ctx.sampleRate);
        var src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(master);
        src.start(0);
      } catch(e) {}
    }, 25000);
  }

  function decodeAll(cb) {
    if (!ctx) return;
    if (ctx.state === 'suspended') {
      ctx.resume().catch(function() {});
    }
    var names = Object.keys(SOUNDS);
    var pending = 0;
    names.forEach(function(name) {
      if (buffers[name]) return;
      var ab = fetched[name];
      if (!ab) return;
      pending++;
      ctx.decodeAudioData(ab.slice(0),
        function(buf) { buffers[name] = buf; pending--; if (pending === 0 && cb) cb(); },
        function()    { pending--;            if (pending === 0 && cb) cb(); }
      );
    });
    if (pending === 0 && cb) cb();
  }

  function unlockNow() {
    if (unlocked) return;
    unlocked = true;
    ensureContext();
    decodeAll(function() {
      // iOS warm-up blip — kicks context into "running" state
      if (ctx && master && ctx.state === 'running') {
        try {
          var osc = ctx.createOscillator();
          var g   = ctx.createGain();
          g.gain.value = 0.0001;
          osc.connect(g);
          g.connect(master);
          osc.start();
          osc.stop(ctx.currentTime + 0.01);
        } catch(e) {}
      }
      startHeartbeat();
    });
    // Also always resume in case context was suspended
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(function() {});
  }

  function playWebAudio(name) {
    if (!ctx || !master || !buffers[name]) return false;
    try {
      var src = ctx.createBufferSource();
      src.buffer = buffers[name];
      var g = ctx.createGain();
      g.gain.value = SOUNDS[name] || 1;
      src.connect(g);
      g.connect(master);
      src.start(0);
      return true;
    } catch(e) { return false; }
  }

  // Resume context when page comes back into focus
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && ctx && ctx.state === 'suspended') {
      ctx.resume().catch(function() {});
    }
  });

  // Fetch immediately — no gesture required
  fetchAll();

  // Unlock on first gesture (whichever fires first)
  var _gestureEvents = ['touchstart', 'pointerdown', 'mousedown', 'keydown'];
  _gestureEvents.forEach(function(ev) {
    document.addEventListener(ev, function _prime() {
      unlockNow();
      _gestureEvents.forEach(function(e2) {
        document.removeEventListener(e2, _prime, true);
      });
    }, { capture: true, passive: true });
  });

  // ── Public API ──────────────────────────────────────────────────────
  window.sfxPlay = function(name) {
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(function() {});
    var ok = playWebAudio(name);
    if (!ok) playFromPool(name);
  };

})();

// =====================================================================
//  EVENT SYSTEM  (structure identical to Step 2 — unchanged)
// =====================================================================

// Block right-click context menu and drag-selection on the entire page
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('selectstart',  (e) => e.preventDefault());

// Disable iOS pinch-to-zoom and gesture-zoom.
// iOS 10+ ignores viewport user-scalable=no, so JS is required at every stage.
document.addEventListener('gesturestart',  (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gestureend',    (e) => e.preventDefault(), { passive: false });
// Block any two-finger touch at start (before it can register as a zoom gesture)
document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', (e) => {
  // Block multi-touch always; block single-touch during puzzle (prevents iOS zoom-on-drag)
  if (e.touches.length > 1 || STATE === 'puzzle') e.preventDefault();
}, { passive: false });

nokiaKeypad.addEventListener('touchstart', (e) => {
  const key = e.target.closest('.nokia-key');
  if (!key) return;
  e.stopPropagation();
}, { passive: false });

nokiaKeypad.addEventListener('click', (e) => {
  const key = e.target.closest('.nokia-key');
  if (!key) return;
  e.stopPropagation();
  handleButton(key.dataset.action);
});

nokiaScreen.addEventListener('click', (e) => {
  e.stopPropagation();
  handleButton('screen');
});

document.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    Enter:'ok', Backspace:'lsoft', Escape:'lsoft',
    '0':'key0','1':'key1','2':'key2','3':'key3','4':'key4',
    '5':'key5','6':'key6','7':'key7','8':'key8','9':'key9',
    '*':'star','#':'hash',
  };
  const action = map[e.key];
  if (action) { e.preventDefault(); handleButton(action); }
});

// Fade in only after background image is loaded — prevents black flash on arrival
(function() {
  var img = new Image();
  img.onload = function() {
    document.body.style.transition = 'opacity 0.4s ease';
    document.body.style.opacity = '1';
  };
  img.onerror = function() {
    // Fallback: show page anyway if image fails
    document.body.style.transition = 'opacity 0.4s ease';
    document.body.style.opacity = '1';
  };
  img.src = 'assets/background.png';
})();

// Back button — play click sound, fade body out, then navigate
document.getElementById('siteBackBtn').addEventListener('click', function(e) {
  e.preventDefault();
  var dest = this.href;
  try { new Audio('../sounds/click.mp3').play(); } catch(err) {}
  document.body.style.transition = 'opacity 0.35s ease';
  document.body.style.opacity = '0';
  setTimeout(function() { window.location.href = dest; }, 350);
});

// =====================================================================
//  CENTRAL DISPATCH
// =====================================================================
function handleButton(action) {
  showDebug(action);
  // Play click for every keypad/keyboard press (not screen taps)
  if (action !== 'screen') sfxPlay('click');
  // Remap physical keys → logical actions
  // * = back, # = navigate (cycle down with wrap), 0 = ok (except in PIN so digit 0 still works)
  if (action === 'star')                       action = 'lsoft';
  if (action === 'hash')                       action = 'down';
  if (action === 'key0' && STATE !== 'pin')    action = 'ok';
  switch (STATE) {
    case 'idle':
      if (action === 'lsoft') {
        if (window !== window.top) window.parent.postMessage({ type: 'nokia-return' }, '*');
        return;
      }
      pinBuffer = '';
      renderPin(false);
      // Forward the digit if the first press was a number key
      { const NUM = {key0:'0',key1:'1',key2:'2',key3:'3',key4:'4',
                     key5:'5',key6:'6',key7:'7',key8:'8',key9:'9'};
        if (NUM[action] !== undefined) handlePin(action); }
      break;
    case 'pin':    handlePin(action);    break;
    case 'menu':       handleMenu(action);      break;
    case 'puzzleintro': /* locked during typewriter */ break;
    case 'puzzle':     handlePuzzle(action);    break;
    case 'reveal':     /* locked during typewriter */ break;
  }
}

// ── Debug (no-op — badge removed) ────────────────────────────────────
function showDebug(action) {}

// ── Boot ──────────────────────────────────────────────────────────────
(function boot() {
  loadProgress();
  renderIdle();
  // When embedded in an iframe: hide back button, use white background
  if (window !== window.top) {
    const btn = document.getElementById('siteBackBtn');
    if (btn) btn.style.display = 'none';
    document.documentElement.style.background = '#ffffff';
    document.body.style.background = '#ffffff';
    document.body.style.backgroundImage = 'none';
  }
})();
</script>
